    ["Tokens", row.tokens === undefined ? "—" : formatTokens(row.tokens)],
    ["请求", row.requests === undefined ? "—" : String(row.requests)],
    ["工具调用", row.tools === undefined ? "—" : String(row.tools)],
    ["费用", row.cost === undefined ? "—" : formatCost(row.cost)],
    ["生成速率", row.tps === undefined || row.tone !== "running" ? "—" : `${formatTps(row.tps)} t/s`],
  ];
  const facts = [["分支", row.agent.branchName], ["产出", row.agent.outputPath], ["补丁", row.agent.patchPath]].filter(([, value]) => typeof value === "string" && value !== "");
  const clamped = !state.taskOpen && (row.task ?? "").length > 220;
  return (
    `<div class="ad-inspector">` +
    `<header class="ad-ins-head">` +
    `<div class="ad-ins-id">` +
    (parent ? `<button type="button" class="ad-ins-crumb" data-select="${parent.id}">${icon("arrow-u", "xs")}${parent.name}</button>` : "") +
    `<h3 title="${row.name}">${row.name}</h3>` +
    `<div class="ad-ins-sub">` +
    `<span class="ad-status" data-tone="${row.tone}"><i aria-hidden="true"></i><span>${row.statusText}</span></span>` +
    `<span class="ad-ins-model" title="实际模型: ${row.model}">${row.modelLabel}${row.role ? `<em>${row.role}</em>` : ""}</span>` +
    `</div></div>` +
    (close ? `<button type="button" class="icon-btn small ad-ins-close" data-close-sheet="1" aria-label="关闭" data-tip="关闭">${icon("x", "sm")}</button>` : "") +
    `</header>` +
    `<div class="ad-ins-actions">` +
    `<button type="button" class="btn small primary">${icon(row.main ? "arrow-l" : "message", "sm")}${row.main ? "返回主对话" : "打开对话"}</button>` +
    (row.main ? "" : `<button type="button" class="btn small">${icon("sparkles", "sm")}BTW 提问</button>`) +
    (row.main ? "" : `<button type="button" class="btn small">${icon("external", "sm")}Agent Hub</button>`) +
    (row.main
      ? ""
      : row.agent.status === "parked"
        ? `<button type="button" class="btn small">${icon("refresh", "sm")}恢复</button>`
        : `<button type="button" class="btn small danger">${icon("stop", "sm")}停止</button>`) +
    `</div>` +
    `<section class="ad-ins-section"><h4>当前阶段</h4>` +
    `<div class="ad-ins-now"${row.tone === "running" ? ' data-running="true"' : ""}>${icon(row.tone === "failed" ? "alert" : row.tone === "waiting" ? "clock" : "pulse", "sm")}<span>${row.stage ?? "暂无阶段信息"}</span></div>` +
    (row.progress !== undefined || row.steps
      ? `<div class="ad-ins-progress"><span class="ad-ins-bar"><i style="inline-size:${((row.progress ?? 0) * 100).toFixed(1)}%"></i></span>` +
        `<span class="ad-ins-pct">${row.steps ? `步骤 ${row.steps.completed}/${row.steps.total}` : `${Math.round((row.progress ?? 0) * 100)}%`}</span></div>`
      : "") +
    (trail.length
      ? `<ol class="ad-ins-trail" aria-label="阶段足迹">${trail.map((mark) => `<li><time>${tickLabel(mark.at, 0)}</time><span>${mark.text}</span></li>`).join("")}</ol>`
      : "") +
    `</section>` +
    (row.task
      ? `<section class="ad-ins-section"><h4>任务</h4><p class="ad-ins-task"${clamped ? ' data-clamped="true"' : ""}>${row.task}</p>` +
        (row.task.length > 220 ? `<button type="button" class="ad-link" data-task-toggle="1">${state.taskOpen ? "收起" : "展开全文"}</button>` : "") +
        `</section>`
      : "") +
    `<section class="ad-ins-section"><h4>用量</h4><dl class="ad-ins-tiles">` +
    tiles.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join("") +
    `</dl>` +
    (context !== undefined
      ? `<div class="ad-ins-context"${context > 0.8 ? ' data-high="true"' : ""}><span>上下文</span>` +
        `<span class="ad-ins-bar"><i style="inline-size:${(context * 100).toFixed(1)}%"></i></span>` +
        `<span>${formatTokens(row.context.used)} / ${formatTokens(row.context.window)}</span></div>`
      : "") +
    `</section>` +
    (facts.length || row.agent.isolated
      ? `<section class="ad-ins-section"><h4>产出</h4><dl class="ad-ins-facts">` +
        facts.map(([label, value]) => `<div><dt>${label}</dt><dd><code title="${value}">${value}</code></dd></div>`).join("") +
        (row.agent.isolated ? `<div><dt>隔离</dt><dd>${icon("shield", "xs")}</dd></div>` : "") +
        `</dl></section>`
      : "") +
    (children.length
      ? `<section class="ad-ins-section"><h4>子 Agent<span>${children.length}</span></h4><div class="ad-ins-children">` +
        children.map((child) => `<button type="button" class="ad-chip-agent" data-select="${child.id}"><span>${child.name}</span><i class="ad-dot" data-tone="${child.tone}" aria-hidden="true"></i></button>`).join("") +
        `</div></section>`
      : "") +
    `</div>`
  );
}

function summaryHtml() {
  const byModel = [...ROWS.filter((row) => row.tokens).reduce((map, row) => map.set(row.modelLabel, (map.get(row.modelLabel) ?? 0) + row.tokens), new Map())]
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);
  const top = ROWS.filter((row) => !row.main && row.tokens).sort((a, b) => b.tokens - a.tokens).slice(0, 3);
  const maxModel = Math.max(1, ...byModel.map(([, value]) => value));
  const children = Math.max(1, TOTALS.children);
  let offset = 0;
  return (
    `<div class="ad-summary">` +
    `<header><h3>整体</h3><p>选择一个 Agent 查看详情</p></header>` +
    `<div class="ad-summary-donut">` +
    `<svg viewBox="0 0 64 64" aria-hidden="true"><circle class="ad-donut-track" cx="32" cy="32" r="26"></circle>` +
    STATUS_ORDER.map((group) => {
      const share = TOTALS.groups[group] / children;
      const element = share > 0
        ? `<circle class="ad-donut-seg" data-group="${group}" cx="32" cy="32" r="26" pathLength="100" stroke-dasharray="${Math.max(0, share * 100 - 1.5).toFixed(2)} 100" stroke-dashoffset="${(-offset * 100).toFixed(2)}"></circle>`
        : "";
      offset += share;
      return element;
    }).join("") +
    `</svg>` +
    `<div class="ad-donut-center"><strong>${TOTALS.children}</strong><span>子 Agent</span></div>` +
    `<ul>${STATUS_ORDER.map((group) => `<li data-group="${group}"><i aria-hidden="true"></i>${GROUP_LABEL[group]}<span>${TOTALS.groups[group]}</span></li>`).join("")}</ul>` +
    `</div>` +
    `<dl class="ad-ins-tiles is-summary">` +
    `<div><dt>Tokens</dt><dd>${formatTokens(TOTALS.tokens)}</dd></div>` +
    `<div><dt>费用</dt><dd>${formatCost(TOTALS.cost)}</dd></div>` +
    `<div><dt>峰值并发</dt><dd>3</dd></div>` +
    `</dl>` +
    (byModel.length
      ? `<section class="ad-ins-section"><h4>按模型的 Tokens</h4><ul class="ad-bars">` +
        byModel.map(([model, tokens]) => `<li><span class="ad-bars-label" title="${model}">${model}</span><span class="ad-bars-track"><i style="inline-size:${((tokens / maxModel) * 100).toFixed(1)}%"></i></span><span class="ad-bars-value">${formatTokens(tokens)}</span></li>`).join("") +
        `</ul></section>`
      : "") +
    (top.length
      ? `<section class="ad-ins-section"><h4>消耗最多</h4><div class="ad-ins-children is-list">` +
        top.map((row) => `<button type="button" class="ad-chip-agent" data-select="${row.id}"><span>${row.name}</span><em>${formatTokens(row.tokens)}</em></button>`).join("") +
        `</div></section>`
      : "") +
    `</div>`
  );
}

function stageViewHtml(view) {
  if (view === "formation") {
    const lens = state.tier === "bridge" ? "" : `<div class="ad-lens">${statusChipsHtml()}</div>`;
    return `<div class="ad-pane-fill">${paneHeadHtml()}${lens}${formationHtml()}</div>`;
  }
  return `<div class="ad-pane-fill">${commsHtml()}</div>`;
}

function render() {
  const bridge = state.tier === "bridge";
  const row = selectedRow();
  const sheetOpen = row !== null && state.sheet;
  deck.dataset.tier = bridge ? "bridge" : "side";
  const sheet = sheetOpen ? `<div class="ad-sheet" role="dialog" aria-label="${row.name}">${inspectorHtml(row, true)}</div>` : "";
  if (bridge) {
    deck.innerHTML =
      `<div class="ad-bridge">` +
      `<aside class="ad-crew" aria-label="${state.view === "formation" ? "编队" : "通讯"}">` +
      pulseHtml() +
      `<div class="ad-bar">${tabsHtml()}</div>` +
      `<div class="ad-crew-list"${sheetOpen ? ' inert aria-hidden="true"' : ""}>${stageViewHtml(state.view)}</div>` +
      `</aside>` +
      `<aside class="ad-side" aria-label="${row ? row.name : "整体"}"><div class="ad-side-body">${row ? inspectorHtml(row, false) : summaryHtml()}</div></aside>` +
      `</div>${sheet}`;
  } else {
    deck.innerHTML =
      pulseHtml() +
      `<div class="ad-body"><div class="ad-pane" role="tabpanel"${sheetOpen ? ' inert aria-hidden="true"' : ""}>${stageViewHtml("formation")}</div>${sheet}</div>`;
  }
}

function choose(id, toggle = true) {
  if (state.tier === "bridge") {
    state.selected = toggle && state.selected === id ? null : id;
    state.sheet = false;
  } else {
    state.selected = id;
    state.sheet = true;
  }
  state.taskOpen = false;
  render();
}

/* ── events ── */
deck.addEventListener("click", (event) => {
  const select = event.target.closest("[data-select]");
  if (select) {
    choose(select.dataset.select, !event.target.closest(".ad-post, .ad-person, .ad-to, .ad-post-from"));
    return;
  }
  if (event.target.closest("[data-close-sheet]")) {
    state.sheet = false;
    state.selected = null;
    render();
    return;
  }
  const fold = event.target.closest("[data-fold]");
  if (fold) {
    const id = fold.dataset.fold;
    state.collapsed = state.collapsed.includes(id) ? state.collapsed.filter((item) => item !== id) : [...state.collapsed, id];
    render();
    return;
  }
  const tab = event.target.closest("[data-view]");
  if (tab) {
    state.view = tab.dataset.view;
    render();
    return;
  }
  if (event.target.closest("[data-expand]")) {
    state.expanded = !state.expanded;
    frame.dataset.expanded = String(state.expanded);
    render();
    return;
  }
  const commFilter = event.target.closest("[data-comm-filter]");
  if (commFilter) {
    state.commFilter = commFilter.dataset.commFilter;
    render();
    return;
  }
  const grouping = event.target.closest("[data-grouping]");
  if (grouping) {
    state.grouping = grouping.dataset.grouping;
    render();
    return;
  }
  const density = event.target.closest("[data-density]");
  if (density) {
    state.density = density.dataset.density;
    render();
    return;
  }
  const chip = event.target.closest("[data-chip]");
  if (chip) {
    const group = chip.dataset.chip;
    state.groups = state.groups.includes(group) ? state.groups.filter((item) => item !== group) : [...state.groups, group];
    if (state.groups.length) state.lens = true;
    render();
    return;
  }
  const ribbon = event.target.closest(".ad-ribbon-seg");
  if (ribbon) {
    const group = ribbon.dataset.group;
    state.groups = state.groups.includes(group) ? state.groups.filter((item) => item !== group) : [...state.groups, group];
    if (state.groups.length) state.lens = true;
    render();
    return;
  }
  if (event.target.closest("[data-task-toggle]")) {
    state.taskOpen = !state.taskOpen;
    render();
    return;
  }
});

deck.addEventListener("input", (event) => {
  if (event.target.matches(".ad-search input")) {
    state.query = event.target.value;
    const caret = event.target.selectionStart;
    render();
    const next = deck.querySelector(".ad-search input");
    if (next) {
      next.focus();
      next.setSelectionRange(caret, caret);
    }
  }
});

deck.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (state.sheet) {
      event.preventDefault();
      state.sheet = false;
      state.selected = null;
      render();
    } else if (state.selected) {
      event.preventDefault();
      state.selected = null;
      render();
    }
  }
});


const observer = new ResizeObserver(() => {
  const tier = deck.clientWidth >= 880 ? "bridge" : "side";
  if (tier === state.tier) return;
  state.tier = tier;
  state.sheet = false;
  if (tier === "side") state.view = "formation";
  render();
});

render();
observer.observe(deck);
</script>
  </body>
</html>
