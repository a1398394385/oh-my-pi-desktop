<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Hub</title>
    <style>


/* ── styles/tokens.css ── */
/* ============================================================
   OMP Studio — Design Tokens
   Light / Dark 双主题，通过 html[data-theme] 切换
   ============================================================ */

/* The motion patterns travel with the tokens they spend: every entry that
   loads this file gets the shared keyframes, the surface classes and the
   reduced-motion policy with it. */
/* ── styles/motion.css ── */
/* ============================================================
   OMP Studio — Motion
   ------------------------------------------------------------
   Everything that moves is one of the patterns below. Component CSS picks a
   pattern and a token; it does not invent a duration, a curve, an entrance
   keyframe or a reduced-motion rule of its own (scripts/check-renderer-motion.mjs
   holds that line). The numbers are in tokens.css; timers and WAAPI read the
   same numbers from src/motion.ts.

   Pattern   What changes                          Arrive              Leave
   --------  ------------------------------------  ------------------  ------------------
   state     colour, opacity, a press              fast · ease         fast · ease
   element   chevron, switch, popover, dialog,     base · ease-out     fast · ease-in
             a row revealing                       (popover: fast)
   region    a panel, a drawer, a card body        slow · ease-out     slow or base · ease-out
             changing size or place                                    (its neighbours land
                                                                       too, so it decelerates
                                                                       both ways)
   surface   a page, a tab pane, a deck cell,      slower · ease-nav   slow · ease-nav
             a toast                                                   (fast · ease when the
                                                                       next thing waits)
   hero      ask genie, a list unfolding           hero · ease-nav /   slow or slower
                                                   ease-emphasis

   A leave the next thing waits for (page swap, conversation switch) is a quick
   dissolve that front-loads its change with --ease, so the click is answered in
   the first frames. A leave nothing waits for accelerates away with --ease-in.

   Space
   - Depth runs vertically, and only the upper level travels. A level that
     opens over another (a page over the workbench, an editor over its list, a
     sheet, a notice) rises into place and sinks back out the way it came; the
     level underneath dissolves and returns where it stands.
   - Siblings run horizontally. The next page, tab, question or step arrives
     from the right when it comes later in the order the user can see (further
     along a strip, further down a list) and from the left when it comes
     earlier; the old one drifts out of the other side, so both halves read as
     one movement.
   - Things attached to an anchor (menus, tips) grow out of it; they do not
     travel.
   - Distance follows size, --shift-xs for one element up to --shift-lg for a
     surface. A surface drifts half as far leaving as it travelled arriving.

   Rules
   - Arrivals animate opacity, translate and scale only. The entrance keyframes
     have no `to` frame and fill backwards, so nothing stays transformed
     afterwards: a fixed overlay inside the surface is not trapped in its
     stacking context once it has landed. They use the individual `translate` /
     `scale` properties, so they compose with whatever `transform` the element
     already uses for its own placement.
   - Layout properties animate only where the layout is the message (a panel
     resizing, a card unfolding).
   - Loops are status. They are stilled, never removed.
   - Reduced motion has one home, at the bottom of this file. Components do not
     write `@media (prefers-reduced-motion)`; one that needs a different *still*
     picture keys it off `:root[data-perf-tier~="L1"]`.
   ============================================================ */

/* ---------- Recipes ----------------------------------------------------------
   An `animation` value, complete: keyframe, duration, curve and fill travel
   together, so every popover in the app changes by editing one line.
     animation: var(--motion-pop); */
:root {
  /* Grows out of its anchor: menu, select popup, hover card. */
  --motion-pop: omp-pop-in var(--dur-fast) var(--ease-out) backwards;
  /* Content appearing in the flow: a note, a result, an inline panel. */
  --motion-reveal: omp-rise-in var(--dur) var(--ease-out) backwards;
  /* A body opening under the header that owns it. */
  --motion-unfold: omp-drop-in var(--dur) var(--ease-out) backwards;
  /* Content replaced in place: a detail pane following its list. It starts
     half visible, so the pane never blinks empty between two selections. */
  --motion-swap: omp-swap-in var(--dur-fast) var(--ease-out) backwards;
  /* Floats over the page with nothing to anchor to: modal, dialog, palette. */
  --motion-sheet: omp-sheet-in var(--dur) var(--ease-out) backwards;
  --motion-sheet-out: omp-sheet-out var(--dur-fast) var(--ease-in) forwards;
  /* The layer behind a sheet, and anything else that only fades. */
  --motion-fade: omp-fade-in var(--dur-fast) var(--ease) backwards;
  --motion-fade-out: omp-fade-out var(--dur-fast) var(--ease-in) forwards;
  /* A notice from the window edge. `--toast-from` is the edge: 1 below, -1 above. */
  --motion-toast: omp-toast-in var(--dur-slower) var(--ease-out) backwards;
  --motion-toast-out: omp-toast-out var(--dur-slow) var(--ease-in) forwards;
}

/* `--pop-from` is the side the anchor is on: -1 above (the default: the
   popover drops out of it), 1 below (a menu that opens upward rises out of it).
   Registered so it does not inherit: a flyout inside an upward menu keeps its
   own side. */
@property --pop-from { syntax: "<number>"; inherits: false; initial-value: -1; }
@keyframes omp-pop-in {
  from { opacity: 0; translate: 0 calc(var(--shift-xs) * var(--pop-from)); scale: 0.97; }
}
@keyframes omp-rise-in {
  from { opacity: 0; translate: 0 var(--shift-xs); }
}
@keyframes omp-drop-in {
  from { opacity: 0; translate: 0 calc(var(--shift-xs) * -1); }
}
@keyframes omp-swap-in {
  from { opacity: 0.4; translate: 0 var(--shift-xs); }
}
@keyframes omp-sheet-in {
  from { opacity: 0; translate: 0 var(--shift-sm); scale: 0.98; }
}
@keyframes omp-sheet-out {
  to { opacity: 0; translate: 0 var(--shift-xs); scale: 0.98; }
}
@keyframes omp-fade-in {
  from { opacity: 0; }
}
@keyframes omp-fade-out {
  to { opacity: 0; }
}
@keyframes omp-toast-in {
  from { opacity: 0; translate: 0 calc(var(--shift-md) * var(--toast-from, 1)); }
}
@keyframes omp-toast-out {
  to { opacity: 0; translate: 0 calc(var(--shift-sm) * var(--toast-from, 1)); }
}

/* ---------- Surfaces ---------------------------------------------------------
   One pair of keyframes for every surface that arrives from somewhere. The
   offsets are registered and do not inherit: a page setting `--enter-y` must
   not hand it to a pane that enters inside the page. */
@property --enter-x { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --enter-y { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --exit-x { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --exit-y { syntax: "<length>"; inherits: false; initial-value: 0px; }

@keyframes omp-enter {
  from { opacity: 0; translate: var(--enter-x) var(--enter-y); }
}
@keyframes omp-exit {
  to { opacity: 0; translate: var(--exit-x) var(--exit-y); }
}

/* A sequential swap: two surfaces that cannot share the layout. The old one
   dissolves for MOTION_MS.fast (the wait in pageTransition.ts), then the new
   one arrives. `.page-out` / `.page-in` are set by `pagePhaseClass()`, and
   `data-page-dir="back"` by `pageDir()` when the swap goes back.

   Depth is the default: opening a level, the one underneath dissolves in place
   and the new one rises; going back, the upper level sinks the way it came and
   the one underneath returns in place. */
.page-in {
  --enter-y: var(--shift-md);
  animation: omp-enter var(--dur-slower) var(--ease-nav) backwards;
}
.page-out {
  animation: omp-exit var(--dur-fast) var(--ease) both;
  pointer-events: none;
}
.page-out[data-page-dir="back"] {
  --exit-y: var(--shift-sm);
}
.page-in[data-page-dir="back"] {
  --enter-y: 0px;
}
/* The two fixed roles: the workbench is the ground level every page opens
   over, and a page's shell is always the upper level (page to page swaps move
   `.page-body`, not the shell). */
.app-body.page-in {
  --enter-y: 0px;
}
.page.page-out {
  --exit-y: var(--shift-sm);
}

/* Siblings swapped the same way (`data-page-axis="x"`): pages along the
   navigation, tabs whose panels cannot overlap. Both halves travel sideways. */
.page-in[data-page-axis="x"] {
  --enter-y: 0px;
  --enter-x: var(--shift-lg);
}
.page-in[data-page-axis="x"][data-page-dir="back"] {
  --enter-x: calc(var(--shift-lg) * -1);
}
.page-out[data-page-axis="x"] {
  --exit-y: 0px;
  --exit-x: calc(var(--shift-sm) * -1);
}
.page-out[data-page-axis="x"][data-page-dir="back"] {
  --exit-x: var(--shift-sm);
}

/* Siblings that can overlap: two panes cross-fade in place while the same
   sideways drift says which way the user went. Both are on screen at once, so
   the old one gets out of the way on the same brisk curve. The overlap window
   in JS is TAB_PANE_MS. */
.tab-pane-enter-fwd,
.hub-face-enter-fwd,
.dk-cell-enter-fwd {
  --enter-x: var(--shift-lg);
}
.tab-pane-enter-back,
.hub-face-enter-back,
.dk-cell-enter-back {
  --enter-x: calc(var(--shift-lg) * -1);
}
.tab-pane-leave-fwd,
.hub-face-leave-fwd,
.dk-cell-leave-fwd {
  --exit-x: calc(var(--shift-sm) * -1);
}
.tab-pane-leave-back,
.hub-face-leave-back,
.dk-cell-leave-back {
  --exit-x: var(--shift-sm);
}
.tab-pane-enter-fwd,
.tab-pane-enter-back,
.hub-face-enter-fwd,
.hub-face-enter-back,
.dk-cell-enter-fwd,
.dk-cell-enter-back {
  animation: omp-enter var(--dur-slower) var(--ease-nav) backwards;
}
.tab-pane-leave-fwd,
.tab-pane-leave-back,
.hub-face-leave-fwd,
.hub-face-leave-back,
.dk-cell-leave-fwd,
.dk-cell-leave-back {
  animation: omp-exit var(--dur-slow) var(--ease-nav) both;
  pointer-events: none;
}

/* ---------- Theme ------------------------------------------------------------
   A theme change is the whole window changing state. Left alone, each surface
   goes at its own pace (panels snap, the page background and some borders are
   still fading 250ms later) and the window tears along its panel edges, so the
   window is cross-faded as one snapshot instead. themeTransition.ts sets the
   attribute for the length of the dissolve. */
:root[data-theme-transition]::view-transition-group(*),
:root[data-theme-transition]::view-transition-old(*),
:root[data-theme-transition]::view-transition-new(*) {
  animation-duration: var(--dur-slow);
  animation-timing-function: var(--ease);
}
/* The window stays usable under the dissolve. */
:root[data-theme-transition]::view-transition {
  pointer-events: none;
}
/* The new theme is painted in one go underneath; a surface still easing its
   own colours would lag behind the dissolve. */
:root[data-theme-transition] *,
:root[data-theme-transition] *::before,
:root[data-theme-transition] *::after {
  transition-duration: 0s !important;
}

/* ---------- Loops ------------------------------------------------------------
   Status signals. `rotate` / `translate` rather than `transform`, so a loop can
   sit on an element that is already transformed. */
@keyframes omp-spin {
  to { rotate: 360deg; }
}
@keyframes omp-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
@keyframes omp-sweep {
  from { translate: -100% 0; }
  to { translate: 100% 0; }
}
/* The ambient light field (styles/light.css): a slow wander, run `alternate`
   so it is at rest at both ends. Each spot sets its own `--drift-x/-y`. */
@keyframes omp-field-drift {
  to { translate: var(--drift-x, 0px) var(--drift-y, 0px); scale: 1.12; }
}

/* ==========================================================================
   Reduced motion
   --------------------------------------------------------------------------
   One policy. In the app the OS preference, the `omp.perf.motion` switch and a
   low machine tier all arrive as `data-perf-tier~="L1"` before the first frame
   (main.tsx → perf/tierControl.ts). The media query repeats the clamp for a
   document that never ran tier control (a test harness). src/motion.ts answers
   the same question for timers (`motionReduced()`), so a JS wait can never
   outlast the CSS it is waiting for.

   Nothing is removed. Animations collapse to ~0 with a single iteration, which
   holds the last painted frame: a state change is still a state change, a
   spinner is still where it was. Entrance delays collapse too, so a cascade
   lands at once instead of popping in piece by piece; transition delays are
   left alone, because some of them are how long a pointer must rest before
   something reacts. Signals that are only legible while they move get a still
   picture below, next to the rule that takes their motion away.

   Transitions are exactly 0s, not "nearly": this rule reaches every element,
   and an element that never declared a transition still has
   `transition-property: all`. Any duration above zero would have each of them
   start a transition for every inherited value that is recomputed — measured
   at 1,700–3,100 transitions and frames of 300–1,250ms per click on the
   workbench, on the tier meant for slow machines. At 0s none is created.
   Nothing may therefore wait on `transitionend` alone; ask `motionReduced()`.
   ========================================================================== */
:root[data-perf-tier~="L1"] *,
:root[data-perf-tier~="L1"] *::before,
:root[data-perf-tier~="L1"] *::after,
:root[data-perf-tier~="L1"] *::backdrop,
:root[data-perf-tier~="L1"]::view-transition-group(*),
:root[data-perf-tier~="L1"]::view-transition-image-pair(*),
:root[data-perf-tier~="L1"]::view-transition-old(*),
:root[data-perf-tier~="L1"]::view-transition-new(*) {
  animation-duration: 0.01ms !important;
  animation-delay: 0s !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0s !important;
  scroll-behavior: auto !important;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after,
  *::backdrop,
  ::view-transition-group(*),
  ::view-transition-image-pair(*),
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0s !important;
    scroll-behavior: auto !important;
  }
}

/* Pulse says "running" through opacity alone; a held frame can land at 0.35
   and read as disabled, so it is pinned opaque. */
:root[data-perf-tier~="L1"] .dot.pulse {
  opacity: 1 !important;
}

/* Skeleton: a band frozen mid-sweep looks like a rendering fault. */
:root[data-perf-tier~="L1"] .skeleton {
  background: var(--surface-3) !important;
}
:root[data-perf-tier~="L1"] .skeleton::after {
  display: none !important;
}

/* Indeterminate progress: the travelling bar is the only cue that something is
   happening. Hold a visible block instead of a frozen sliver. */
:root[data-perf-tier~="L1"] .progress-fill::after,
:root[data-perf-tier~="L1"] .tc-progress .jw-bar-track.indeterminate .jw-bar-fill,
:root[data-perf-tier~="L1"] .mb-loadbar.is-loading::after {
  animation: none !important;
}
:root[data-perf-tier~="L1"] .tc-progress .jw-bar-track.indeterminate .jw-bar-fill {
  left: 0 !important;
  width: 100% !important;
  opacity: 0.45;
}
:root[data-perf-tier~="L1"] .mb-loadbar.is-loading::after {
  transform: none !important;
  width: 100% !important;
  opacity: 0.45;
}

/* Light is a layer on top of the flat surfaces, chosen by the 光效 setting
   (`data-light`). It only adds: base colours, borders and backgrounds stay
   exactly what this file says, so `data-light="off"` is the flat UI. */
/* ── styles/light.css ── */
/* ============================================================
   OMP Studio — Light
   ------------------------------------------------------------
   Light is a layer on top of the flat UI, never a restyle of it. Colours,
   borders, backgrounds, radii and spacing stay what tokens.css and the
   component files say; this file only adds glow, rim highlights and soft
   shadow. `data-light="off"` is therefore the flat UI, pixel for pixel.

   The 光效 setting (Settings → 外观) writes one attribute on <html>, as a set
   of included layers like `data-perf-tier`:

     off       off
     soft      soft                 state light: a surface that is working,
                                    waiting or alive
     standard  std soft             + material light: menus, dialogs,
                                    floating windows and cards catch light
     vivid     vivid std soft       + the ambient field and the pointer
                                    spotlight

   Every alpha below is multiplied by `--lux-k`, the level's strength.

   Light reaches the UI by three routes only, so it can never take over a
   property a component owns:
   1. Tokens the components already spend (`--shadow-menu`, `--shadow-modal`,
      the dock window's `--window-*-shadow`).
   2. Zero-specificity fallbacks (`:where(...) :where(...)`): wherever a
      component declares its own box-shadow (a hover halo, a focus ring) the
      component wins and the light steps aside.
   3. Light nodes of their own (`.lux-orbit`, `.lux-halo`, `.lux-ambient`,
      `.lux-spot`): aria-hidden, pointer-events none, no borrowed pseudo
      elements.

   Performance: perf/tiers.css removes every shadow and light node from L2
   down; L1 (reduced motion) keeps the light and stills its loops through the
   one policy at the end of motion.css. Nothing here animates anything but
   opacity, translate, rotate and scale.
   ============================================================ */

/* ---------- Level strength ---------- */
:root { --lux-k: 0; }
:root[data-light~="soft"] { --lux-k: 0.6; }
:root[data-light~="std"] { --lux-k: 1; }
:root[data-light~="vivid"] { --lux-k: 1.25; }

/* ---------- Light colours per theme ----------
   Dark adds light: a faint white rim on the top edge and glow in the accent.
   Light cannot glow on white, so it speaks in shadow instead: a white rim,
   and soft shadow tinted toward the accent rather than grey. */
:root {
  --lux-rim: rgb(255 255 255 / 0.9);
  --lux-shade: rgb(52 40 120 / 0.07);
  --lux-shade-deep: rgb(52 40 120 / 0.14);
  --lux-glow: var(--accent);
  /* Peak alpha of the ambient field and the spotlight before --lux-k. */
  --lux-field-a: 5%;
  --lux-spot-a: 7%;
}
:root[data-theme="dark"] {
  --lux-rim: rgb(255 255 255 / 0.065);
  --lux-shade: rgb(0 0 0 / 0.28);
  --lux-shade-deep: rgb(0 0 0 / 0.5);
  --lux-field-a: 9%;
  --lux-spot-a: 10%;
}

/* ==========================================================
   Material light (standard and up)
   ========================================================== */

/* Menus, popovers, dialogs: they already spend these two tokens, which are
   `none` in the flat UI. Specificity (0,3,0)/(0,4,0) so they win over the
   theme blocks in tokens.css whatever the source order. */
:root:root[data-light~="std"] {
  --shadow-menu:
    inset 0 1px 0 var(--lux-rim),
    0 2px 6px -2px var(--lux-shade),
    0 12px 32px -10px var(--lux-shade-deep);
  --shadow-modal:
    inset 0 1px 0 var(--lux-rim),
    0 4px 14px -4px var(--lux-shade),
    0 28px 72px -18px var(--lux-shade-deep);
}
:root:root[data-light~="std"][data-theme="dark"] {
  --shadow-menu:
    inset 0 1px 0 var(--lux-rim),
    0 2px 6px -2px var(--lux-shade),
    0 14px 36px -10px var(--lux-shade-deep),
    0 0 calc(40px * var(--lux-k)) -16px color-mix(in srgb, var(--lux-glow) calc(40% * var(--lux-k)), transparent);
  --shadow-modal:
    inset 0 1px 0 var(--lux-rim),
    0 4px 14px -4px var(--lux-shade),
    0 30px 80px -18px var(--lux-shade-deep),
    0 0 calc(80px * var(--lux-k)) -24px color-mix(in srgb, var(--lux-glow) calc(34% * var(--lux-k)), transparent);
}

/* Floating windows keep their own drop shadow; the focused one's tint halo
   grows with the level (dock.css draws it at the "off" strength). */
:root[data-light~="std"] .dock-float.is-active-window {
  --window-focus-shadow:
    0 0 0 1px color-mix(in srgb, var(--window-tint) 55%, transparent),
    0 0 calc(28px * var(--lux-k)) color-mix(in srgb, var(--window-tint) calc(24% * var(--lux-k)), transparent);
}

/* Cards: a rim on the top edge and a short soft shadow. Zero specificity, so
   any card that already declares a box-shadow (hover halos, selection) keeps
   its own. */
:where(:root[data-light~="std"]) :where(
  .card, .cap-item, .hub-card, .proj-card, .tk-card, .diag-card, .perm-card,
  .pv-card, .yml-card, .sk-card, .env-card, .context-card, .session-card,
  .dock-launcher-card, .approval-card, .ask-card
) {
  box-shadow:
    inset 0 1px 0 var(--lux-rim),
    0 1px 2px var(--lux-shade),
    0 8px 20px -14px var(--lux-shade-deep);
}

/* ==========================================================
   State light (soft and up)
   ========================================================== */

/* Running dots glow in their own colour; the glow rides the dot's existing
   opacity pulse, so it costs no animation of its own. */
:where(:root[data-light~="soft"]) :where(.dot.pulse) {
  box-shadow: 0 0 calc(8px * var(--lux-k)) calc(1px * var(--lux-k)) color-mix(in srgb, var(--lux-dot, var(--accent)) calc(70% * var(--lux-k)), transparent);
}
:where(.dot.green) { --lux-dot: var(--green); }
:where(.dot.amber) { --lux-dot: var(--amber); }
:where(.dot.red) { --lux-dot: var(--red); }
:where(.dot.blue) { --lux-dot: var(--blue); }

/* A surface that is working: the composer while the agent runs.
   `.lux-halo` is an outer glow (an outer box-shadow is only drawn outside the
   border box, so the node can sit over the content transparently).
   `.lux-orbit` is a light travelling round the border: a static ring mask
   over an oversized conic square that turns with `rotate`, so the motion is
   composited and never repaints the composer. */
.lux-halo,
.lux-orbit {
  display: none;
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  pointer-events: none;
}
:root[data-light~="soft"] :is(.lux-halo, .lux-orbit)[data-state="running"],
:root[data-light~="soft"] .lux-halo[data-state="waiting"] {
  display: block;
}

.lux-halo {
  --lux-halo-c: var(--lux-glow);
  box-shadow: 0 0 calc(30px * var(--lux-k)) calc(-4px * var(--lux-k)) color-mix(in srgb, var(--lux-halo-c) calc(42% * var(--lux-k)), transparent);
}
:root:not([data-theme="dark"]) .lux-halo {
  box-shadow: 0 calc(10px * var(--lux-k)) calc(30px * var(--lux-k)) calc(-8px * var(--lux-k)) color-mix(in srgb, var(--lux-halo-c) calc(40% * var(--lux-k)), transparent);
}
/* Waiting on the user: an amber halo breathing at the pulse tempo. */
.lux-halo[data-state="waiting"] {
  --lux-halo-c: var(--amber);
  animation: omp-pulse var(--loop-pulse) var(--ease-loop) infinite;
}

.lux-orbit {
  padding: 1.5px;
  overflow: hidden;
  container-type: size;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
}
.lux-orbit::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: hypot(100cqw, 100cqh);
  aspect-ratio: 1;
  translate: -50% -50%;
  background: conic-gradient(
    transparent 0 56%,
    color-mix(in srgb, var(--lux-glow) calc(55% * var(--lux-k)), transparent) 74%,
    var(--lux-glow) 85%,
    var(--blue) 90%,
    transparent 97%
  );
  animation: omp-spin var(--loop-orbit) linear infinite;
}

/* ==========================================================
   Ambient field (vivid)
   A few large, soft spots of light over the workbench, below menus and
   dialogs. It brightens while an agent works and settles when idle. With a
   wallpaper on (`data-backdrop="on"`) the wallpaper is the atmosphere and the
   field stays out of its way.
   ========================================================== */
.lux-ambient { display: none; }
:root[data-light~="vivid"]:not([data-backdrop="on"]) .lux-ambient {
  display: block;
  position: fixed;
  inset: 0;
  z-index: var(--z-fab);
  overflow: hidden;
  pointer-events: none;
  contain: strict;
  opacity: 0.55;
  transition: opacity var(--dur-slower) var(--ease);
}
:root[data-light~="vivid"] .lux-ambient[data-activity="running"] { opacity: 1; }
:root[data-light~="vivid"] .lux-ambient[data-activity="waiting"] { opacity: 0.8; }
.lux-ambient > i {
  position: absolute;
  width: 64vmax;
  height: 64vmax;
  border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--lux-c) calc(var(--lux-field-a) * var(--lux-k)), transparent), transparent);
  animation: omp-field-drift var(--loop-ambient) var(--ease-loop) infinite alternate;
}
.lux-ambient > i:nth-child(1) { --lux-c: var(--lux-glow); --drift-x: 6vmax; --drift-y: 4vmax; left: -22vmax; top: -30vmax; }
.lux-ambient > i:nth-child(2) { --lux-c: var(--blue); --drift-x: -5vmax; --drift-y: -4vmax; right: -24vmax; bottom: -32vmax; animation-delay: calc(var(--loop-ambient) / -3); }
.lux-ambient > i:nth-child(3) { --lux-c: var(--lux-tint, var(--tint-pink)); --drift-x: 4vmax; --drift-y: -5vmax; width: 40vmax; height: 40vmax; left: 40%; top: 30%; animation-delay: calc(var(--loop-ambient) / -1.5); }
.lux-ambient[data-activity="waiting"] > i:nth-child(3) { --lux-c: var(--amber); }
:root[data-light~="vivid"] .lux-ambient:is([data-activity="idle"], [data-hidden]) > i { animation-play-state: paused; }

/* ==========================================================
   Pointer spotlight (vivid)
   One node for the whole window. LuxSpotlight lays it over the card or row
   under the pointer and moves the light inside it; the target's own styles
   are never touched. Not inside the conversation stream.
   ========================================================== */
.lux-spot { display: none; }
:root[data-light~="vivid"] .lux-spot {
  display: block;
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fab);
  pointer-events: none;
  opacity: 0;
  overflow: hidden;
  background: radial-gradient(
    260px circle at var(--mx, 50%) var(--my, 50%),
    color-mix(in srgb, var(--lux-glow) calc(var(--lux-spot-a) * var(--lux-k)), transparent),
    transparent 70%
  );
  transition: opacity var(--dur-fast) var(--ease);
}
:root[data-light~="vivid"] .lux-spot[data-on] { opacity: 1; }

/* ==========================================================
   Accessibility: forced colours and "more contrast" turn light off. The
   chained :root out-ranks every level rule above.
   ========================================================== */
@media (forced-colors: active), (prefers-contrast: more) {
  :root:root:root:root:root {
    --lux-k: 0;
    --lux-rim: transparent;
    --lux-shade: transparent;
    --lux-shade-deep: transparent;
    --shadow-menu: none;
    --shadow-modal: none;
  }
  .lux-halo,
  .lux-orbit,
  .lux-ambient,
  .lux-spot {
    display: none !important;
  }
}


:root {
  /* Typography */
  --font-ui-default: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  /* ui-monospace / Menlo / Monaco only resolve on macOS; Windows still lands on Consolas. */
  --font-mono-default: "JetBrains Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Monaco,
    Consolas, "Courier New", monospace;
  --font-ui: var(--font-ui-default);
  --font-mono: var(--font-mono-default);
  --font-terminal: var(--font-mono-default);
  --font-output: var(--font-ui-default);
  --font-output-code: var(--font-mono-default);
  --ui-font-scale: 1;
  --text-font-scale: var(--ui-font-scale);
  --output-font-scale: 1;
  --terminal-font-size: 12px;

  /* Typography scale: clear hierarchy with meaningful steps.
     Removed --fs-13 (too close to 12px to be distinguishable).
     The ladder now follows ~1.17x ratio for legible hierarchy. */
  --ui-fs-11: calc(11px * var(--ui-font-scale));
  --fs-11: var(--ui-fs-11);   /* Smallest UI text: timestamps, metadata, helper text */
  --ui-fs-12: calc(12px * var(--ui-font-scale));
  --fs-12: var(--ui-fs-12);   /* Standard UI text: buttons, labels, tree items */
  --ui-fs-14: calc(14px * var(--ui-font-scale));
  --fs-14: var(--ui-fs-14);   /* Secondary headings, emphasized text, section labels */
  --ui-fs-16: calc(16px * var(--ui-font-scale));
  --fs-16: var(--ui-fs-16);   /* Body text, input fields, conversation content */
  --ui-fs-18: calc(18px * var(--ui-font-scale));
  --fs-18: var(--ui-fs-18);   /* Page titles, panel headings */
  --ui-fs-22: calc(22px * var(--ui-font-scale));
  --fs-22: var(--ui-fs-22);   /* Large headings, welcome messages */

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* Radius — soft, not sharp. Every tier moved up so the UI reads as
     rounded rather than boxy; the ladder keeps its relative steps so
     nested corners still nest correctly (outer must exceed inner). */
  --r-4: 6px;    /* inline chips, tree rows, small controls */
  --r-6: 9px;    /* buttons, menu items, tool cards */
  --r-8: 12px;   /* cards, panels, popovers */
  --r-10: 16px;  /* modals, composer, command palette */
  --r-full: 999px;

  /* Spacing scale — --sp-14 was referenced ~30 times as var(--sp-14, 14px)
     without ever being declared. Declared here so the fallback stops being
     load-bearing and the step can be retuned in one place.
     信息密度（设置 → 常规）经 --density-scale 等比缩放整条间距阶梯，
     不动字号与布局度量（--sidebar-w / --panel-w 等由 JS 按像素写入）。 */
  --density-scale: 1;
  --sp-2: calc(2px * var(--density-scale));
  --sp-4: calc(4px * var(--density-scale));
  --sp-6: calc(6px * var(--density-scale));
  --sp-8: calc(8px * var(--density-scale));
  --sp-10: calc(10px * var(--density-scale));
  --sp-12: calc(12px * var(--density-scale));
  --sp-14: calc(14px * var(--density-scale));
  --sp-16: calc(16px * var(--density-scale));
  --sp-20: calc(20px * var(--density-scale));
  --sp-24: calc(24px * var(--density-scale));
  --sp-32: calc(32px * var(--density-scale));

  /* Minimum pointer target (WCAG 2.2 SC 2.5.8 Target Size Minimum = 24px).
     Dense IDE chrome draws smaller icons than this; the hit area is padded
     out to --tap-min so the visual size and the target size can differ. */
  --tap-min: 24px;

  /* Layout metrics */
  --topbar-h: 44px;
  --nav-rail-w: 56px;
  --sidebar-w: 272px;
  --sidebar-min: 200px;
  --sidebar-max: 400px;
  --minimap-w: 36px;
  --panel-w: 480px;
  --doc-max-w: 768px;
  --bottom-panel-h: 240px;

  /* ---------------- Motion ----------------
     Numbers only. The rules that spend them are in styles/motion.css, and
     src/motion.ts mirrors them for timers and WAAPI
     (scripts/check-renderer-motion.mjs fails when the two drift), so a value
     changes here and in that table, and nowhere else.

     Rhythm — six steps, each about ×1.4 of the one before. Pick by what is
     moving, not by what looks nice in isolation:
       --dur-tactile   80ms  a press being acknowledged
       --dur-fast     120ms  colour, hover, anything that stays put; popovers
       --dur          180ms  one element changing state: chevron, switch, reveal
       --dur-slow     250ms  a region changing size or place: panel, drawer, card
       --dur-slower   320ms  a whole surface arriving: page, tab pane, toast
       --dur-hero     480ms  a morph that carries meaning: ask genie, plan sheet
     Leaving takes the step below arriving (a 320ms surface leaves in 250ms), so
     dismissing never feels like waiting. */
  --dur-tactile: 80ms;
  --dur-fast: 120ms;
  --dur: 180ms;
  --dur-slow: 250ms;
  --dur-slower: 320ms;
  --dur-hero: 480ms;
  /* Two durations that are not steps of the ladder, because they are not
     transitions between states: a highlight left behind to catch the eye and
     then fade, and a long label scrolling past at reading pace. */
  --dur-flash: 900ms;
  --dur-marquee: 3000ms;
  /* Loops are status, not transitions. Three tempos, by what the loop says:
     working (a spinner), alive (a pulse, a shimmer, a progress sweep), and
     ambient (slow breathing at the edge of attention). */
  --loop-spin: 800ms;
  --loop-pulse: 1400ms;
  --loop-drift: 2400ms;
  /* Light loops (styles/light.css). The orbit is a light travelling round the
     edge of a surface that is working; the ambient field drifts so slowly it
     is only noticed as the window being alive. */
  --loop-orbit: 3200ms;
  --loop-ambient: 18000ms;

  /* Curves — pick by what the motion means:
       --ease           state    colour, opacity, anything that stays where it is
       --ease-out       arrive   one element decelerating into place
       --ease-in        leave    one element accelerating away
       --ease-nav       travel   surfaces and indicators crossing the screen:
                                 brisk start, long soft landing, never overshoots
       --ease-ios       follow   things answering the user's own gesture: a drag
                                 settling, an editor growing while you type
       --ease-emphasis  morph    a large shape that starts and ends at rest: a
                                 list unfolding, a sheet growing out of a card
       --ease-spring    settle   a small mark landing. A real damped spring
                                 (ζ 0.62): one 8% overshoot a third of the way in,
                                 then it settles; it is the only curve that
                                 overshoots, so keep it to marks and thumbs.
       --ease-loop      breathe  loops that go there and back: at rest at both
                                 ends. Spinners and sweeps stay `linear`. */
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-out: cubic-bezier(0.16, 0.84, 0.44, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.75, 0);
  --ease-nav: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-ios: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-emphasis: cubic-bezier(0.38, 0, 0.08, 1);
  --ease-loop: cubic-bezier(0.42, 0, 0.58, 1);
  --ease-spring: linear(0, 0.006 1%, 0.028 2.25%, 0.064 3.5%, 0.122 5%, 0.179 6.25%, 0.241 7.5%, 0.523 12.75%, 0.638 15%, 0.752 17.5%, 0.84 19.75%, 0.913 22%, 0.977 24.5%, 1.024 27%, 1.055 29.5%, 1.07 31.25%, 1.078 33%, 1.083 36.75%, 1.072 41.25%, 1.017 54.5%, 0.998 62.75%, 0.993 72.5%, 1);

  /* Travel — distance says how big the thing is, axis says what kind of move
     it is: vertical for depth (entering or leaving a level), horizontal for
     siblings (the next tab, the next question). */
  --shift-xs: 4px;   /* one element: popover, inline reveal */
  --shift-sm: 8px;   /* a component, and how far any surface drifts as it leaves */
  --shift-md: 12px;  /* a surface arriving in depth: page, toast */
  --shift-lg: 16px;  /* a surface arriving from the side: tab pane, deck cell */
  /* Gap between the items of a cascade. */
  --stagger: 40ms;
  /* 悬停提示（data-tip）的出现延迟：指针静止停留后才弹标签，扫过按钮
     时不闪现。与动效时长分开命名，因为它是等待时间而不是动画时间。 */
  --tip-delay: 500ms;

  /* Z-index — the scale is the contract; raw values in component files are not.
     Every layer below is referenced by name from the component CSS. */
  --z-base: 1;
  --z-resizer: 5;
  --z-scroll-aid: 9;
  --z-rail: 10;
  --z-rail-tools: 11;
  --z-topbar: 20;
  --z-panel: 30;
  --z-fab: 40;
  --z-menu: 60;
  /* BTW 浮窗/胶囊：压住所有 popover 与菜单，但让位给独占式 modal —— 否则确认框
     会被浮窗盖住而点不到。 */
  --z-float: 70;
  --z-modal: 80;
  /* Hover tips sit above modal content, below toast. */
  --z-tip: 90;
  --z-toast: 100;
}

/* ---------------- 信息密度（设置 → 常规） ----------------
   只缩放间距阶梯：紧凑 ~0.85x，宽松 ~1.15x。字号与布局度量不动。 */
:root[data-density="compact"] { --density-scale: 0.85; }
:root[data-density="cozy"] { --density-scale: 1.15; }

/* ---------------- Light (default) ---------------- */
:root,
:root[data-theme="light"] {
  color-scheme: light;

  /* 背景组合来自 redesigning-skill-card-components.zip：
     侧栏/抽屉 = --bg-inset（sb-bg），对话区 = --bg（sb-panel） */
  --bg: #fbfbfc;
  --bg-inset: #ffffff;
  --surface: #ffffff;
  --surface-2: #f2f2f5;
  --surface-3: #e8e8ec;
  --surface-hover: rgba(20, 20, 30, 0.045);
  --surface-active: rgba(20, 20, 30, 0.08);

  --border: rgba(15, 18, 25, 0.09);
  --border-strong: rgba(15, 18, 25, 0.16);

  /* Text ramp. --text-faint was #8f96a1 — only 2.95:1 on white, and it carries
     real text (thread timestamps, line numbers, diff durations, palette kind
     labels), not just decoration. Both lower tiers were pulled down until they
     clear 4.5:1 while keeping a visible step between them:
       text-2  7.34:1   text-3  5.95:1   text-faint  4.72:1  */
  --text: #1d2129;
  --text-2: #4e5560;
  --text-3: #5c636e;
  --text-faint: #6d7480;
  --text-on-accent: #ffffff;
  /* Non-text greys (icon hairlines, rail dots, disabled glyphs) keep the old
     lighter tone — they only owe 3:1, and using the text ramp there would make
     the chrome heavier than the content. */
  --glyph-faint: #8b929d;

  --accent: #6e56cf;
  --accent-hover: #5f48c0;
  --accent-soft: rgba(110, 86, 207, 0.1);
  --accent-softer: rgba(110, 86, 207, 0.06);
  --accent-border: rgba(110, 86, 207, 0.35);

  /* Status colors darkened to clear 4.5:1 on white — the originals sat at
     3.2-3.9:1, which fails for the small mono text they carry. */
  --green: #137a52;
  --green-soft: rgba(19, 122, 82, 0.12);
  --amber: #8f5a05;
  --amber-soft: rgba(143, 90, 5, 0.12);
  --red: #c0272c;
  --red-soft: rgba(192, 39, 44, 0.1);
  /* 警告橙红（Full Access 权限模式专用）：深胡萝卜橙（orange-700 档），
     比上一版红橙混合更偏橙；亮色主题下对白底约 5.2:1。
     -soft 直接用主色的低透明度版本，色相干净不发脏。 */
  --danger-orange: #c2410c;
  --danger-orange-soft: color-mix(in srgb, var(--danger-orange) 14%, transparent);
  /* 呼吸外发光的淡橙黄色（Full Access 光晕专用）：比主色浅很多，
     光晕只做氛围点缀，文字警示色仍用 --danger-orange。 */
  --danger-glow: #ffc46b;
  --blue: #1f6ba3;
  --blue-soft: rgba(31, 107, 163, 0.12);
  --purple: var(--accent);
  --purple-soft: var(--accent-soft);

  /* 角色主题色调板 — 给「模型配置 → 角色」列表卡片分配不同颜色。
     主色取高饱和纯色（图标色），-soft 用于 hover 光环，
     图标底色由 CSS color-mix 与 --bg-inset 混合生成，保证通透不灰。 */
  /* Context identity groups, shared by the card and inspector. Existing hues,
     independently validated in both themes; not status or text colours. */
  --context-messages: #3887dc;
  --context-tools: #e68a39;
  --context-instructions: #28a580;
  --context-system: #9380c8;

  --tint-green: #16a34a;
  --tint-green-soft: rgba(22, 163, 74, 0.13);
  --tint-green-border: rgba(22, 163, 74, 0.35);
  --tint-blue: #0284c7;
  --tint-blue-soft: rgba(2, 132, 199, 0.13);
  --tint-blue-border: rgba(2, 132, 199, 0.35);
  --tint-teal: #0d9488;
  --tint-teal-soft: rgba(13, 148, 136, 0.13);
  --tint-teal-border: rgba(13, 148, 136, 0.35);
  --tint-violet: #7c3aed;
  --tint-violet-soft: rgba(124, 58, 237, 0.13);
  --tint-violet-border: rgba(124, 58, 237, 0.35);
  --tint-pink: #db2777;
  --tint-pink-soft: rgba(219, 39, 119, 0.13);
  --tint-pink-border: rgba(219, 39, 119, 0.35);
  --tint-orange: #ea580c;
  --tint-orange-soft: rgba(234, 88, 12, 0.13);
  --tint-orange-border: rgba(234, 88, 12, 0.35);
  --tint-cyan: #0891b2;
  --tint-cyan-soft: rgba(8, 145, 178, 0.13);
  --tint-cyan-border: rgba(8, 145, 178, 0.35);
  --tint-lime: #65a30d;
  --tint-lime-soft: rgba(101, 163, 13, 0.13);
  --tint-lime-border: rgba(101, 163, 13, 0.35);
  --tint-indigo: #4f46e5;
  --tint-indigo-soft: rgba(79, 70, 229, 0.13);
  --tint-indigo-border: rgba(79, 70, 229, 0.35);
  --tint-rose: #e11d48;
  --tint-rose-soft: rgba(225, 29, 72, 0.13);
  --tint-rose-border: rgba(225, 29, 72, 0.35);

  /* Git file status — deliberately separate from the semantic scale above,
     so a tree full of modified files doesn't read as a tree full of
     warnings. Mirrors ver2's split. Untracked reads as green (VS Code
     convention); the U/A letters carry the added-vs-untracked distinction. */
  --git-modified: #96570a;
  --git-added: #177e33;
  --git-deleted: #c7283a;
  --git-renamed: #0a66c2;
  --git-untracked: #1a7f37;
  --git-conflict: #c7283a;

  --diff-add-bg: rgba(19, 122, 82, 0.11);
  --diff-add-gutter: rgba(19, 122, 82, 0.2);
  --diff-del-bg: rgba(192, 39, 44, 0.09);
  --diff-del-gutter: rgba(192, 39, 44, 0.18);

  --code-bg: #f4f4f7;
  --code-chip-bg: rgba(110, 86, 207, 0.09);
  --code-chip-text: #5a45b8;

  /* Base depth is flat: borders + surface steps. Detached surfaces use
     --border-float, which separates them from the page on its own. The 光效
     setting may then add light on top (styles/light.css re-points these two
     tokens for `data-light~="std"`); `none` here is the "off" picture. */
  --shadow-menu: none;
  --shadow-modal: none;
  --border-float: #9b958c;

  --scrollbar: rgba(20, 20, 30, 0.18);
  --scrollbar-hover: rgba(20, 20, 30, 0.32);
  --minimap-viewport: rgba(20, 20, 30, 0.08);
  --selection: rgba(110, 86, 207, 0.2);

  /* 开关旋钮的两条不变式，别压成一句「旋钮都比轨道亮」：
     1) 关态：旋钮比轨道亮，两个主题都成立。所以暗色不能沿用 --surface
        (#1a1b1f)，它比轨道(--border-strong 叠在 --bg 上约 #31333b)更暗，
        旋钮会读成一个洞；暗色改用 --glyph-faint 这个中间明度。
     2) 开态：旋钮取 --text-on-accent 一侧。暗色下 accent 是浅丁香，旋钮就是
        刻意比轨道更暗 —— 这条是反的，由 accent 明度决定，不是 bug。
     --switch-thumb-disabled 是「禁用 + 关」这一格的跨主题对偶值：浅色 = 轨道
     上方一档白，暗色 = 轨道上方一档中间调。它和 --surface-3 绑死，所以写成
     字面值/别名而不是 color-mix(…, var(--surface-3) …)：否则以后调轨道底色会
     静默改掉禁用旋钮，而且没人看得出旋钮动过。
     另：关态轨道是半透明 --border-strong 填充，实际对比度随所在行底浮动
     (--surface 1.46 / --bg 1.49 / --surface-2 ≈1.36)。这不是漂移：控件跟着面板
     自动沉一档或浮一档，比写死一个灰更不容易在白卡和灰底上同时出错。报数以
     --surface 为基准。 */
  --switch-thumb: var(--surface);
  --switch-thumb-disabled: var(--surface);

  /* ---- Explorer 文件类型色（spec §4）----
     8 个彩色通道 + 4 个别名 + 1 个 dim，不是 12 个色相：doc / config / lock 的语义
     就是「普通文件」，上色只会把 ΔE 挤坏；package 是 .json，跟 data 同色、由立方体
     承担区分。实测三态行底（--bg-inset / hover / 选中）最低 4.75:1。
     使用边界（spec C1-B1，评审看到即打回）：类型色只表达「这个文件是什么」，
     永久禁止表达「它现在怎么样」——git 状态 / live 读写 / 诊断点 / 构建失败 / 权限
     告警只能走 --git-* / --red / --amber / --green。 */
  --ftype-code: #3b5f8f;
  --ftype-markup: #7d5527;
  --ftype-style: #8a4a70;
  --ftype-data: #1f6b55;
  --ftype-script: #4a6b32;
  --ftype-test: #6d6118;
  --ftype-image: #23697d;
  --ftype-secret: #96434b;
  /* 别名：不新增色相。用 var() 间接，暗色块只覆盖上面 8 个即可自动跟随。 */
  --ftype-package: var(--ftype-data);
  --ftype-doc: var(--text-3);
  --ftype-config: var(--text-3);
  --ftype-lock: var(--text-3);
  /* 噪音目录专用。不用 --glyph-faint：后者在 --surface-hover 上只有 2.85:1，破 3:1。
     light 三档 4.14 / 3.76 / 3.22 —— 选中档留 0.22 余量（#7d828b 是零余量）。 */
  --ftype-dim: #787d86;
}

/* ---------------- Dark ---------------- */
:root[data-theme="dark"] {
  color-scheme: dark;

  --bg: #121519;
  --bg-inset: #0e1013;
  --surface: #1a1b1f;
  --surface-2: #222329;
  --surface-3: #2b2c33;
  --surface-hover: rgba(235, 235, 245, 0.05);
  --surface-active: rgba(235, 235, 245, 0.09);

  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.12);

  /* Same treatment in dark, measured against --surface (#1a1b1f) rather than
     --bg, since --surface is the lighter of the two backgrounds text sits on:
       text-2  8.1:1   text-3  5.37:1   text-faint  4.55:1  */
  --text: #e7e8eb;
  --text-2: #a7abb4;
  --text-3: #8b909a;
  --text-faint: #7c828c;
  --glyph-faint: #676b74;
  /* Dark accent is a light lilac — white on it is only 2.76:1. The
     foreground has to invert to the app background instead (6.73:1). */
  --text-on-accent: #121316;

  --accent: #9e8cfc;
  --accent-hover: #b0a2ff;
  --accent-soft: rgba(158, 140, 252, 0.14);
  --accent-softer: rgba(158, 140, 252, 0.08);
  --accent-border: rgba(158, 140, 252, 0.4);

  --green: #46b983;
  --green-soft: rgba(70, 185, 131, 0.15);
  --amber: #e0a23c;
  --amber-soft: rgba(224, 162, 60, 0.15);
  --red: #f06568;
  --red-soft: rgba(240, 101, 104, 0.14);
  /* 警告橙红（Full Access 权限模式专用）：暖橙，暗色主题下对比约 6.7:1。
     -soft 直接用主色的低透明度版本，色相干净不发脏。 */
  --danger-orange: #ff7a45;
  --danger-orange-soft: color-mix(in srgb, var(--danger-orange) 14%, transparent);
  /* 呼吸外发光的淡橙黄色（暗色主题）：比亮色主题更浅，暗底上仍清晰可见。 */
  --danger-glow: #ffd9a8;
  --blue: #5da9e0;
  --blue-soft: rgba(93, 169, 224, 0.15);

  /* 角色主题色调板 — 深色主题亮色档（400 级高饱和） */
  --context-messages: #3887dc;
  --context-tools: #b35e14;
  --context-instructions: #28a580;
  --context-system: #9380c8;

  --tint-green: #4ade80;
  --tint-green-soft: rgba(74, 222, 128, 0.16);
  --tint-green-border: rgba(74, 222, 128, 0.4);
  --tint-blue: #38bdf8;
  --tint-blue-soft: rgba(56, 189, 248, 0.16);
  --tint-blue-border: rgba(56, 189, 248, 0.4);
  --tint-teal: #2dd4bf;
  --tint-teal-soft: rgba(45, 212, 191, 0.16);
  --tint-teal-border: rgba(45, 212, 191, 0.4);
  --tint-violet: #a78bfa;
  --tint-violet-soft: rgba(167, 139, 250, 0.16);
  --tint-violet-border: rgba(167, 139, 250, 0.4);
  --tint-pink: #f472b6;
  --tint-pink-soft: rgba(244, 114, 182, 0.16);
  --tint-pink-border: rgba(244, 114, 182, 0.4);
  --tint-orange: #fb923c;
  --tint-orange-soft: rgba(251, 146, 60, 0.16);
  --tint-orange-border: rgba(251, 146, 60, 0.4);
  --tint-cyan: #22d3ee;
  --tint-cyan-soft: rgba(34, 211, 238, 0.16);
  --tint-cyan-border: rgba(34, 211, 238, 0.4);
  --tint-lime: #a3e635;
  --tint-lime-soft: rgba(163, 230, 53, 0.16);
  --tint-lime-border: rgba(163, 230, 53, 0.4);
  --tint-indigo: #818cf8;
  --tint-indigo-soft: rgba(129, 140, 248, 0.16);
  --tint-indigo-border: rgba(129, 140, 248, 0.4);
  --tint-rose: #fb7185;
  --tint-rose-soft: rgba(251, 113, 133, 0.16);
  --tint-rose-border: rgba(251, 113, 133, 0.4);

  --git-modified: #e3a008;
  --git-added: #3fb950;
  --git-deleted: #f0616d;
  --git-renamed: #4a9eff;
  --git-untracked: #7ee787;
  --git-conflict: #f0616d;

  --diff-add-bg: rgba(70, 185, 131, 0.16);
  --diff-add-gutter: rgba(70, 185, 131, 0.28);
  --diff-del-bg: rgba(240, 101, 104, 0.14);
  --diff-del-gutter: rgba(240, 101, 104, 0.26);

  --code-bg: #141519;
  --code-chip-bg: rgba(158, 140, 252, 0.14);
  --code-chip-text: #b3a5fd;

  --shadow-menu: none;
  --shadow-modal: none;
  --border-float: #46505f;

  --scrollbar: rgba(235, 235, 245, 0.16);
  --scrollbar-hover: rgba(235, 235, 245, 0.3);
  --minimap-viewport: rgba(235, 235, 245, 0.07);
  --selection: rgba(158, 140, 252, 0.3);
  /* ---- Explorer 文件类型色（暗色同 8 个通道）----
     明度重解得比浅色亮得多：dark 三态最低 4.98（--ftype-secret 作正文色）。 */
  --ftype-code: #93b4dc;
  --ftype-markup: #d3a271;
  --ftype-style: #e0a6c2;
  --ftype-data: #79bfa2;
  --ftype-script: #9ac387;
  --ftype-test: #c4bb6f;
  --ftype-image: #6fc0d2;
  --ftype-secret: #d1838b;
  --ftype-dim: #72767f;
  /* 别名沿用浅色块里的 var() 间接，此处只覆盖 8 个色相。 */

  --switch-thumb: var(--glyph-faint);
  /* 禁用·关必须仍比轨道亮：--surface(#1a1b1f) 比轨道 --surface-3(#2b2c33) 更暗，
     沿用会让禁用态重新变成「洞」；这里换成更亮的 --border-float(#46505f)，对
     轨道 1.70:1。可用·关是 --glyph-faint(#676b74) 对轨道 2.25:1，梯度
     2.25 → 1.70 保持「禁用更淡」，同时明暗次序与浅色一致。 */
  --switch-thumb-disabled: var(--border-float);
}

/* Compatibility names from older feature panes reuse the established Studio
   scale. They are aliases, not extra colors, font sizes, or corner styles. */
:root {
  --danger: var(--red);
  --orange: var(--amber);
  --surface-muted: var(--surface-2);
  --surface-1: var(--surface);
  --accent-subtle: var(--accent-softer);
  --bg-subtle: var(--surface-2);
  --bg-hover: var(--surface-hover);
  --border-subtle: var(--border);
  --text-muted: var(--text-3);
  --text-1: var(--text);
  --r-12: var(--r-8);
  --fs-10: var(--fs-11);
  --fs-13: var(--fs-12);
  --fs-15: var(--fs-14);
  --sp-3: var(--sp-4);
  --sp-5: var(--sp-6);
  --sp-18: var(--sp-20);
  --shadow-sm: var(--shadow-menu);
  --tint-purple: var(--tint-violet);
  --tint-purple-soft: var(--tint-violet-soft);
  --warning-soft: var(--amber-soft);
}

/* ---------------- Explorer 文件类型 · 三通道严格模式（spec §2 C1 二裁） ----------------
   组件零改动：<html data-palette="tri"> 即可。12 个类别全部回落中性，只留一个
   "需注意"通道（--ftype-secret → --amber）。切过去后 12 个图标仍能两两分辨，
   这是"颜色只是加速器、语义 100% 由剪影承载"的现场证明。
   选择器特异性 (0,2,0) 与 :root[data-theme="dark"] 相同，靠源顺序取胜 —— 必须留在
   文件末尾，否则暗色块会把 tri 覆盖回去。
   根元素用 data-palette（调色板模式），树行用 data-ftype（类型 id），两者不共名：
   否则 `grep data-ftype` 会混进一个非 type id 的值，与当初否掉 data-t 同因。
   --ftype-dim 不动：它服务噪音目录的降噪，不属于类型通道。 */
:root[data-palette="tri"] {
  --ftype-code: var(--text-3);
  --ftype-markup: var(--text-3);
  --ftype-style: var(--text-3);
  --ftype-data: var(--text-3);
  --ftype-script: var(--text-3);
  --ftype-test: var(--text-3);
  --ftype-image: var(--text-3);
  --ftype-package: var(--text-3);
  --ftype-doc: var(--text-3);
  --ftype-config: var(--text-3);
  --ftype-lock: var(--text-3);
  --ftype-secret: var(--amber);
}

/* 系统强制高对比 / 请求更高对比时自动降级 —— 命中这些设置的人正是最需要它的，
   不能要求他们再去设置里手动关。与 data-palette="tri" 覆盖同一组变量。
   选择器用 :root:root（0,2,0）而不是 :root（0,1,0）：后者特异性低于
   :root[data-theme="dark"]，暗色主题下会被暗色值覆盖，等于没降级。 */
@media (forced-colors: active) {
  :root:root:root {
    --ftype-code: var(--text-3);
    --ftype-markup: var(--text-3);
    --ftype-style: var(--text-3);
    --ftype-data: var(--text-3);
    --ftype-script: var(--text-3);
    --ftype-test: var(--text-3);
    --ftype-image: var(--text-3);
    --ftype-package: var(--text-3);
    --ftype-doc: var(--text-3);
    --ftype-config: var(--text-3);
    --ftype-lock: var(--text-3);
    --ftype-secret: var(--amber);
  }
}

@media (prefers-contrast: more) {
  :root:root:root {
    --ftype-code: var(--text-3);
    --ftype-markup: var(--text-3);
    --ftype-style: var(--text-3);
    --ftype-data: var(--text-3);
    --ftype-script: var(--text-3);
    --ftype-test: var(--text-3);
    --ftype-image: var(--text-3);
    --ftype-package: var(--text-3);
    --ftype-doc: var(--text-3);
    --ftype-config: var(--text-3);
    --ftype-lock: var(--text-3);
    --ftype-secret: var(--amber);
  }
}

/* ── styles/base.css ── */
/* ============================================================
   OMP Studio — Base reset & shared primitives
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

/* Paint the theme background on <html> itself, not just <body>.
   When a full page navigates, the browser shows the <html> background behind
   the freshly-loaded document for a frame or two. If only <body> carried the
   colour, that gap flashes white (light) / black (dark) before the new page
   paints — jarring when the header pops in. Putting --bg on <html> keeps that
   pre-paint frame the same colour as the page, so switching pages never
   flashes the wrong theme. */
html {
  background: var(--bg);
  font-size: calc(16px * var(--ui-font-scale));
}

body {
  font-family: var(--font-ui);
  font-size: var(--fs-14);
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  /* 页头不参与淡入：整页跳转时 body 若整层淡入，页头会跟着重现（闪）。
     淡入只作用于内容容器 —— 二级页 .page-body、工作台 .workbench。
     主题切换仍是背景 crossfade（上面的 transition），不受影响。 */
}

/* 页面切换（.page-in / .page-out）在 styles/motion.css 的 Surfaces 一节：
   二级页只作用在 .page-body（页头不动）；工作台 ↔ 二级页作用在 .page / .app-body。 */

::selection { background: var(--selection); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: var(--text);
}

code, pre, .mono { font-family: var(--font-mono); }

/* Focus ring.
   Was `box-shadow: var(--focus-ring)` plus a forced `border-radius: var(--r-4)`,
   which reshaped whatever it focused — pill buttons went square, 12px cards
   went to 6px. Outline follows the element's own border-radius, so the ring
   traces the real shape; the offset gap does the same job the inner white ring
   was doing (separating the accent from the control's own fill). */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
/* Inside the accent-tinted rows the accent ring would sit on accent, so those
   switch to the text colour to keep 3:1 against their own background. */
.thread.active :focus-visible,
.cmdk-item.sel :focus-visible,
.complete-item.sel :focus-visible {
  outline-color: var(--text);
}

/* Scrollbars. macOS keeps its native overlay scrollbars: styling them would
   force permanent classic ones. Elsewhere these match every element, the root
   included, exactly like the former bare `*`; :where() keeps them at zero
   specificity, so per-element overrides still win as before. */
:where(:root:not([data-platform="darwin"]), :root:not([data-platform="darwin"]) *) { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
:where(:root:not([data-platform="darwin"]), :root:not([data-platform="darwin"]) *)::-webkit-scrollbar { width: 8px; height: 8px; }
:where(:root:not([data-platform="darwin"]), :root:not([data-platform="darwin"]) *)::-webkit-scrollbar-thumb {
  background: var(--scrollbar);
  border-radius: var(--r-full);
}
:where(:root:not([data-platform="darwin"]), :root:not([data-platform="darwin"]) *)::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
:where(:root:not([data-platform="darwin"]), :root:not([data-platform="darwin"]) *)::-webkit-scrollbar-track,
:where(:root:not([data-platform="darwin"]), :root:not([data-platform="darwin"]) *)::-webkit-scrollbar-corner { background: transparent; }

/* Screen-reader-only text. Used to give icon-only controls and status regions
   a real accessible name without changing the visual density. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* Skip link — the workbench puts ~40 focusable controls (sidebar tree, thread
   list, topbar) ahead of the conversation, so keyboard users need a way past
   them. Visually hidden until focused. */
.skip-link {
  position: fixed;
  top: var(--sp-8);
  left: var(--sp-8);
  z-index: var(--z-toast);
  padding: var(--sp-8) var(--sp-12);
  border-radius: var(--r-6);
  background: var(--accent);
  color: var(--text-on-accent);
  font-size: var(--fs-12);
  font-weight: var(--fw-medium);
  transform: translateY(-200%);
  transition: transform var(--dur-fast) var(--ease-out);
}
.skip-link:focus-visible {
  transform: none;
  text-decoration: none;
  outline-color: var(--text);
}

/* App shell */
.app {
  display: flex;
  /* dvh over vh: 100vh overflows whenever a browser chrome bar is present,
     which clips the composer at the bottom of the layout. */
  height: 100dvh;
  overflow: hidden;
}

/* SPA 单壳：.app（工作台）与 .page（二级页）是同一文档里的两个根，
   路由只切 hidden。两者都声明了 display:flex，UA 的 [hidden]（display:none）
   压不住更具体的类规则，必须 !important。 */
.app[hidden], .page[hidden] { display: none !important; }

.main-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

/* Generic icon sizing */
.icon {
  width: 16px;
  height: 16px;
  flex: none;
  display: inline-block;
  vertical-align: -3px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon.sm { width: 13px; height: 13px; }
.icon.lg { width: 18px; height: 18px; }

/* Utility */
.muted { color: var(--text-3); }
.text2 { color: var(--text-2); }
.small { font-size: var(--fs-12); }
.tiny { font-size: var(--fs-11); }
.hidden { display: none !important; }
.spacer { flex: 1; }
.ellipsis {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Inline code chip（路径 / 文件名 / 版本号） */
.chip-code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  padding: 1px 6px;
  border-radius: var(--r-4);
  background: var(--code-chip-bg);
  color: var(--code-chip-text);
  white-space: nowrap;
}
.chip-file {
  font-family: var(--font-mono);
  font-size: 0.86em;
  padding: 1px 6px;
  border-radius: var(--r-4);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  white-space: nowrap;
  cursor: pointer;
}
.chip-file:hover { border-color: var(--accent-border); color: var(--accent); }

/* Pulsing dot for running states */
.dot {
  width: 7px;
  height: 7px;
  border-radius: var(--r-full);
  flex: none;
  display: inline-block;
}
.dot.green { background: var(--green); }
.dot.amber { background: var(--amber); }
.dot.red { background: var(--red); }
.dot.blue { background: var(--blue); }
.dot.purple { background: var(--accent); }
.dot.pulse { animation: omp-pulse var(--loop-pulse) var(--ease-loop) infinite; }

/* Spinner */
.spinner {
  width: 13px;
  height: 13px;
  border: 1.6px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: var(--r-full);
  animation: omp-spin var(--loop-spin) linear infinite;
  flex: none;
}

/* Skeleton shimmer.
   Was `background-position` on a 200%-wide gradient — a non-composited property,
   so every frame repainted the placeholder (and there can be dozens on screen
   while a session hydrates). The band is now its own absolutely positioned
   `::after` and only `transform` moves, which stays on the compositor. Skeletons
   are empty placeholder boxes by construction (ConversationSkeleton), so the
   overlay has no content to cover. */
.skeleton {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-4);
  background: var(--surface-2);
}
.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface-3) 85%, var(--surface-2)), transparent);
  animation: omp-sweep var(--loop-pulse) linear infinite;
}

/* Scroll fade for long lists */
.fade-bottom {
  mask-image: linear-gradient(to bottom, black calc(100% - 24px), transparent);
}

/* ── styles/components.css ── */
/* ============================================================
   OMP Studio — Shared components
   ============================================================ */

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-6);
  height: 28px;
  padding: 0 var(--sp-10);
  border-radius: var(--r-6);
  font-size: var(--fs-12);
  font-weight: var(--fw-medium);
  color: var(--text-2);
  border: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease),
    transform var(--dur-tactile) var(--ease-out);
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--surface-hover); color: var(--text); }
.btn:active {
  background: var(--surface-active);
  transform: translateY(1px);  /* Physical push feedback */
}

.btn.primary {
  background: var(--accent);
  color: var(--text-on-accent);
}
.btn.primary:hover { background: var(--accent-hover); color: var(--text-on-accent); }
.btn.primary:active {
  background: var(--accent-hover);
  transform: translateY(1px);
}

.btn.outline {
  border-color: var(--border-strong);
  color: var(--text-2);
  background: var(--surface);
}
.btn.outline:hover { border-color: var(--text-3); color: var(--text); }
.btn.outline:active {
  border-color: var(--text-3);
  color: var(--text);
  transform: translateY(1px);
}

.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); }
.btn.danger:active {
  background: var(--red-soft);
  transform: translateY(1px);
}

.btn.small { height: 24px; padding: 0 var(--sp-8); font-size: var(--fs-11); }
/* 大号按钮：Deck 审批卡等需要突出决策的场合 */
.btn.lg { height: 32px; padding: 0 var(--sp-12); font-size: var(--fs-14); }
/* Disabled: opacity alone can still read as "just quiet text" on a tinted
   button, so pointer-events are dropped too — the control cannot be hovered
   into looking live. 0.45 sits inside the 0.38-0.5 disabled range. */
.btn:disabled,
.btn[aria-disabled="true"] {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
}
/* Destructive actions carry the danger colour on their own fill rather than
   inheriting the neutral primary, so "确认恢复" cannot be mistaken for a
   routine confirm. */
.btn.danger.solid {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}
.btn.danger.solid:hover { background: var(--red); filter: brightness(0.92); }
.btn.danger.solid:active {
  background: var(--red);
  filter: brightness(0.92);
  transform: translateY(1px);
}

/* Icon-only button */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: var(--r-6);
  color: var(--text-3);
  flex: none;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease),
    transform var(--dur-tactile) var(--ease-out);
  position: relative;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.icon-btn:active {
  background: var(--surface-active);
  color: var(--text);
  transform: scale(0.92);  /* Subtle squeeze feedback */
}
.icon-btn.active { background: var(--accent-soft); color: var(--accent); }
.icon-btn.small { width: 22px; height: 22px; }
/* 主入口按钮（如 Agent Hub）：比标准 26px 大一圈 */
.icon-btn.lg { width: 32px; height: 32px; }
/* Destructive icon button (e.g. delete on Skill cards). Same red treatment
   as .btn.danger but sized for the 22px chrome. Without this the X reads as
   a neutral close icon and the data-tip is the only warning. */
.icon-btn.danger { color: var(--text-3); }
.icon-btn.danger:hover,
.icon-btn.danger:focus-visible {
  background: var(--red-soft);
  color: var(--red);
}

/* Pointer target expansion.
   Dense IDE chrome draws 18-22px buttons, which are under the 24x24 CSS-pixel
   minimum (WCAG 2.2 SC 2.5.8). Growing the visual box would break the
   toolbars, so an invisible centred hit area is stretched to --tap-min
   instead — the paint size is unchanged, the clickable size is compliant. */
.icon-btn::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: max(100%, var(--tap-min));
  height: max(100%, var(--tap-min));
  transform: translate(-50%, -50%);
}
/* Same for the smallest inline affordances. */
.ctx-chip .x,
.tree-row .fop .icon-btn,
.minimap-tools .icon-btn { position: relative; }
.icon-btn .badge-dot {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 6px;
  height: 6px;
  border-radius: var(--r-full);
  background: var(--red);
  border: 1.5px solid var(--surface);
}

/* ---------- Status chip ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-4);
  height: 20px;
  padding: 0 var(--sp-8);
  border-radius: var(--r-full);
  font-size: var(--fs-11);
  font-weight: var(--fw-medium);
  white-space: nowrap;
  user-select: none;
}
.chip.green { background: var(--green-soft); color: var(--green); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.blue { background: var(--blue-soft); color: var(--blue); }
.chip.purple { background: var(--accent-soft); color: var(--accent); }
.chip.gray { background: var(--surface-2); color: var(--text-3); }
.chip.outline {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-2);
}
/* Compact chip tiers. These existed only as repeated inline
   `style="height:16px;padding:0 5px"` on 23 call sites, which meant the sizes
   were unversioned and drifted (16px vs 18px, 5px vs 6px). Same values,
   now named. */
.chip.xs { height: 16px; padding: 0 var(--sp-6); font-size: calc(10.5px * var(--text-font-scale)); }
.chip.sm { height: 18px; padding: 0 var(--sp-6); }

/* ---------- Menu / Popover ---------- */
.menu {
  position: absolute;
  min-width: 240px;
  background: var(--surface);
  border: 1px solid var(--border-float);
  border-radius: var(--r-8);
  box-shadow: var(--shadow-menu);
  padding: var(--sp-6);
  z-index: var(--z-menu);
  animation: var(--motion-pop);
}
.menu-item {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  width: 100%;
  padding: 6px var(--sp-8);
  border-radius: var(--r-6);
  font-size: var(--fs-12);
  color: var(--text-2);
  text-align: left;
}
.menu-item:hover { background: var(--surface-hover); color: var(--text); }
.menu-item:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.menu-item:disabled:hover { background: transparent; color: var(--text-2); }
.menu-item[aria-current="true"] { color: var(--text); background: var(--surface-hover); }
.menu-item .kbd, .menu-item .hint {
  margin-left: auto;
  color: var(--text-faint);
  font-size: var(--fs-11);
}
.menu-item.danger { color: var(--red); }
.menu-item.danger:hover { background: var(--red-soft); }
.menu-sep { height: 1px; background: var(--border); margin: var(--sp-6) var(--sp-4); }
.menu-label {
  padding: var(--sp-4) var(--sp-8);
  font-size: var(--fs-11);
  color: var(--text-faint);
  font-weight: var(--fw-medium);
}

/* 分支菜单头部：分支名 + 状态详情（对齐 ver2 menu-header） */
.branch-menu-head {
  padding: var(--sp-6) var(--sp-8) var(--sp-8);
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--sp-6);
}
.branch-menu-head .bmh-title {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  font-size: var(--fs-13);
  color: var(--text);
}
.branch-menu-head .bmh-title .icon { color: var(--accent); }
.branch-menu-head .bmh-meta {
  margin-top: 3px;
  font-size: var(--fs-11);
  color: var(--text-3);
  font-family: var(--font-mono);
}

.kbd {
  font-family: var(--font-mono);
  font-size: calc(10.5px * var(--text-font-scale));
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: var(--r-4);
  color: var(--text-3);
  background: var(--surface);
}

/* ---------- Segmented control / Tabs ---------- */
.seg {
  display: inline-flex;
  background: var(--surface-2);
  border-radius: var(--r-6);
  padding: 2px;
  gap: 2px;
}
.seg button {
  height: 22px;
  padding: 0 var(--sp-10);
  border-radius: var(--r-4);
  font-size: var(--fs-11);
  font-weight: var(--fw-medium);
  color: var(--text-3);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-4);
}
.seg button:hover { color: var(--text); }
.seg button.active {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
.seg button:disabled,
.seg.is-disabled button {
  cursor: not-allowed;
  opacity: 0.55;
}
.seg.is-disabled button:hover { color: var(--text-3); }
:root[data-theme="dark"] .seg button.active { background: var(--surface-3); }

.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
}
.tabs button {
  height: 32px;
  padding: 0 var(--sp-10);
  font-size: var(--fs-12);
  color: var(--text-3);
  font-weight: var(--fw-medium);
  border-bottom: 2px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-6);
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Card ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-8);
}

/* ---------- Banner (全局异常) ---------- */
.banner {
  display: flex;
  align-items: center;
  gap: var(--sp-10);
  padding: 7px var(--sp-16);
  font-size: var(--fs-12);
  border-bottom: 1px solid var(--border);
  flex: none;
}
.banner.amber { background: var(--amber-soft); color: var(--amber); }
.banner.red { background: var(--red-soft); color: var(--red); }
.banner.blue { background: var(--blue-soft); color: var(--blue); }
.banner .banner-detail { color: var(--text-2); }
.banner .banner-actions { margin-left: auto; display: flex; gap: var(--sp-6); flex: none; }
.banner.is-busy { flex-wrap: wrap; }
.banner .action-progress { flex: 1 1 100%; margin-top: 2px; }

/* ---------- Action progress ---------- */
.action-progress {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0 0 var(--sp-16);
}
.action-progress.compact { margin: 0; }
.action-progress-copy {
  display: flex;
  align-items: baseline;
  gap: var(--sp-8);
  font-size: var(--fs-12);
  color: var(--text-2);
}
.action-progress-count {
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  font-size: var(--fs-11);
}
.progress {
  height: 4px;
  background: var(--surface-3);
  border-radius: var(--r-full);
  overflow: hidden;
}
.progress-fill {
  position: relative;
  height: 100%;
  background: var(--accent);
  border-radius: var(--r-full);
  transition: width var(--dur) var(--ease);
  min-width: 8%;
}
.progress-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent);
  animation: omp-sweep var(--loop-pulse) var(--ease-loop) infinite;
}

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  /* 0.4 was too weak to isolate a white modal from a light-mode workbench —
     the dense UI behind it stayed legible and competed for attention. 0.5 is
     in the 40-60% range that reliably reads as "the layer below is inert". */
  background: rgba(15, 15, 25, 0.5);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 12vh;
  z-index: var(--z-modal);
  animation: var(--motion-fade);
  /* Long modal content (checkpoint scope lists) was unreachable — the backdrop
     is a fixed full-viewport box with no scroll, so overflow was clipped. */
  overflow-y: auto;
  padding-bottom: var(--sp-24);
}
:root[data-theme="dark"] .modal-backdrop { background: rgba(0, 0, 0, 0.6); }
/* Leaving: the host keeps the dialog mounted for MOTION_MS.fast (see
   useOverlayPresence) while both layers go. */
.modal-backdrop.is-leaving {
  animation: var(--motion-fade-out);
  pointer-events: none;
}
.modal-backdrop.is-leaving .modal { animation: var(--motion-sheet-out); }
.modal {
  width: 480px;
  max-width: calc(100vw - 48px);
  background: var(--surface);
  border: 1px solid var(--border-float);
  border-radius: var(--r-10);
  box-shadow: var(--shadow-modal);
  animation: var(--motion-sheet);
}
.modal-head {
  padding: var(--sp-16) var(--sp-20) 0;
  font-size: var(--fs-14);
  font-weight: var(--fw-semibold);
}
.modal-body { padding: var(--sp-12) var(--sp-20); color: var(--text-2); font-size: var(--fs-14); }
.modal-foot {
  padding: var(--sp-12) var(--sp-20) var(--sp-16);
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-8);
}

/* ---------- Toast ---------- */
.toast-wrap {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: var(--sp-8);
  align-items: center;
}
.toast-wrap.is-top {
  top: 52px;
  bottom: auto;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-8);
  max-width: min(560px, calc(100vw - 48px));
  background: var(--surface);
  border: 1px solid var(--border-float);
  border-radius: var(--r-8);
  box-shadow: var(--shadow-menu);
  padding: 8px var(--sp-14);
  font-size: var(--fs-12);
  line-height: 1.45;
  color: var(--text);
  animation: var(--motion-toast);
}
.toast > .icon { flex: none; margin-top: 1px; }
.toast > span { min-width: 0; }
.toast.is-busy { align-items: center; }
/* The host waits MOTION_MS.slow before it clears the message (ToastHost). */
.toast.leaving { animation: var(--motion-toast-out); }
/* A notice travels from the edge it is pinned to. */
.toast-wrap.is-top { --toast-from: -1; }

/* ---------- Tooltip ----------
   Painted by TipHost as a body portal. Do not use native `title` or
   ancestor-clipped `::after` bubbles. */
.omp-tip-bubble {
  position: fixed;
  z-index: var(--z-tip);
  background: var(--text);
  color: var(--bg);
  font-size: var(--fs-11);
  line-height: 1.45;
  padding: 3px 8px;
  border-radius: var(--r-4);
  width: max-content;
  max-width: 220px;
  text-align: center;
  pointer-events: none;
  animation: var(--motion-fade);
}

/* ---------- Form controls ---------- */
.field { display: flex; flex-direction: column; gap: var(--sp-6); }
.field label { font-size: var(--fs-12); font-weight: var(--fw-medium); color: var(--text-2); }
.field .desc { font-size: var(--fs-11); color: var(--text-3); }
.field .error {
  font-size: var(--fs-11);
  color: var(--red);
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}
.input, .select {
  /* 30px was below the 4.5:1-adjacent usability floor for pointer targets and
     forced 12px text; 32px fits the 4px rhythm and takes 13px comfortably. */
  height: 32px;
  padding: 0 var(--sp-10);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-6);
  background: var(--surface);
  font-size: var(--fs-14);
  width: 100%;
  transition: border-color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
}
/* Chrome's UA placeholder is opacity 0.54 of the input color, and native
   ::placeholder is painted off the control's compositor layer. An ancestor
   page-in/out `transform` then shows that text at the wrong size for a frame
   (especially on Windows ClearType when the layer is created or dropped).
   Lock metrics to the field, use a faint color at opacity 1, and keep the
   control on its own layer while any ancestor carries the animation class.
   `.page-in` stays attached after the animation; dropping the layer is what
   snaps the glyphs. */
.input::placeholder,
.select::placeholder {
  color: var(--text-faint);
  opacity: 1;
  font-size: inherit;
  line-height: inherit;
  font-family: inherit;
  font-weight: inherit;
}
.page-in input.input, .page-out input.input,
.page-in .select, .page-out .select {
  transform: translateZ(0);
  backface-visibility: hidden;
}
/* 聚焦特效 = 外发光：3px 柔光环 + 弥散光晕，边框颜色保持不变；
   关闭全局 2px 实线 outline（即用户不想要的"紫色边线"）。 */
.input:focus, .select:focus,
.input:focus-visible, .select:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-softer),
              0 0 14px 1px color-mix(in srgb, var(--accent) 22%, transparent);
}
.input:disabled, .select:disabled {
  background: var(--surface-2);
  color: var(--text-3);
  cursor: not-allowed;
}
/* Read-only is not disabled: the value still matters and stays selectable, so
   it keeps full text contrast and only loses the editable affordance. */
.input[readonly] {
  background: var(--surface-2);
  border-style: dashed;
  cursor: default;
}
.input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--red); }
/* Full Access 权限模式选中时：警告橙红描边/文字，聚焦光晕同色系 */
.select.danger {
  color: var(--danger-orange);
  border-color: color-mix(in srgb, var(--danger-orange) 45%, transparent);
}
.select.danger:focus,
.select.danger:focus-visible {
  box-shadow: 0 0 0 3px var(--danger-orange-soft),
              0 0 14px 1px color-mix(in srgb, var(--danger-orange) 20%, transparent);
}
textarea.input { height: auto; min-height: 72px; padding: var(--sp-8) var(--sp-10); resize: vertical; }

/* ---------- AppSelect ----------
   Native select popups cannot follow Studio's theme on every platform. The
   trigger keeps the existing `.select` contract while the listbox is a small
   portal surface with the same menu tokens as the rest of the app. */
.app-select {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-8);
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
}
.app-select:hover:not(:disabled) { border-color: var(--accent-border); }
.app-select-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.app-select-chevron { flex: none; color: var(--text-3); transition: transform var(--dur-fast) var(--ease); }
.app-select[aria-expanded="true"] .app-select-chevron { transform: rotate(180deg); color: var(--accent); }
.app-select-popup {
  position: fixed;
  z-index: calc(var(--z-modal) + 2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-sizing: border-box;
  min-height: 36px;
  padding: var(--sp-6);
  border: 1px solid var(--border-float);
  border-radius: var(--r-8);
  background: var(--surface);
  box-shadow: var(--shadow-menu);
  animation: var(--motion-pop);
}
.app-select-popup[data-side="top"] { --pop-from: 1; transform-origin: bottom center; }
.app-select-list { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.app-select-search {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  flex: none;
  height: 30px;
  margin-bottom: var(--sp-4);
  padding: 0 var(--sp-8);
  border: 1px solid var(--border);
  border-radius: var(--r-6);
  background: var(--bg-inset);
  color: var(--text-3);
}
.app-select-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-softer); }
.app-select-search input {
  min-width: 0;
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: var(--fs-12);
}
.app-select-search input::placeholder { color: var(--text-faint); opacity: 1; }
.app-select-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-8);
  width: 100%;
  min-height: 30px;
  padding: 5px var(--sp-8);
  border: 0;
  border-radius: var(--r-6);
  background: transparent;
  color: var(--text-2);
  font: inherit;
  font-size: var(--fs-12);
  text-align: left;
  cursor: pointer;
}
.app-select-option > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-select-option:hover:not(:disabled),
.app-select-option.is-active:not(:disabled) { background: var(--surface-hover); color: var(--text); }
.app-select-option[aria-selected="true"]:not(:disabled) { color: var(--accent); background: var(--accent-softer); }
.app-select-option:disabled { color: var(--text-faint); cursor: not-allowed; }
.app-select-check { display: inline-flex; flex: none; width: 14px; color: var(--accent); }
.app-select-group { padding: var(--sp-6) var(--sp-8) var(--sp-4); color: var(--text-faint); font-size: var(--fs-11); font-weight: var(--fw-medium); }
.app-select-empty { padding: var(--sp-12) var(--sp-8); color: var(--text-3); font-size: var(--fs-12); text-align: center; }

/* Switch.
   Rendered as <button role="switch"> so it is focusable, operable with
   Space/Enter, and announces its own state. [aria-checked] is the single
   source of truth; the legacy .on class is no longer read here.

   Geometry: 34×20 track, 18px thumb, 1px inset on all four sides,
   14px travel (34 − 18 − 2).

   Boundaries are painted with fill, not strokes. The old version put a 1px
   --border-strong border on both the track and the thumb; the thumb's own
   border ate 2px of its 16px diameter, so the visible disc was 14px against
   a 20px track — 70% where Radix Themes sits at 90% (18/20) and shadcn at
   87%. The same double border also left a dirty ring on the accent fill in
   the checked state. Removing both lines and deepening the track fill keeps
   the same separation ratio (~1.4:1 light) with zero strokes. */
.switch {
  position: relative;
  width: 34px;
  height: 20px;
  border-radius: var(--r-full);
  background: var(--border-strong);
  border: 0;
  flex: none;
  padding: 0;
  cursor: pointer;
  transition: background-color var(--dur) var(--ease);
}
.switch::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 1px;
  width: 18px;
  height: 18px;
  border-radius: var(--r-full);
  background: var(--switch-thumb);
  border: 0;
  transition:
    transform var(--dur-fast) var(--ease-out),
    width var(--dur-fast) var(--ease-out),
    background-color var(--dur) var(--ease);
}
