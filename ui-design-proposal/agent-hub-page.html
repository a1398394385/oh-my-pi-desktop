/* 34×20 paint is under the 24px pointer minimum on one axis. */
.switch::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  height: var(--tap-min);
  transform: translate(-50%, -50%);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after {
  background: var(--text-on-accent);
  transform: translateX(14px);
}
/* Press: the thumb stretches instead of the track speeding up. Mass comes
   from a shape change at 80ms, which reads on a mouse; Radix's "compress the
   duration to 30ms" trick is a touch-latency fix and is invisible at 14px.

   Only width and transform animate, at the same duration, with left pinned
   at 1px: 1 + translateX(t) + width(t) === 33 for every t, so the right edge
   stays put and never overflows the track. (Animating left against a longer
   transform threw the edge ~1.5px past the track mid-flight.) The base rule
   above keeps both properties at --dur-fast for the same reason in reverse:
   releasing is governed by the base durations, so a longer transform there
   would dent the edge ~0.6px inward before it settles. */
.switch:not(:disabled):active::after {
  width: 22px;
  transition-duration: var(--dur-tactile), var(--dur-tactile), var(--dur);
}
.switch[aria-checked="true"]:not(:disabled):active::after {
  transform: translateX(10px);
}
.switch:focus-visible { outline-offset: 3px; }
/* Disabled is painted explicitly rather than faded with opacity: opacity
   washes the accent into an ambiguous lilac and makes "off" and "on" equally
   pale. */
.switch:disabled { cursor: not-allowed; }
.switch:disabled:not([aria-checked="true"]) { background: var(--surface-3); }
.switch:disabled:not([aria-checked="true"])::after { background: var(--switch-thumb-disabled); }
.switch:disabled[aria-checked="true"] {
  background: color-mix(in srgb, var(--accent) 50%, var(--surface-3));
}
.switch:disabled[aria-checked="true"]::after { background: var(--surface); }

/* High contrast: the palette becomes Canvas-on-Canvas, so the track is the one
   thing that needs a stroke, and it gets it as an outline — a 1px border under
   box-sizing: border-box would eat the 18px disc down to 16px and shift
   top:1px to an asymmetric 2px/0px, reintroducing here exactly the
   stroke-eats-the-diameter bug this rewrite removes. Outlines take no box.
   The thumb itself is a solid fill on a contrasting track (ButtonText on
   Canvas, HighlightText on Highlight), so it needs no stroke of its own and
   must not have one: an outlined disc on a same-colour track reads as the
   hollow ring we just got rid of. */
@media (forced-colors: active) {
  .switch { background: Canvas; outline: 1px solid ButtonBorder; outline-offset: -1px; }
  .switch::after { background: ButtonText; }
  /* Focus keeps the ring inside and just thickens it: the global
     `outline-offset: 3px` (specificity 0,2,0) would otherwise win here and
     fling the track's -1px boundary ring 3px outward on focus, leaving the
     control with a floating ring and no outline at all. Width, not colour,
     carries "focused" in high contrast. */
  .switch:focus-visible { outline-offset: -1px; outline-width: 2px; }
  .switch[aria-checked="true"] { background: Highlight; }
  .switch[aria-checked="true"]::after { background: HighlightText; }
}


/* ---------- Empty state ---------- */
.empty {

/* ---------- Agent status chip 颜色映射 ---------- */

/* ── agents/deck/sigil.css ── */
/* ============================================================
   Agent sigils — the pixel face an agent wears everywhere (deck, Hub,
   workbench, conversation). Imported by AgentSigil.tsx, so any surface that
   renders a sigil is styled without loading the deck.
   The palette also feeds the deck's orbit nodes and timeline lanes, which draw
   SigilArt straight into their own SVG. Loops (breathing beacon, blink) stay
   with the deck: they run only under its [data-live].
   ============================================================ */

.sg,
.ad-orbit-node,
.ad-tl-lane {
  --sg-tile: oklch(0.955 0.03 var(--sg-h));
  --sg-head: oklch(0.63 0.125 var(--sg-h));
  --sg-ink: oklch(0.36 0.08 var(--sg-h));
  --sg-eye: oklch(0.99 0.01 var(--sg-h));
  --sg-edge: oklch(0.6 0.07 var(--sg-h) / 0.22);
  --sg-crown: oklch(0.8 0.14 82);
}
:root[data-theme="dark"] :is(.sg, .ad-orbit-node, .ad-tl-lane) {
  --sg-tile: oklch(0.31 0.045 var(--sg-h));
  --sg-head: oklch(0.79 0.105 var(--sg-h));
  --sg-ink: oklch(0.27 0.04 var(--sg-h));
  --sg-eye: oklch(0.23 0.03 var(--sg-h));
  --sg-edge: oklch(0.8 0.06 var(--sg-h) / 0.18);
}
:root :is(.ad-orbit-node[data-main], .sg.is-main) {
  --sg-tile: var(--text);
  --sg-head: var(--surface);
  --sg-ink: var(--text-3);
  --sg-eye: var(--text);
  --sg-edge: transparent;
}
.sg {
  position: relative;
  display: inline-flex;
  flex: none;
  overflow: hidden;
  background: var(--sg-tile);
  box-shadow: inset 0 0 0 1px var(--sg-edge);
}
.sg-tile { display: block; overflow: visible; }
.sg-head { fill: var(--sg-head); }
.sg-mouth { fill: var(--sg-ink); opacity: 0.8; }
.sg-crown { fill: var(--sg-crown); }
.sg-beacon { fill: var(--sg-head); }
.sg-eyes { fill: var(--sg-eye); transform-box: fill-box; transform-origin: center; }
[data-tone="running"] .sg-beacon { fill: var(--green); }
[data-tone="waiting"] .sg-beacon, [data-tone="waiting"] .sg-eyes { fill: var(--amber); }
[data-tone="failed"] .sg-eyes, [data-tone="failed"] .sg-beacon { fill: var(--red); }
.sg:is([data-tone="parked"], [data-tone="stopped"]) { filter: saturate(0.2); opacity: 0.72; }
.sg-ring-track { fill: none; stroke: color-mix(in srgb, var(--sg-head) 18%, transparent); stroke-width: 1.5; }
.sg-ring {
  fill: none;
  stroke: var(--sg-head);
  stroke-width: 1.5;
  stroke-linecap: round;
  transition: stroke-dasharray var(--dur-slow) var(--ease-out);
}
.sg.is-main .sg-ring-track { stroke: color-mix(in srgb, var(--surface) 22%, transparent); }
.sg.is-main .sg-ring { stroke: var(--sg-crown); }

/* No agent id yet (a subagent card before its spawn lands): a neutral tile with the generic glyph. */
.sg.is-unknown {
  align-items: center;
  justify-content: center;
  background: var(--surface-2);
  color: var(--text-3);
  box-shadow: inset 0 0 0 1px var(--border);
}
.sg.is-unknown > .icon { width: 62%; height: 62%; }



/* ── dock/dock.css（标签条）── */
.dock-icon-button,
.dock-tab > button {

.dock-tab-strip { display: flex; align-items: center; gap: 2px; height: 36px; min-height: 36px; flex: 0 0 36px; padding: 2px 4px; box-sizing: border-box; background: var(--surface-2); border-bottom: 1px solid var(--border); min-width: 0; }
.dock-tabs { display: flex; align-items: center; flex: 0 1 auto; min-width: 0; min-height: 32px; gap: 3px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.dock-tabs::-webkit-scrollbar { display: none; }
.dock-tab { display: flex; position: relative; flex: 0 1 auto; align-items: center; min-width: 80px; max-width: 210px; height: 32px; box-sizing: border-box; border: 1px solid transparent; border-radius: var(--r-6); color: var(--text-3); }
.dock-tab.is-active { min-width: 112px; color: var(--text); background: var(--bg-inset); border-color: var(--border-strong); }
.dock-tab > .dock-tab-label { display: flex; flex: 1 1 auto; align-items: center; gap: var(--sp-6); min-width: 0; height: 30px; padding: 0 2px 0 8px; font-size: var(--fs-12); font-weight: var(--fw-medium); border-radius: var(--r-6); cursor: pointer; }
.dock-tab > .dock-tab-label > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-tab > .dock-tab-close { display: flex; align-items: center; justify-content: center; flex: 0 0 24px; width: 24px; height: 26px; padding: 3px; margin: 0 1px; border-radius: var(--r-4); opacity: 0; cursor: pointer; }
.dock-tab:is(:hover, :focus-within, .is-active) > .dock-tab-close { opacity: 1; }
.dock-tab > .dock-tab-close:hover { background: var(--surface-active); }

/* ============================================================
   OMP Studio — Agent Hub
   主 Agent 横幅 · Roster（列表+详情） · Transcript · Jobs · IRC
   ============================================================ */

/* 打开对话预览时 .page-body 改为 overflow:hidden，经典滚动条会消失。
   Hub 页是 margin:0 auto 居中的，滚动条占宽一没，整块会往右跳。
   始终预留滚动条槽，和模型配置页同一做法；用 data-route 而不是
   :has(.is-chat-preview)，避免子节点挂上后 Chromium 晚一帧才匹配。 */
.page-body[data-route="agent-hub"] {
  scrollbar-gutter: stable;
}

/* ---------- 页面骨架：高度由内容决定，超过视口时自然滚动 ---------- */
.hub-page {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-14);
  transition: max-width var(--dur-slow) var(--ease-nav);
}
.hub-page > .workspace-panel:not([hidden]) { display: flex; flex-direction: column; gap: var(--sp-14); }
.hub-page.is-chat-preview > .workspace-panel:not([hidden]) { flex: 1; min-height: 0; }

/* ---------- 指挥台视图：页面放宽、吃满视口高度，指挥台 | Hub 详情 ----------
   页面至少是内容高度（舞台不低于 440px，窗口太矮时整页滚动），
   有余量时撑满视口；分栏的行高由余量决定，不由详情内容决定。 */
.page-body:has(.hub-page.is-deck) { display: flex; flex-direction: column; }
.hub-page.is-deck {
  max-width: min(1600px, 100%);
  width: 100%;
  flex: 1 0 auto;
}
/* 对话预览打开时沿用上面的 flex:1 / min-height:0：两列都钉在视口里各自滚动。 */
.hub-page.is-deck:not(.is-chat-preview) > .workspace-panel:not([hidden]) { flex: 1 0 auto; }
.hub-cols.is-deck {
  flex: 1 1 0;
  min-height: 440px;
  align-items: stretch;
  grid-template-columns: minmax(0, 64fr) minmax(0, 36fr);
  grid-template-rows: minmax(0, 1fr);
}
.hub-deck-col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.hub-deck-col > .ad { flex: 1; height: auto; }
/* 行高由视口决定，详情面自己滚动。 */
.hub-cols.is-deck .hub-detail { min-height: 0; }
.hub-view-seg button { display: inline-flex; align-items: center; gap: var(--sp-4); }
.hub-page > .workspace-tabbar { flex-shrink: 0; margin-bottom: 0; }

/* ---------- 连接横幅（offline / reconnecting / stale / resync / limited） ---------- */
.hub-conn {
  display: flex;
  align-items: center;
  gap: var(--sp-10);
  padding: 8px var(--sp-14);
  border-radius: var(--r-8);
  font-size: var(--fs-12);
}
.hub-conn.red { background: var(--red-soft); color: var(--red); }
.hub-conn.amber { background: var(--amber-soft); color: var(--amber); }
.hub-conn.blue { background: var(--blue-soft); color: var(--blue); }
.hub-conn .hc-detail { color: var(--text-2); flex: 1; min-width: 0; }
.hub-conn .hc-copy { flex: 1; min-width: 0; }
.hub-conn .hc-actions { display: flex; gap: var(--sp-6); flex: none; }
.hub-conn.is-busy { flex-wrap: wrap; }
.hub-conn .action-progress { flex: 1 1 100%; }

/* ---------- 主 Agent 横幅卡 ---------- */
.hub-main {
  display: flex;
  align-items: center;
  gap: var(--sp-12);
  padding: var(--sp-14) var(--sp-16);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-10);
}
.hub-main .hm-ic {
  width: 34px;
  height: 34px;
  border-radius: var(--r-8);
  background: var(--accent-soft);
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.hub-main .hm-main { flex: 1; min-width: 0; }
.hub-main .hm-title { font-weight: var(--fw-semibold); font-size: var(--fs-14); display: flex; align-items: center; gap: var(--sp-8); flex-wrap: wrap; }
.hub-main .hm-sub {
  display: flex;
  gap: var(--sp-8);
  align-items: baseline;
  margin-top: 2px;
  font-size: var(--fs-12);
  color: var(--text-2);
  flex-wrap: wrap;
}
.hub-main .hm-task { flex: 1; min-width: 0; }
.hub-main .hm-meta { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-3); flex: none; }
.hub-main .hm-conn { display: inline-flex; align-items: center; gap: var(--sp-6); color: var(--text-faint); }
.hub-main .hm-conn .hm-dot { width: 6px; height: 6px; border-radius: var(--r-full); background: var(--glyph-faint); flex: none; }
.hub-main .hm-conn .hm-dot.on { background: var(--green); }
.hub-main .hm-actions { display: flex; gap: var(--sp-6); flex: none; align-items: center; }

/* ---------- Roster 头：视图切换 + 状态计数 + 搜索 ---------- */
.hub-roster-head {
  display: flex;
  align-items: center;
  gap: var(--sp-10);
  flex-wrap: wrap;
}
.hub-status-counts {
  display: flex;
  gap: var(--sp-12);
  font-size: var(--fs-12);
  color: var(--text-2);
}
.hub-status-counts .sc-item { display: inline-flex; align-items: center; gap: var(--sp-6); height: 22px; padding: 0 var(--sp-8); border: 1px solid transparent; border-radius: var(--r-full); background: transparent; color: var(--text-3); font-size: var(--fs-11); cursor: pointer; }
.hub-status-counts .sc-item:hover { background: var(--surface-2); color: var(--text); }
.hub-status-counts .sc-item[aria-pressed="true"] { background: var(--surface-3); border-color: var(--border); color: var(--text); }
.hub-search { width: 220px; }

/* ---------- 汇总 Usage 行（右侧挂 New Agent） ---------- */
.hub-usage {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-10);
  font-family: var(--font-mono);
  font-size: var(--fs-11);
  color: var(--text-3);
  padding: var(--sp-6) var(--sp-4);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

/* ---------- 列表 + 详情双列 ---------- */
.hub-cols {
  display: grid;
  grid-template-columns: minmax(0, 58fr) minmax(0, 42fr);
  gap: var(--sp-16);
  align-items: start;
  transition: grid-template-columns var(--dur-slower) var(--ease-nav);
}

.hub-page.is-chat-preview {
  /* 页面仍用 .hub-page 的 1080px，避免顶栏/搜索随预览开关跳变。 */
  flex: 1;
  min-height: 0;
}
.hub-page.is-chat-preview .hub-cols {
  flex: 1;
  min-height: 0;
  align-items: stretch;
  /* 列表只略收窄；预览列吃剩余宽度。两侧都用 minmax(0, Nfr)，
     才能和静止态插值，打开时列宽跟着滑动而不是瞬切。 */
  grid-template-columns: minmax(0, 40fr) minmax(0, 60fr);
}
.hub-page.is-chat-preview .hub-list {
  overflow: auto;
  min-height: 0;
}
.hub-page.is-chat-closing .hub-cols {
  align-items: stretch;
  min-height: 0;
  overflow: hidden;
}
.hub-page.is-chat-closing .hub-list {
  overflow: auto;
  min-height: 0;
}
.hub-detail.is-chat {
  min-height: 0;
  height: 100%;
  max-width: calc(var(--doc-max-w) - var(--sp-32));
  overflow: hidden;
}
.hub-face-stage {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.hub-face {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  min-height: 0;
}
.hub-face-enter-fwd,
.hub-face-enter-back,
.hub-face-leave-fwd,
.hub-face-leave-back {
  backface-visibility: hidden;
}
.hub-face-enter-fwd,
.hub-face-enter-back {
  z-index: 1;
}
/* 换面的动画（.hub-face-enter-* / -leave-*）与标签页面板是同一组，
   在 styles/motion.css 的 Surfaces 一节。 */
.hub-face-leave-fwd,
.hub-face-leave-back {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hub-chat-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  min-height: 44px;
  padding: var(--sp-6) var(--sp-12);
  border-bottom: 1px solid var(--border);
  flex: none;
}
/* 翻到对话面后仍能看出在和谁说话：Sigil + 名字 + 状态。 */
.hub-chat-who {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  min-width: 0;
  padding-left: var(--sp-8);
  border-left: 1px solid var(--border);
  animation: var(--motion-swap);
}
.hub-chat-who > b {
  min-width: 0;

}

.hub-list { display: flex; flex-direction: column; gap: var(--sp-8); min-width: 0; }

/* ============================================================
   Agent 卡片 + 树状视图（2026-08-11 v3 重构，取代旧 .hub-row 平面文本版）
   设计语言：实体状态点 + 条形卡片 pill + 大数字+迷你柱 + outline artifact chip；
   树状 = 组头卡（父摘要）+ 竖向导线 + 缩进透明叶子（左缘状态色条）。
   ============================================================ */

/* ---------- 状态点：实体 dot + 状态色（旧版仅文字色圆点，存在感弱） ---------- */
.hub-sd { width: 8px; height: 8px; flex: none; border-radius: var(--r-full); }
.hub-sd.running { background: var(--green); }
.hub-sd.idle    { background: var(--blue); }
.hub-sd.parked  { background: var(--glyph-faint); }
.hub-sd.aborted { background: var(--red); }
.hub-sd.pulse   { animation: omp-pulse var(--loop-pulse) var(--ease-loop) infinite; }

/* ---------- Activity pill：整粒状态色胶囊（软底 + 状态色文字，取消左缘色条） ---------- */
.hub-act {
  display: inline-flex; align-items: center; gap: var(--sp-6);
  height: 22px; padding: 0 var(--sp-10);
  border-radius: var(--r-full);
  font-size: var(--fs-11); font-weight: var(--fw-medium);
  white-space: nowrap; flex: none;
}
.hub-act.thinking { background: var(--accent-soft); color: var(--accent); }
.hub-act.tool     { background: var(--blue-soft);   color: var(--blue); }
.hub-act.waiting  { background: var(--amber-soft);  color: var(--amber); }
.hub-act.idle     { background: var(--green-soft);  color: var(--green); }
.hub-act.parked   { background: var(--surface-2);   color: var(--text-3); }
.hub-act.aborted  { background: var(--red-soft);    color: var(--red); }

/* role 标签：随 pill 条形化 */
.hub-role {
  display: inline-flex; align-items: center;
  height: 18px; padding: 0 var(--sp-8);
  border-radius: var(--r-6);
  font-size: calc(10.5px * var(--text-font-scale)); font-weight: var(--fw-medium);
  background: var(--surface-2); color: var(--text-3);
}

/* unread / read-only 标记（沿用 pill 圆角，语义不变） */
.hub-unread {
  display: inline-flex; align-items: center; gap: 3px;
  height: 18px; padding: 0 var(--sp-6);
  border-radius: var(--r-full);
  font-size: calc(10.5px * var(--text-font-scale)); font-weight: var(--fw-medium);
  background: var(--amber-soft); color: var(--amber);
}
.hub-ro-tag {
  display: inline-flex; align-items: center;
  height: 18px; padding: 0 var(--sp-6);
  border-radius: var(--r-full);
  font-size: calc(10.5px * var(--text-font-scale)); font-weight: var(--fw-medium);
  background: var(--surface-2); color: var(--text-3);
}

.hub-model { font-family: var(--font-mono); font-size: calc(10.5px * var(--text-font-scale)); color: var(--text-3); }
.hub-fallback { color: var(--amber); font-weight: var(--fw-medium); }

/* ============================================================
   卡片（Flat 视图 + 树状孤儿共用）
   左主右栏：左 = 身份+任务，右 = 用量栏（右上时间，下大字成本 + req/tools/tok 竖排）
   ============================================================ */
.hub-card {
  position: relative;
  display: flex; align-items: stretch; gap: var(--sp-14);
  width: 100%;
  text-align: left; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-8);
  padding: var(--sp-10) var(--sp-12) var(--sp-10) var(--sp-14);
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.hub-card:hover { border-color: var(--accent-border); background: var(--surface-hover); }
.hub-card.sel { border-color: var(--accent-border); background: var(--accent-softer); }
.hub-card.sel::before {
  content: ""; position: absolute;
  left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: var(--r-full);
  background: var(--accent);
}

/* 左栏：身份 + 任务 */
.hub-card .hc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hub-card .hc-top { display: flex; align-items: center; gap: var(--sp-8); min-width: 0; }
.hub-card .hc-name {
  display: inline-flex; align-items: center; gap: var(--sp-6);
  min-width: 0; font-weight: var(--fw-semibold); font-size: var(--fs-12);
}
.hub-card .hc-name > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hub-card .hc-flags { display: flex; align-items: center; gap: var(--sp-4); flex: none; }

.hub-card .hc-task {
  margin-top: 5px;
  font-size: var(--fs-12); color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 左栏尾行：角色 · 模型 · artifact chip */
.hub-card .hc-foot {
  display: flex; align-items: center; gap: var(--sp-8);
  margin-top: auto; padding-top: 8px;   /* 顶到左栏底部，与右栏基线呼应 */
  min-width: 0; flex-wrap: wrap;
}
.hub-card .hc-art { display: flex; gap: var(--sp-4); flex: none; }
.hub-art {
  display: inline-flex; align-items: center;
  height: 18px; padding: 0 var(--sp-6);
  border: 1px solid var(--border);
  border-radius: var(--r-6);
  font-size: calc(10px * var(--text-font-scale)); font-family: var(--font-mono);
  color: var(--text-faint); background: transparent;
}

/* 右栏：用量栏（开始时刻 → tokens 主显 → req·tools 安静行 → 成本小字）
   优先级：tokens > 运行节奏 > 成本。所有数字右对齐、tabular-nums，基线成一条直线。 */
.hub-card .hc-side {
  flex: none; margin-left: auto;
  display: flex; flex-direction: column; align-items: flex-end;
  text-align: right;
}
.hub-card .hc-side > * + * { margin-top: 7px; }

/* 运行开始时刻（HH:MM）+ 时钟小图标 */
.hub-card .hc-start {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono); font-size: var(--fs-11);
  color: var(--text-faint); font-variant-numeric: tabular-nums; line-height: 1;
}
.hub-card .hc-start .icon { color: var(--glyph-faint); }

/* tokens：右栏主显，大号 + 迷你柱 */
.hub-card .hc-tokens {
  display: inline-flex; align-items: baseline; gap: 5px;
}
.hub-card .hc-tokens b {
  font-family: var(--font-mono); font-size: var(--fs-18); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--text); line-height: 1;
}
.hub-card .hc-tokens i { font-style: normal; font-size: calc(10px * var(--text-font-scale)); color: var(--text-faint); }
.hub-card .hc-tokens .hc-spark { padding-bottom: 1px; }

/* req · tools：一行安静小字（单位在左、数字在右，右对齐成一条线） */
.hub-card .hc-pace { display: inline-flex; gap: var(--sp-12); }
.hub-num { display: inline-flex; align-items: baseline; gap: 4px; }
.hub-num i { font-style: normal; font-size: calc(10px * var(--text-font-scale)); color: var(--text-faint); }
.hub-num b {
  font-family: var(--font-mono); font-size: calc(12px * var(--text-font-scale)); font-weight: var(--fw-medium);
  font-variant-numeric: tabular-nums; color: var(--text-2); line-height: 1;
}

/* 成本：降级为最底小字 */
.hub-card .hc-cost {
  font-family: var(--font-mono); font-size: calc(11px * var(--text-font-scale));
  font-variant-numeric: tabular-nums; color: var(--text-faint); line-height: 1;
}

/* 迷你柱图（SVG 注入，currentColor 驱动） */
.hb-bar { fill: var(--surface-3); }
.hb-bar.hot { fill: var(--accent); }

/* ============================================================
   树状视图（By parent）
   ============================================================ */
.hub-tgroup { display: flex; flex-direction: column; }

/* 组头：父 agent 摘要卡（可点选），比叶子更"实" */
.hub-tg-head {
  position: relative;
  display: flex; align-items: center; gap: var(--sp-8);
  width: 100%; text-align: left; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-8);
  padding: 8px var(--sp-12) 8px var(--sp-14);
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.hub-tg-head:hover { border-color: var(--accent-border); background: var(--surface-hover); }
.hub-tg-head.sel { border-color: var(--accent-border); background: var(--accent-softer); }
.hub-tg-head.sel::before {
  content: ""; position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: var(--r-full);
  background: var(--accent);
}
.hub-tg-head .tg-ic {
  width: 24px; height: 24px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-6);
  background: var(--accent-soft); color: var(--accent);
}
.hub-tg-head .tg-name {
  display: inline-flex; align-items: center; gap: var(--sp-6);
  min-width: 0; font-weight: var(--fw-semibold); font-size: var(--fs-12);
}
.hub-tg-head .tg-task {
  flex: 1; min-width: 0;
  font-size: var(--fs-11); color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hub-tg-head .tg-right { margin-left: auto; flex: none; display: flex; align-items: center; gap: var(--sp-8); }
.hub-tg-head .tg-cost { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-2); font-variant-numeric: tabular-nums; }
.hub-tg-head .tg-caret { color: var(--glyph-faint); flex: none; }

/* 导线列：竖线从组头底缘贯穿到最后一个叶子 */
.hub-tchildren { display: flex; align-items: stretch; }
.hub-trail {
  width: 23px; flex: none;
  margin-left: 11px;
  border-left: 1.5px solid var(--border-strong);
  border-bottom-left-radius: 7px;
  margin-bottom: 9px;
}
.hub-tleaves {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: var(--sp-8);
  padding: var(--sp-8) 0 0 var(--sp-2);
}

/* 叶子节点：透明、左缘状态色条（与 pill 同一语义语言） */
.hub-node {
  position: relative;
  display: block; width: 100%;
  text-align: left; color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-left: 2.5px solid var(--node-c, var(--border-strong));
  border-radius: 0 var(--r-8) var(--r-8) 0;
  padding: 7px var(--sp-10);
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.hub-node.st-running { --node-c: var(--green); }
.hub-node.st-idle    { --node-c: var(--blue); }
.hub-node.st-parked  { --node-c: var(--glyph-faint); }
.hub-node.st-aborted { --node-c: var(--red); }
.hub-node:hover { background: var(--surface-hover); }
.hub-node.sel { background: var(--accent-softer); border-color: var(--accent-border); }

.hub-node .hn-top { display: flex; align-items: center; gap: var(--sp-6); min-width: 0; }
.hub-node .hn-name {
  display: inline-flex; align-items: center; gap: 5px;
  min-width: 0; font-weight: var(--fw-medium); font-size: var(--fs-12);
}
.hub-node .hn-flags { margin-left: auto; display: flex; gap: var(--sp-4); flex: none; }
.hub-node .hn-cost {
  flex: none; font-family: var(--font-mono);
  font-size: var(--fs-12); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; color: var(--text);
}
.hub-node .hn-task {
  margin-top: 2px;
  font-size: var(--fs-11); color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hub-node .hn-foot {
  display: flex; align-items: center; gap: var(--sp-6);
  margin-top: 4px; font-size: calc(10.5px * var(--text-font-scale)); color: var(--text-faint);
}
.hub-node .hn-foot .mono { font-family: var(--font-mono); font-size: calc(10px * var(--text-font-scale)); font-variant-numeric: tabular-nums; }
.hub-node .hn-foot .hn-art { margin-left: auto; display: flex; gap: var(--sp-4); }

/* 树状模式下的孤儿（无父/父不可见）仍用整卡，视觉上比叶子更"独立" */
.hub-tgroup.orphan { margin-bottom: 0; }

/* ---------- 移动端微调 ---------- */
@media (max-width: 560px) {
  .hub-card .hc-spark { display: none; }
  .hub-card .hc-tokens b { font-size: var(--fs-16); }
  .hub-tg-head .tg-task { display: none; }
}

/* ============================================================
   详情列：Agent 档案（dossier）
   头部（身份 · 状态 · 模型 · 操作）与标签栏不动，下面的标签体自己滚动。
   列表视图里整列 sticky，长列表滚动时档案一直留在视口；指挥台视图由
   分栏行高撑满；≤900px 是抽屉（见文件末尾的媒体查询）。
   视觉语言与指挥台检视器（deck.css .ad-ins-*）一致：Sigil、细线小标题、数据格。
   ============================================================ */
.hub-detail {
  /* --hub-bar-h / --hub-scroll-h 由 AgentHub.tsx 量出：吸顶的工作区标签栏高度、页面滚动区高度。 */
  position: sticky;
  top: calc(var(--hub-bar-h, 0px) + var(--sp-12));
  max-height: calc(var(--hub-scroll-h, 100dvh) - var(--hub-bar-h, 0px) - var(--sp-12) - max(var(--hub-tail-h, 0px), var(--sp-16)));
  min-height: min(420px, calc(var(--hub-scroll-h, 100dvh) - var(--hub-bar-h, 0px) - var(--sp-32)));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-10);
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  container: hub-detail / inline-size;
}
.hub-cols.is-deck .hub-detail,
.hub-page.is-chat-preview .hub-detail,
.hub-page.is-chat-closing .hub-detail { position: relative; top: auto; max-height: none; min-height: 0; }

/* ---------- 档案头 ---------- */
.hub-dossier-head {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: var(--sp-12);
  padding: var(--sp-12) var(--sp-16) var(--sp-14);
}
.hub-dossier-top { display: flex; align-items: center; gap: var(--sp-6); min-height: 22px; }
.hub-dossier-crumb {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-4);
  min-width: 0;
  max-width: 72%;
  margin-left: calc(var(--sp-6) * -1);
  padding: 2px var(--sp-8) 2px var(--sp-6);
  border: 0;
  border-radius: var(--r-6);
  background: none;
  color: var(--text-3);
  font-size: var(--fs-11);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.hub-dossier-crumb > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hub-dossier-crumb:hover { background: var(--accent-softer); color: var(--accent); }
.hub-dossier-kind {
  margin-left: auto;
  padding: 0 var(--sp-6);
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: calc(10.5px * var(--text-font-scale));
  font-weight: var(--fw-medium);
  line-height: 18px;
  white-space: nowrap;
}

.hub-dossier-id {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  align-items: center;
  gap: var(--sp-12);
  animation: var(--motion-swap);
}
.hub-dossier-name { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hub-dossier-name h3 {
  margin: 0;
  overflow: hidden;
  font-size: var(--fs-16);
  font-weight: var(--fw-semibold);
  line-height: 1.3;
  letter-spacing: -0.005em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hub-dossier-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4) var(--sp-8); min-width: 0; }
.hub-dossier-meta {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-6);
  color: var(--text-3);
  font-size: var(--fs-11);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.hub-dossier-meta > span { display: inline-flex; align-items: center; gap: 3px; }
.hub-dossier-meta > span + span::before {
  content: "";
  width: 3px;
  height: 3px;
  margin-right: 3px;
  border-radius: var(--r-full);
  background: var(--glyph-faint);
}
.hub-dossier-meta .icon { color: var(--glyph-faint); }
.hub-dossier-model { display: flex; align-items: center; gap: var(--sp-6); min-width: 0; }
.hub-dossier-model-name {
  min-width: 0;
  overflow: hidden;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--fs-11);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hub-dossier-fallback { display: inline-flex; flex: none; color: var(--amber); }
.hub-dossier-fallback + .hub-dossier-model-name { color: var(--amber); }

.hub-dossier-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-6); }
.hub-dossier-actions .btn.small { gap: var(--sp-4); }
.hub-dossier-stop { margin-left: auto; }

/* ---------- 标签栏：下划线式，激活条从中间展开 ---------- */
.hub-detail-tabs {
  flex: none;
  position: relative;
  z-index: 2;
  padding: 0 var(--sp-10);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  transition: box-shadow var(--dur-fast) var(--ease);
}
.hub-dossier-head[data-scrolled] + .hub-detail-tabs {
  box-shadow: 0 8px 12px -12px color-mix(in srgb, var(--text) 45%, transparent);
}
.hub-detail-tabs .tabs[role="tablist"] { gap: 0; }
.hub-detail-tabs .tabs[role="tablist"] > [role="tab"] {
  position: relative;
  gap: var(--sp-6);
  height: 38px;
  padding: 0 var(--sp-10);
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  font-size: var(--fs-12);
}
.hub-detail-tabs .tabs[role="tablist"] > [role="tab"]::after {
  content: "";
  position: absolute;
  right: var(--sp-8);
  bottom: -1px;
  left: var(--sp-8);
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--accent);
  scale: 0 1;
  transition: scale var(--dur-fast) var(--ease);
}
.hub-detail-tabs .tabs[role="tablist"] > [role="tab"]:hover { background: transparent; color: var(--text); }
.hub-detail-tabs .tabs[role="tablist"] > [role="tab"]:is(.active, [aria-selected="true"]) {
  border: 0;
  background: transparent;
  box-shadow: none;
  color: var(--text);
}
.hub-detail-tabs .tabs[role="tablist"] > [role="tab"]:is(.active, [aria-selected="true"])::after { scale: 1 1; }
.hub-detail-tabs [role="tab"] > .icon { color: var(--glyph-faint); transition: color var(--dur-fast) var(--ease); }
.hub-detail-tabs [role="tab"]:is(.active, [aria-selected="true"]) > .icon { color: var(--accent); }
.hub-tab-badge {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: calc(10px * var(--text-font-scale));
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  line-height: 16px;
  text-align: center;
}
/* 窄档：未激活的标签只留图标（文字在 data-tip 里），激活的仍显示文字。 */
@container hub-detail (max-width: 440px) {
  .hub-detail-tabs [role="tab"]:not(.active) > .page-tab-label { display: none; }
  .hub-dossier-head { padding-inline: var(--sp-14); }
}

/* ---------- 标签体：各标签面叠在同一格里交叉过渡，各自滚动 ---------- */
.hub-detail-body {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}
.hub-pane {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 0;
  padding: var(--sp-16) var(--sp-16) var(--sp-20);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.hub-pane-inner { min-width: 0; animation: var(--motion-swap); }
.hub-pane[data-pane="transcript"] > .hub-pane-inner { display: flex; flex-direction: column; min-height: 100%; }
.hub-pane[data-pane="transcript"] .hub-transcript { flex: 1 1 auto; height: auto; min-height: 280px; }
/* BTW 铺满：话题栏、对话、输入框自己管边距。 */
.hub-pane[data-pane="btw"] { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.hub-pane[data-pane="btw"] > .hub-pane-inner { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.hub-pane[data-pane="btw"] .btw-child-pane { min-height: 360px; }
.hub-pane[data-pane="btw"] .btw-child-context { padding: var(--sp-8) var(--sp-16); }
.hub-pane[data-pane="btw"] .btw-empty.empty { min-height: 0; padding: var(--sp-16) var(--sp-4) var(--sp-8); }
.hub-pane[data-pane="btw"] .btw-empty-icon { width: 32px; height: 32px; margin-bottom: var(--sp-12); }
.hub-pane[data-pane="btw"] .btw-empty.empty h3 { font-size: var(--fs-14); }
.hub-pane[data-pane="btw"] .btw-empty.empty p { line-height: 1.7; }

/* ---------- 概览各节 ---------- */
.hub-dossier-overview { display: flex; flex-direction: column; gap: var(--sp-20); }
.hub-dossier-sec { display: flex; flex-direction: column; gap: var(--sp-8); min-width: 0; }
.hub-dossier-sec > h4 {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  margin: 0;
  color: var(--text-3);
  font-size: var(--fs-11);
  font-weight: var(--fw-semibold);
  letter-spacing: 0.02em;
}
.hub-dossier-sec > h4 > span { color: var(--text-faint); font-weight: var(--fw-regular); font-variant-numeric: tabular-nums; }
.hub-dossier-sec > h4::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.hub-dossier-now { display: flex; align-items: flex-start; gap: var(--sp-8); color: var(--text); font-size: var(--fs-12); line-height: 1.6; }
.hub-dossier-now > .icon { flex: none; margin-top: 3px; color: var(--text-3); }
.hub-dossier-now[data-tone="running"] > .icon { color: var(--green); animation: omp-pulse var(--loop-pulse) var(--ease-loop) infinite; }
.hub-dossier-now[data-tone="waiting"] > .icon { color: var(--amber); }
.hub-dossier-now[data-tone="failed"] > .icon { color: var(--red); }
.hub-dossier-now > span { min-width: 0; overflow-wrap: anywhere; }
.hub-dossier-args { margin-left: var(--sp-6); color: var(--text-2); font-family: var(--font-mono); font-size: var(--fs-11); }
.hub-dossier-retry { display: flex; align-items: center; gap: var(--sp-6); color: var(--amber); font-size: var(--fs-11); }
.hub-dossier-progress { display: flex; align-items: center; gap: var(--sp-8); min-width: 0; }
.hub-dossier-bar { flex: 1; min-width: 48px; height: 6px; overflow: hidden; border-radius: 3px; background: var(--surface-3); }
.hub-dossier-bar > i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--green)));
  transition: inline-size var(--dur-slow) var(--ease-out);
}
.hub-dossier-stage { flex: 0 1 auto; min-width: 0; overflow: hidden; color: var(--text-2); font-size: var(--fs-11); text-overflow: ellipsis; white-space: nowrap; }
.hub-dossier-pct { flex: none; color: var(--text-2); font-size: var(--fs-11); font-variant-numeric: tabular-nums; white-space: nowrap; }

.hub-dossier-chips { display: flex; flex-wrap: wrap; gap: var(--sp-6); min-width: 0; }
.hub-dossier-job,
.hub-dossier-agent {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-6);
  max-width: 100%;
  height: 24px;
  padding: 0 var(--sp-8) 0 var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface);
  color: var(--text-2);
  font-size: var(--fs-11);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.hub-dossier-job { padding-left: var(--sp-8); font-family: var(--font-mono); }
.hub-dossier-job > span,
.hub-dossier-agent > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hub-dossier-agent > .icon { margin-left: var(--sp-2); color: var(--text-3); }
.hub-dossier-agent > .sg { border-radius: var(--r-full); }
.hub-dossier-job:hover,
.hub-dossier-agent:hover { border-color: var(--accent-border); background: var(--accent-softer); color: var(--accent); }
.hub-dossier-dot { flex: none; width: 6px; height: 6px; border-radius: var(--r-full); background: var(--glyph-faint); }
.hub-dossier-dot[data-tone="running"] { background: var(--green); }
.hub-dossier-dot[data-tone="idle"] { background: var(--blue); }
.hub-dossier-dot[data-tone="waiting"] { background: var(--amber); }
.hub-dossier-dot[data-tone="failed"] { background: var(--red); }

.hub-dossier-task { margin: 0; color: var(--text); font-size: var(--fs-12); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
.hub-dossier-task[data-clamped] { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.hub-dossier-link {
  align-self: flex-start;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: var(--fs-11);
  cursor: pointer;
}
.hub-dossier-link:hover { text-decoration: underline; }

.hub-dossier-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); margin: 0; }
.hub-dossier-tiles > div { min-width: 0; padding: var(--sp-8) var(--sp-10); border-radius: var(--r-8); background: var(--surface-2); }
.hub-dossier-tiles dt { color: var(--text-3); font-size: calc(10.5px * var(--text-font-scale)); }
.hub-dossier-tiles dd {
  margin: 2px 0 0;
  overflow: hidden;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: var(--fs-14);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hub-dossier-context { display: flex; align-items: center; gap: var(--sp-8); color: var(--text-3); font-size: var(--fs-11); }
.hub-dossier-context[data-high] .hub-dossier-bar > i { background: var(--red); }
@container hub-detail (max-width: 340px) {
  .hub-dossier-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.hub-dossier-lineage { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--sp-8) var(--sp-12); }
.hub-dossier-label { color: var(--text-3); font-size: var(--fs-11); }
.hub-dossier-none { color: var(--text-faint); font-size: var(--fs-11); }

.hub-dossier-mode { display: flex; align-items: flex-start; gap: var(--sp-6); color: var(--text-2); font-size: var(--fs-12); line-height: 1.5; }
.hub-dossier-mode > .icon { flex: none; margin-top: 2px; color: var(--text-3); }
.hub-dossier-facts { display: grid; gap: var(--sp-6); margin: 0; }
.hub-dossier-facts > div { display: grid; grid-template-columns: minmax(72px, 1fr) minmax(0, 3fr); align-items: center; gap: var(--sp-10); min-height: 24px; }
.hub-dossier-facts dt { color: var(--text-3); font-size: var(--fs-11); }
.hub-dossier-facts dd { display: flex; align-items: center; gap: var(--sp-4); min-width: 0; margin: 0; color: var(--text-2); font-size: var(--fs-12); }
.hub-dossier-facts code {
  min-width: 0;
  overflow: hidden;
  padding: 1px var(--sp-6);
  border-radius: var(--r-4);
  background: var(--surface-2);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--fs-11);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- 折叠节（模型与思考、技术信息） ---------- */
.hub-dossier-folds { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.hub-dossier-fold { border-bottom: 1px solid var(--border); font-size: var(--fs-12); }
.hub-dossier-fold > summary {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  min-height: 38px;
  padding: 0 var(--sp-4);
  color: var(--text-2);
  font-weight: var(--fw-medium);
  list-style: none;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease);
}
.hub-dossier-fold > summary::-webkit-details-marker { display: none; }
.hub-dossier-fold > summary:hover { color: var(--text); }
.hub-dossier-fold > summary > .icon:first-child { color: var(--text-3); }
.hub-dossier-fold > summary > span { flex: 1; min-width: 0; }
.hub-dossier-fold > summary > .icon:last-child { color: var(--glyph-faint); transition: rotate var(--dur) var(--ease-out); }
.hub-dossier-fold[open] > summary > .icon:last-child { rotate: 90deg; }
.hub-dossier-fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-6); }
.hub-dossier-fold-body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-10);
  padding: var(--sp-2) var(--sp-4) var(--sp-14) calc(var(--sp-4) + 14px + var(--sp-8));
  animation: var(--motion-unfold);
}
.hub-dossier-copy .icon-btn { flex: none; }

/* 详情内联提示（revive/kill 拒绝、错误） */
.hub-notice {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-8);
  padding: var(--sp-8) var(--sp-10);
  border-radius: var(--r-6);
  font-size: var(--fs-12);
  background: var(--red-soft);
  color: var(--red);
  margin-bottom: var(--sp-10);
}
.hub-notice.ok { background: var(--green-soft); color: var(--green); }
.hub-notice.warn { background: var(--amber-soft); color: var(--amber); }
.hub-notice.err { background: var(--red-soft); color: var(--red); }

/* ---------- Transcript ---------- */
.hub-transcript {
  height: 360px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-8);
  background: var(--bg-inset);
  padding: var(--sp-10) var(--sp-12);
  font-size: var(--fs-12);
  display: flex;
  flex-direction: column;
  gap: var(--sp-8);
}
.hub-tr-msg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hub-tr-msg .tr-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-8);
  font-size: var(--fs-11);
  color: var(--text-3);
}
.hub-tr-msg .tr-role { font-weight: var(--fw-semibold); color: var(--text-2); }
.hub-tr-msg .tr-body {
  border-left: 2px solid var(--border-strong);
  padding-left: var(--sp-10);
  color: var(--text-2);
  white-space: pre-wrap;
  word-break: break-word;
}
.hub-tr-msg.user .tr-role { color: var(--accent); }
.hub-tr-msg.tool .tr-body { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-3); }
.hub-tr-msg.system .tr-body { color: var(--text-faint); }

.hub-send { display: flex; gap: var(--sp-8); margin-top: var(--sp-10); align-items: flex-end; }
.hub-send textarea { flex: 1; }
/* .send-hint 是 .hub-send 的兄弟（transcript 模板里紧跟其后），不是子节点 */
.hub-send + .send-hint {
  display: block;
  font-size: var(--fs-11);
  color: var(--text-faint);
  margin-top: var(--sp-4);
}

/* read-only transcript 提示条 */
.hub-ro-banner {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  padding: var(--sp-8) var(--sp-10);
  border-radius: var(--r-6);
  font-size: var(--fs-12);
  background: var(--surface-2);
  color: var(--text-3);
  margin-top: var(--sp-10);
}

/* ---------- Jobs ---------- */
.hub-job {
  display: flex;
  align-items: center;
  gap: var(--sp-10);
  padding: var(--sp-8) var(--sp-10);
  border: 1px solid var(--border);
  border-radius: var(--r-8);
  margin-bottom: var(--sp-8);
  font-size: var(--fs-12);
  background: var(--surface);
}
.hub-job .jb-label { flex: 1; min-width: 0; }
.hub-job .jb-label .mono { font-size: var(--fs-11); color: var(--text-3); display: block; margin-top: 1px; }

/* ---------- Messages: the selected agent's thread, drawn by the deck's Comms board ---------- */
.hub-pane[data-pane="messages"] { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.hub-pane[data-pane="messages"] > .hub-pane-inner { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.hub-comms { --ad-line: var(--border); display: flex; flex: 1; flex-direction: column; min-height: 0; }
.hub-comms > .ad-empty.is-inline { flex: 1; }

/* outcome chip */
.hub-outcome {
  display: inline-flex;
  align-items: center;
  height: 16px;
  padding: 0 var(--sp-6);
  border-radius: var(--r-full);
  font-size: calc(10.5px * var(--text-font-scale));
  font-weight: var(--fw-medium);
}
.hub-outcome.injected { background: var(--accent-soft); color: var(--accent); }
.hub-outcome.woken { background: var(--green-soft); color: var(--green); }
.hub-outcome.revived { background: var(--amber-soft); color: var(--amber); }
.hub-outcome.failed { background: var(--red-soft); color: var(--red); }

/* ---------- 空态 / 加载 ---------- */
.hub-empty-list {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-8);
  padding: var(--sp-32);
  color: var(--text-3);
  font-size: var(--fs-12);
  text-align: center;
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-8);
}
.hub-empty-list > .icon { width: 28px; height: 28px; stroke-width: 1.2; color: var(--glyph-faint); }
.hub-loading-row { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-12); color: var(--text-3); font-size: var(--fs-12); }

/* ---------- 能力标注 ---------- */
.hub-cap-note {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-4);
  font-size: var(--fs-11);
  color: var(--text-faint);
}

/* ---------- New Agent / 菜单通用 ---------- */
.hub-na-grid { display: flex; flex-direction: column; gap: var(--sp-12); }
.hub-na-row { display: flex; gap: var(--sp-10); }
.hub-na-row .field { flex: 1; }

/* ---------- 移动端：<900px 详情变抽屉 ---------- */
.hub-drawer-back { display: none; }
@media (max-width: 900px) {
  .hub-cols { grid-template-columns: 1fr; }
  /* 指挥台占满宽度；详情照旧是抽屉，打开对话预览也不再分栏。 */
  .hub-page .hub-cols.is-deck { grid-template-columns: minmax(0, 1fr); }
  .hub-detail {
    position: fixed;
    top: var(--topbar-h);
    right: 0;
    bottom: 0;
    left: 0;
    z-index: var(--z-panel);
    max-height: none;
    border-radius: 0;
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform var(--dur) var(--ease-out);
    overflow: hidden;
  }
  /* 指挥台、对话预览下也一样是抽屉，盖过上面宽屏的 relative。 */
  .hub-page .hub-cols .hub-detail { position: fixed; top: var(--topbar-h); max-height: none; min-height: 0; }
  .hub-detail.open { transform: translateX(0); }
  .hub-drawer-back { display: inline-flex; }
  .hub-search { width: 100%; }
  .hub-main { flex-wrap: wrap; }
  .hub-main .hm-actions { width: 100%; }
}

const SIGIL_GRID = 7;
const SIGIL_HUE_DEG = [22, 52, 84, 146, 176, 204, 232, 262, 296, 334];

function sigilHash(seed) {
  let hash = 0x811c9dc5;
  for (let index = 0; index < seed.length; index += 1) {
    hash ^= seed.charCodeAt(index);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash >>> 0;
}
const sigilHue = (seed) => sigilHash(`hue:${seed}`) % SIGIL_HUE_DEG.length;

function sigilSpec(seed, commander = false) {
  const bits = sigilHash(seed);
  const bit = (index) => (bits >>> index) & 1;
  const pick = (index, count) => ((bits >>> index) & 0xff) % count;
  const cells = [];
  const eyes = [];
  const add = (x, y, part) => {
    const cell = { x, y, part };
    if (part === "eye") eyes.push(cell);
    else cells.push(cell);
  };
  const mirror = (x, y, part) => {
    add(x, y, part);
    if (x !== 3) add(6 - x, y, part);
  };
  const antenna = commander ? 3 : pick(0, 3);
  const rounded = commander || bit(3) === 1;
  const ears = !commander && bit(4) === 1;
  const eyeStyle = commander ? 0 : [0, 0, 0, 1, 1, 2][pick(6, 6)];
  const eyeRow = commander ? 2 : eyeStyle === 1 ? 2 : 2 + bit(5);
  const mouth = commander ? 0 : pick(9, 4);
  const narrowJaw = !commander && bit(12) === 1;
  const body = commander ? 2 : pick(13, 3);
  if (antenna === 3) {
    mirror(1, 0, "crown");
    add(3, 0, "crown");
  } else if (antenna === 0) add(3, 0, "beacon");
  else if (antenna === 1) mirror(2, 0, "beacon");
  const eyeColumns = eyeStyle === 2 ? [2, 3, 4] : [2, 4];
  const eyeRows = eyeStyle === 1 ? [eyeRow, eyeRow + 1] : [eyeRow];
  const mouthColumns = mouth === 0 ? [2, 3, 4] : mouth === 1 ? [3] : mouth === 2 ? [2, 4] : [];
  const mouthRow = eyeRows[eyeRows.length - 1] + 2;
  for (let y = 1; y <= 5; y += 1) {
    for (let x = 1; x <= 5; x += 1) {
      const corner = (x === 1 || x === 5) && (y === 1 || (y === 5 && narrowJaw));
      if (corner && (rounded || y === 5)) continue;
      if (eyeRows.includes(y) && eyeColumns.includes(x)) {
        add(x, y, "eye");
        continue;
      }
      if (y === mouthRow && mouthRow <= 5 && mouthColumns.includes(x)) {
        add(x, y, "mouth");
        continue;
      }
      add(x, y, "head");
    }
  }
  if (ears) mirror(0, 3, "head");
  if (body === 1) add(3, 6, "head");
  else if (body === 2) {
    mirror(2, 6, "head");
    add(3, 6, "head");
    if (!narrowJaw) mirror(1, 6, "head");
  }
  return { cells, eyes };
}
const cellsPath = (cells, part) => cells.filter((cell) => cell.part === part).map((cell) => `M${cell.x} ${cell.y}h1v1h-1z`).join("");
const eyesPath = (eyes, closed) => eyes.map((cell) => (closed ? `M${cell.x} ${cell.y + 0.55}h1v0.35h-1z` : `M${cell.x} ${cell.y}h1v1h-1z`)).join("");

function agentSigil(id, name, tone, size, progress, ring) {
  const radius = Math.round(size * 0.3);
  const cell = size >= 24 ? Math.round((size * 0.7) / 7) : (size * 0.72) / 7;
  const art = cell * 7;
  const offset = Math.round((size - art) / 2);
  const spec = sigilSpec(id);
  const closed = tone === "idle" || tone === "parked" || tone === "stopped";
  const hue = SIGIL_HUE_DEG[sigilHue(name)];
  const phase = ((sigilHash(`blink:${id}`) % 100) / 100).toFixed(2);
  const showRing = ring && progress !== undefined;
  return (
    `<span class="sg" data-tone="${tone}" style="--sg-h:${hue};--sg-phase:${phase};width:${size}px;height:${size}px;border-radius:${radius}px" aria-hidden="true">` +
    `<svg class="sg-tile" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">` +
    `<g class="sg-art" transform="translate(${offset} ${offset}) scale(${art / SIGIL_GRID})" shape-rendering="crispEdges">` +
    `<path class="sg-head" d="${cellsPath(spec.cells, "head")}"></path>` +
    `<path class="sg-mouth" d="${cellsPath(spec.cells, "mouth")}"></path>` +
    `<path class="sg-crown" d="${cellsPath(spec.cells, "crown")}"></path>` +
    `<path class="sg-beacon" d="${cellsPath(spec.cells, "beacon")}"></path>` +
    `<path class="sg-eyes${closed ? " is-closed" : ""}" d="${eyesPath(spec.eyes, closed)}"></path>` +
    `</g>` +
    (showRing
      ? `<rect class="sg-ring-track" x="0.75" y="0.75" width="${size - 1.5}" height="${size - 1.5}" rx="${radius - 0.75}"></rect>` +
        `<rect class="sg-ring" x="0.75" y="0.75" width="${size - 1.5}" height="${size - 1.5}" rx="${radius - 0.75}" pathLength="100" stroke-dasharray="${Math.max(0.001, progress * 100).toFixed(2)} 100"></rect>`
      : "") +
    `</svg></span>`
  );
}

function fmtCost(cost) {
  if (!Number.isFinite(cost) || cost === 0) return "—";

}

  isolated: false,
};

const ROSTER = [MAIN, ...AGENTS];
const byId = (id) => ROSTER.find((agent) => agent.id === id);
const CHILDREN = (id) => ROSTER.filter((agent) => agent.parentId === id);

const JOBS = [
  { id: "job_01", title: "bun test core/src/__tests__", status: "done", startedAt: NOW - 4 * 60_000, endedAt: NOW - 3 * 60_000 },
  { id: "job_02", title: "bun run check", status: "running", startedAt: NOW - 2 * 60_000 },
  { id: "job_03", title: "git diff --stat", status: "failed", startedAt: NOW - 9 * 60_000, endedAt: NOW - 8 * 60_000 },
];

const MESSAGES = [
  { from: "CoreToolCutover", to: "all", at: NOW - 42_000, text: "八工具外派完成，`worker-bridge` 的派发表已改完。" },
  { from: "main", to: ["CoreFixtureTypes", "CoreCatalogTests"], at: NOW - 66_000, text: "测试类型和 catalog 两组并行，改完先跑 `bun test`。" },
  { from: "CoreCatalogTests", to: "all", at: NOW - 121_000, text: "catalog 五个文件迁移完成，两条用例需要 snapshot 更新。" },
  { from: "McpRetirement", to: "all", at: NOW - 184_000, text: "mcp/ 与 plugin-registry 收口完成。" },
];
/* ── AgentCards.tsx ── */
function statusDot(status) {
  const cls = status === "released" ? "parked" : status;
  return `<span class="hub-sd ${cls}${status === "running" ? " pulse" : ""}" aria-hidden="true"></span>`;
}
function flagChips(agent, kids) {
  return (
    (agent.unread > 0 ? `<span class="hub-unread" data-tip="${agent.unread} 未读">${icon("message", "sm")}${agent.unread}</span>` : "") +
    (agent.readOnly ? '<span class="hub-ro-tag">read-only</span>' : "") +
    (kids ? `<span class="hub-ro-tag" data-tip="子 Agent">↳ ${kids} 子</span>` : "")
  );
}
function sparkSvg(tokens) {
  const hot = sparkLevel(tokens);
  return (
    `<svg class="hc-spark" width="13" height="8" viewBox="0 0 13 8" aria-hidden="true">` +
    [1, 2, 3].map((index) => `<rect class="hb-bar${index <= hot ? " hot" : ""}" x="${(index - 1) * 5}" y="${8 - index * 2}" width="3" height="${index * 2}" rx="1"></rect>`).join("") +
    `</svg>`
  );
}
function artChips(agent) {
  const chips = [agent.outputPath ? "out" : null, agent.patchPath ? "patch" : null, agent.branchName ? "branch" : null].filter(Boolean);
  if (!chips.length) return "";
  return `<span class="hc-art">${chips.map((chip) => `<span class="hub-art">${chip}</span>`).join("")}</span>`;
}
function modelLine(agent) {
  if (agent.fallback) return `<span class="hub-model hub-fallback">回退模型 → ${agent.fallback}</span>`;
  if (agent.resolvedModel) return `<span class="hub-model">${agent.resolvedModel}</span>`;
  return "";
}
function stageLine(agent) {
  if (!agent.stage && agent.completionPercent === undefined) return "";
  const percent = agent.completionPercent;
  return (
    `<span class="hub-agent-stage">` +
    (percent !== undefined
      ? `<svg class="completion-ring" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" class="cr-track"></circle><circle cx="8" cy="8" r="6.5" class="cr-fill" pathLength="100" transform="rotate(-90 8 8)" stroke-dasharray="${Math.max(0, Math.min(100, percent)).toFixed(1)} 100"></circle></svg>`
      : "") +
    (agent.stage ? `<span class="ellipsis" title="${agent.stage}">${agent.stage}</span>` : "") +
    `</span>`
  );
}

function cardHtml(agent, kids) {
  const pill = activityPill(agent);
  const metrics = agent.metrics;
  const duration = hubDurationMs(agent, NOW);
  const selected = state.selected === agent.id;
  return (
    `<button class="hub-card${selected ? " sel" : ""}" type="button" role="option" aria-selected="${selected}" data-select="${agent.id}">` +
    `<span class="hc-main">` +
    `<span class="hc-top">` +
    `<span class="hub-act ${pill.cls}">${pill.label}</span>` +
    `<span class="hc-name">${statusDot(agent.status)}<span>${agent.name}</span></span>` +
    (agent.unread > 0 || agent.readOnly || kids > 0 ? `<span class="hc-flags">${flagChips(agent, kids)}</span>` : "") +
    `</span>` +
    `<span class="hc-task">${agent.task}</span>` +
    stageLine(agent) +
    `<span class="hc-foot">` +
    (agent.modelRole ? `<span class="hub-role">${agent.modelRole}</span>` : "") +
    modelLine(agent) +
    artChips(agent) +
    `</span></span>` +
    `<span class="hc-side">` +
    (agent.startedAt ? `<span class="hc-start" data-tip="已运行 ${duration === undefined ? "—" : fmtDur(duration)}">${icon("clock", "sm")}${fmtHM(agent.startedAt)}</span>` : "") +
    (metrics ? `<span class="hc-tokens"><b>${fmtNum(metrics.tokens)}</b><i>tok</i>${sparkSvg(metrics.tokens)}</span>` : "") +
    (metrics ? `<span class="hc-pace"><span class="hub-num"><i>req</i><b>${metrics.requests}</b></span><span class="hub-num"><i>tools</i><b>${metrics.tools}</b></span></span>` : "") +
    `<span class="hc-cost">${metrics ? fmtCost(metrics.cost) : "usage —"}</span>` +
    `</span></button>`
  );
}

function nodeHtml(agent) {
  const pill = activityPill(agent);
  const status = agent.status === "released" ? "parked" : agent.status;
  const selected = state.selected === agent.id;
  return (
    `<button class="hub-node st-${status}${selected ? " sel" : ""}" type="button" role="option" aria-selected="${selected}" data-select="${agent.id}">` +
    `<span class="hn-top"><span class="hub-act ${pill.cls}">${pill.label}</span>` +
    `<span class="hn-name">${statusDot(agent.status)}<span>${agent.name}</span></span>` +
    (agent.unread > 0 || agent.readOnly ? `<span class="hn-flags">${flagChips(agent)}</span>` : "") +
    (agent.metrics ? `<span class="hn-cost">${fmtCost(agent.metrics.cost)}</span>` : "") +
    `</span>` +
    `<span class="hn-task">${agent.task}</span>` +
    stageLine(agent) +
    `<span class="hn-foot">` +
    (agent.modelRole ? `<span class="hub-role">${agent.modelRole}</span>` : "") +
    `<span class="mono">${agent.fallback ? `回退模型 → ${agent.fallback}` : agent.resolvedModel ?? ""}</span>` +
    `<span>${fmtAge(agent.lastActivity, NOW)}</span>` +
    `<span class="hn-art">${artChips(agent)}</span>` +
    `</span></button>`
  );
}

function treeGroupHtml(head, kids) {
  const pill = activityPill(head);
  const cost = [head, ...kids].reduce((sum, agent) => sum + (agent.metrics?.cost ?? 0), 0);
  return (
    `<div class="hub-tgroup">` +
    `<button class="hub-tg-head${state.selected === head.id ? " sel" : ""}" type="button" role="option" aria-selected="${state.selected === head.id}" data-select="${head.id}">` +
    `<span class="tg-ic">${icon("bot", "sm")}</span>` +
    `<span class="hub-act ${pill.cls}">${pill.label}</span>` +
    `<span class="tg-name">${statusDot(head.status)}<span>${head.name}</span></span>` +
    `<span class="tg-task">${head.task}</span>` +
    `<span class="tg-right">${flagChips(head, kids.length)}<span class="tg-cost">${fmtCost(cost)}</span><span class="tg-caret">${icon("chevron-d", "sm")}</span></span>` +
    `</button>` +
    `<div class="hub-tchildren"><span class="hub-trail" aria-hidden="true"></span><div class="hub-tleaves">` +
    kids.map((kid) => nodeHtml(kid)).join("") +
    `</div></div></div>`
  );
}

/* ── HubDossier.tsx ── */
function dossierHeadHtml(agent) {
  const parent = agent.parentId ? byId(agent.parentId) : undefined;
  const duration = hubDurationMs(agent, NOW);
  const model = agent.fallback ?? agent.resolvedModel;
  const parked = agent.status === "parked";
  const ended = agent.status === "aborted" || agent.status === "released";
  const pill = activityPill(agent);
  return (
    `<header class="hub-dossier-head">` +
    `<div class="hub-dossier-top">` +
    `<button class="icon-btn small hub-drawer-back" type="button" data-tip="返回" aria-label="返回">${icon("arrow-l", "sm")}</button>` +
    `<button class="hub-dossier-crumb" type="button" data-select="${parent?.id ?? "main"}" aria-label="父代理：${parent?.name ?? "主对话"}" data-tip="查看父代理">${icon("arrow-u", "sm")}<span>${parent?.name ?? "主对话"}</span></button>` +
    `<span class="hub-dossier-kind">${isAdvisor(agent) ? "顾问" : "子代理"}</span>` +
    `</div>` +
    `<div class="hub-dossier-id">` +
    agentSigil(agent.id, agent.name, hubTone(agent), 44, agent.completionPercent === undefined ? undefined : Math.min(1, agent.completionPercent / 100), true) +
    `<div class="hub-dossier-name"><h3 title="${agent.name}">${agent.name}</h3>` +
    `<div class="hub-dossier-line">` +
    `<span class="hub-act ${pill.cls}">${pill.label}</span>` +
    `<span class="hub-dossier-meta"><span data-tip="运行时长">${icon("clock", "sm")}${duration === undefined ? "—" : fmtDur(duration)}</span><span>最近活动 ${fmtAge(agent.lastActivity, NOW)}</span></span>` +
    (agent.readOnly && !isAdvisor(agent) ? '<span class="hub-ro-tag">只读</span>' : "") +
    `</div>` +
    (agent.modelRole || model
      ? `<div class="hub-dossier-model">` +
        (agent.modelRole ? `<span class="hub-role">${agent.modelRole}</span>` : "") +
        (agent.fallback ? `<span class="hub-dossier-fallback" data-tip="正在使用回退模型" aria-label="回退模型">${icon("undo", "sm")}</span>` : "") +
        (model ? `<span class="hub-dossier-model-name" title="${model}">${model}</span>` : "") +
        `</div>`
      : "") +
    `</div></div>` +
    `<div class="hub-dossier-actions">` +
    `<button class="btn small primary" type="button">${icon("message", "sm")}打开对话</button>` +
    (parked ? `<button class="btn small outline" type="button">${icon("refresh", "sm")}恢复</button>` : "") +
    (ended
      ? `<button class="btn small outline" type="button">${icon("x", "sm")}释放</button>`
      : `<button class="btn small danger hub-dossier-stop" type="button">${icon("stop", "sm")}停止</button>`) +
    `</div></header>`
  );
}

function dossierSection(title, count, body) {
  return `<section class="hub-dossier-sec"><h4>${title}${count !== undefined ? `<span>${count}</span>` : ""}</h4>${body}</section>`;
}

function nowLineHtml(agent) {
  const tone = hubTone(agent);
  const iconName = tone === "failed" ? "alert" : tone === "waiting" ? "clock" : tone === "running" ? "pulse" : "pause";
  let text;
  if (agent.currentTool) text = `<span class="chip blue xs">${agent.currentTool.name}</span>${agent.currentTool.args ? `<span class="hub-dossier-args">${agent.currentTool.args}</span>` : ""}`;
  else if (agent.lastIntent) text = agent.lastIntent;
  else if (agent.status === "running" && agent.task !== "—") text = agent.task;
  else if (tone === "waiting") text = "等待输入";
  else if (agent.status === "parked") text = "已停驻，发消息或恢复后继续";
  else if (agent.status === "released" || agent.rawStatus === "released") text = "已释放";
  else if (agent.status === "aborted") text = "已结束";
  else text = "无进行中的工具调用";
  return `<div class="hub-dossier-now" data-tone="${tone}">${icon(iconName, "sm")}<span>${text}</span></div>`;
}

function agentChipHtml(agent) {
  return `<button type="button" class="hub-dossier-agent" data-select="${agent.id}">${agentSigil(agent.id, agent.name, hubTone(agent), 16)}<span>${agent.name}</span><i class="hub-dossier-dot" data-tone="${hubTone(agent)}" aria-hidden="true"></i></button>`;
}

function overviewHtml(agent) {
  const metrics = agent.metrics;
  const duration = hubDurationMs(agent, NOW);
  const context = metrics?.contextWindow ? Math.max(0, Math.min(1, (metrics.contextTokens ?? 0) / metrics.contextWindow)) : undefined;
  const parent = agent.parentId ? byId(agent.parentId) : undefined;
  const longTask = agent.task.length > 220;
  const tiles = [
    ["时长", duration === undefined ? "—" : fmtDur(duration)],
    ["Tokens", metrics ? fmtNum(metrics.tokens) : "—"],
    ["请求", metrics ? String(metrics.requests) : "—"],
    ["工具", metrics ? String(metrics.tools) : "—"],
    ["成本", metrics ? fmtCost(metrics.cost) : "—"],
    ["上下文", context === undefined ? "—" : `${Math.round(context * 100)}%`],
  ];
  const facts = [["输出", agent.outputPath], ["补丁", agent.patchPath], ["工作区分支", agent.branchName]].filter(([, value]) => typeof value === "string" && value !== "");
  const progress = agent.completionPercent;
  const children = CHILDREN(agent.id);
  return (
    `<div class="hub-dossier-overview">` +
    dossierSection("当前",
      undefined,
      nowLineHtml(agent) +
      (progress !== undefined || agent.stage
        ? `<div class="hub-dossier-progress">` +
          (progress !== undefined ? `<span class="hub-dossier-bar"><i style="inline-size:${Math.max(0, Math.min(100, progress)).toFixed(1)}%"></i></span>` : "") +
          (agent.stage ? `<span class="hub-dossier-stage" title="${agent.stage}">${agent.stage}</span>` : "") +
          (progress !== undefined ? `<span class="hub-dossier-pct">${Math.round(progress)}%</span>` : "") +
          `</div>`
        : "") +
      (agent.activeJobIds.length
        ? `<div class="hub-dossier-chips">${agent.activeJobIds.map((id) => `<button type="button" class="hub-dossier-job" data-jobs="1" data-tip="查看后台任务">${icon("terminal", "sm")}<span>${id}</span></button>`).join("")}</div>`
        : "")) +
    dossierSection("任务", undefined,
      `<p class="hub-dossier-task"${longTask && !state.taskOpen ? ' data-clamped="true"' : ""}>${agent.task}</p>` +
      (longTask ? `<button type="button" class="hub-dossier-link" data-task-toggle="1">${state.taskOpen ? "收起" : "展开全文"}</button>` : "")) +
    dossierSection("用量", undefined,
      `<dl class="hub-dossier-tiles">${tiles.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join("")}</dl>` +
      (context !== undefined && metrics?.contextWindow
        ? `<div class="hub-dossier-context"${context > 0.8 ? ' data-high="true"' : ""}><span>上下文</span>` +
          `<span class="hub-dossier-bar"><i style="inline-size:${(context * 100).toFixed(1)}%"></i></span>` +
          `<span class="hub-dossier-pct">${fmtNum(metrics.contextTokens ?? 0)} / ${fmtNum(metrics.contextWindow)}</span></div>`
        : "")) +
    dossierSection("谱系", children.length || undefined,
      `<div class="hub-dossier-lineage">` +
      `<span class="hub-dossier-label">父代理</span><div class="hub-dossier-chips">` +
      (parent ? agentChipHtml(parent) : `<button type="button" class="hub-dossier-agent">${icon("message", "sm")}<span>主对话</span></button>`) +
      `</div>` +
      `<span class="hub-dossier-label">子代理</span><div class="hub-dossier-chips">` +
      (children.length ? children.map((child) => agentChipHtml(child)).join("") : '<span class="hub-dossier-none">无</span>') +
      `</div></div>`) +
    dossierSection("产物与变更", undefined,
      `<div class="hub-dossier-mode">${icon(isAdvisor(agent) || agent.readOnly ? "lock" : agent.isolated ? "shield" : "folder", "sm")}` +
      `<span>${isAdvisor(agent) || agent.readOnly ? "只读 · 不改动代码" : agent.isolated ? `隔离工作区 · ${agent.hasLiveSession ? "会话在线" : "仅保留记录"}` : "共享工作区 · 不按代理拆分代码行数"}</span></div>` +
      (facts.length
        ? `<dl class="hub-dossier-facts">${facts.map(([label, value]) => `<div><dt>${label}</dt><dd><code title="${value}">${value}</code></dd></div>`).join("")}</dl>`
        : "")) +
    `<div class="hub-dossier-folds">` +
    `<details class="hub-dossier-fold"><summary>${icon("info", "sm")}<span>技术信息</span>${icon("chevron-r", "sm")}</summary>` +
    `<div class="hub-dossier-fold-body"><dl class="hub-dossier-facts">` +
    `<div><dt>ID</dt><dd class="hub-dossier-copy"><code title="${agent.id}">${agent.id}</code><button type="button" class="icon-btn small" data-tip="复制 ID" aria-label="复制 ID">${icon("copy", "sm")}</button></dd></div>` +
    `<div><dt>原生状态</dt><dd><code>${agent.rawStatus}</code></dd></div>` +
    `<div><dt>类型</dt><dd><code>${agent.kind}</code></dd></div>` +
    `<div><dt>代数</dt><dd><code>${agent.generation}</code></dd></div>` +
    `<div><dt>会话</dt><dd>${agent.hasLiveSession ? "在线" : "仅记录"}</dd></div>` +
    `<div><dt>创建时间</dt><dd>${new Date(agent.startedAt).toLocaleString("zh-CN")}</dd></div>` +
    `</dl></div></details></div>` +
    `</div>`
  );
}

function transcriptHtml(agent) {
  return (
    `<div class="hub-transcript" id="hubTranscript">` +
    `<div class="hub-tr-msg"><span class="tr-head"><b>${agent.name}</b><span class="mono">${fmtClock(agent.startedAt)}</span></span>` +
    `<p>${agent.task}</p></div>` +
    `<div class="hub-tr-msg"><span class="tr-head"><b>${agent.name}</b><span class="mono">${fmtClock(agent.lastActivity)}</span></span>` +
    `<p>已完成文件改动，正在回写会话记录。</p></div>` +
    `</div>` +
    `<div class="hub-send"><textarea class="input" rows="2" placeholder="给 ${agent.name} 发消息…" aria-label="发消息"></textarea>` +
    `<button type="button" class="btn small primary">${icon("message", "sm")}发送</button></div>` +
    `<p class="send-hint">只读历史会话不可发送消息</p>`
  );
}

function jobsHtml(agent) {
  const jobs = JOBS.slice(0, agent.status === "running" ? 3 : 2);
  return (
    `<div class="hub-job-tree">` +
    jobs.map((job) => `<div class="hub-job"><span class="hj-ic">${icon("terminal", "sm")}</span>` +
      `<span class="hj-main"><b>${job.title}</b><span class="mono">${job.id} · ${fmtClock(job.startedAt)}</span></span>` +
      `<span class="hub-outcome" data-tone="${job.status === "failed" ? "failed" : job.status === "running" ? "running" : "idle"}">${job.status === "running" ? "运行中" : job.status === "failed" ? "失败" : "完成"}</span></div>`).join("") +

function messagesHtml(agent) {
  const row = (name) => byId(name) ?? MAIN;
  return (
    `<div class="hub-comms"><div class="hub-comms-scroll" style="display:flex;flex-direction:column;gap:var(--sp-8)">` +
    MESSAGES.map((message) => {
      const from = row(message.from);
      return (
        `<article class="ad-post">` +
        `<button type="button" class="ad-post-face" data-select="${from.id}" aria-label="${from.name}">${agentSigil(from.id, from.name, hubTone(from), 28)}</button>` +
        `<div class="ad-post-main"><header>` +
        `<button type="button" class="ad-post-from" data-select="${from.id}">${from.name}</button>` +
        `<span class="ad-post-to">${message.to === "all" ? '<span class="ad-to is-all">全体</span>' : message.to.map((name) => `<span class="ad-to"><span>${name}</span></span>`).join("")}</span>` +
        `<span class="ad-post-meta">${fmtAge(message.at, NOW)}</span>` +
        `</header><p class="ad-post-body">${message.text.replace(/`([^`]+)`/g, "<code>$1</code>")}</p></div></article>`
      );
    }).join("") +
    `</div></div>`
  );
}

function detailBodyHtml(agent) {
  if (state.tab === "overview") return overviewHtml(agent);
  if (state.tab === "transcript") return transcriptHtml(agent);
  if (state.tab === "jobs") return jobsHtml(agent);
  return messagesHtml(agent);
}

    `</div>` +
    `<span class="spacer"></span>` +
    `<input class="input hub-search" type="search" placeholder="搜索名称 / 任务 / 模型…" aria-label="搜索 Agent" value="${state.query}">` +

}

function usageRowHtml() {
  return (
    `<div class="hub-usage">` +
    `<span>$1.83 · 35h 55m · 412 req · 358 tools · 1.9M tok</span>` +
    `<span class="spacer"></span>` +
    `<button class="btn small primary" type="button">${icon("plus", "sm")}创建代理</button>` +
    `</div>`
  );
}

function visibleAgents() {
  const needle = state.query.trim().toLowerCase();
  return AGENTS.filter((agent) => {
    if (state.statusFilter && agent.status !== state.statusFilter) return false;
    return !needle || [agent.name, agent.task, agent.resolvedModel ?? ""].some((text) => text.toLowerCase().includes(needle));
  }).sort(byStatusOrder);
}

function listHtml() {
  const agents = visibleAgents();
  if (!agents.length) {
    return `<div class="hub-empty-list">${icon("search")}<b>没有匹配的 Agent</b><span>换个关键词试试</span></div>`;
  }
  if (state.view === "tree") {
    const roots = ROSTER.filter((agent) => !agent.parentId);
    return roots
      .map((root) => treeGroupHtml(root, agents.filter((agent) => agent.parentId === root.id).sort(byStatusOrder)))
      .join("");
  }
  return agents.map((agent) => cardHtml(agent, 0)).join("");
}

function tabsHtml(agent) {
  const badges = { jobs: agent.activeJobIds.length, messages: agent.unread };
  return (
    `<div class="hub-detail-tabs"><div class="tabs" role="tablist" aria-label="Agent 详情">` +
    TABS.map(([id, label, iconName]) => {
      const badge = badges[id] ?? 0;
      return `<button type="button" role="tab" data-tab="${id}" class="${state.tab === id ? "active" : ""}" aria-selected="${state.tab === id}" aria-label="${label}">` +
        icon(iconName, "sm") + `<span>${label}</span>` +
        (badge > 0 ? `<span class="hub-tab-badge">${badge}</span>` : "") +
        `</button>`;
    }).join("") +
    `</div></div>`
  );
}

function render() {
  const agent = state.selected ? byId(state.selected) : null;
  const detail = agent
    ? `<div class="hub-detail open${state.drawer ? " open" : ""}" id="hubDetail"><div class="hub-face-stage"><div class="hub-face" data-hub-face="dossier">` +
      dossierHeadHtml(agent) + tabsHtml(agent) +
      `<div class="hub-detail-body"><div class="hub-pane" data-pane="${state.tab}" role="tabpanel"><div class="hub-pane-inner" key="${agent.id}">${detailBodyHtml(agent)}</div></div></div>` +
      `</div></div></div>`
    : `<div class="hub-detail hub-detail-placeholder"><div class="hub-empty-list" style="border:none">${icon("cursor")}<b>未选择 Agent</b><span>在左侧选一个子代理查看档案</span></div></div>`;
  page.innerHTML =
    mainBannerHtml() +
    rosterHeadHtml() +
    usageRowHtml() +
    `<div class="hub-cols${state.view === "deck" ? " is-deck" : ""}">` +
    `<div class="hub-list${state.view === "tree" ? " tree" : ""}" role="listbox" aria-label="子 Agent 列表">${listHtml()}</div>` +
    detail +
    `</div>` +
    `<div class="hub-kbd-hint">j/k 选择 · Enter 打开 · t 切换视图</div>`;
}

page.addEventListener("click", (event) => {
  const select = event.target.closest("[data-select]");
  if (select) {
    state.selected = select.dataset.select;
    state.taskOpen = false;
    render();
    return;
  }
  const statusFilter = event.target.closest("[data-status-filter]");
  if (statusFilter) {
    const key = statusFilter.dataset.statusFilter;
    state.statusFilter = state.statusFilter === key ? null : key;
    render();
    return;
  }
  const view = event.target.closest("[data-view]");
  if (view) {
    state.view = view.dataset.view;
    render();
    return;
  }
  const tab = event.target.closest("[data-tab]");
  if (tab) {
    state.tab = tab.dataset.tab;
    render();
    return;
  }
  if (event.target.closest("[data-task-toggle]")) {
    state.taskOpen = !state.taskOpen;
    render();
    return;
  }
  if (event.target.closest("[data-jobs]")) {
    state.tab = "jobs";
    render();
  }
});

page.addEventListener("input", (event) => {
  if (!event.target.matches(".hub-search")) return;
  state.query = event.target.value;
  const caret = event.target.selectionStart;
  render();
  const next = page.querySelector(".hub-search");
  if (next) {
    next.focus();
    next.setSelectionRange(caret, caret);
  }
});

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, textarea")) return;
  if (event.key === "t") {
    state.view = state.view === "flat" ? "tree" : "flat";
    render();
    return;
  }
  if (event.key !== "j" && event.key !== "k" && event.key !== "Enter") return;
  const agents = visibleAgents();
  if (!agents.length) return;
  if (event.key === "Enter") {
    if (!state.selected) {
      state.selected = agents[0].id;
      render();
    }
    return;
  }
  const index = agents.findIndex((agent) => agent.id === state.selected);
  const next = event.key === "j" ? Math.min(agents.length - 1, index + 1) : Math.max(0, index - 1);
  state.selected = agents[index < 0 ? 0 : next].id;
  state.taskOpen = false;
  render();
});

render();
    </script>
  </body>
</html>
