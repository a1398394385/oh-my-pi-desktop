<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omp desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="ic-chevron-down" viewBox="0 0 16 16"><path d="M3.5 6 8 10.5 12.5 6"/></symbol>
  <symbol id="ic-chevron-right" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></symbol>
  <symbol id="ic-model" viewBox="0 0 16 16"><path d="M8 2.6 9.15 6.35 12.9 7.5 9.15 8.65 8 12.4 6.85 8.65 3.1 7.5 6.85 6.35z"/></symbol>
  <symbol id="ic-gauge" viewBox="0 0 16 16"><path d="M3.1 11.2a5.2 5.2 0 1 1 9.8 0"/><path d="M8 11.2 10.4 7.5"/></symbol>
  <symbol id="ic-send" viewBox="0 0 16 16"><path d="M8 12.8V3.6M4.7 6.9 8 3.6l3.3 3.3"/></symbol>
  <symbol id="ic-stop" viewBox="0 0 16 16"><rect x="4.8" y="4.8" width="6.4" height="6.4" rx="1.2"/></symbol>
  <symbol id="ic-check" viewBox="0 0 16 16"><path d="M3.8 8.4 6.4 11 12.2 5.2"/></symbol>
  <symbol id="ic-x" viewBox="0 0 16 16"><path d="M4.6 4.6 11.4 11.4M11.4 4.6 4.6 11.4"/></symbol>
  <symbol id="ic-folder" viewBox="0 0 16 16"><path d="M2.5 4.6a1 1 0 0 1 1-1h2.5l1.2 1.5h5.3a1 1 0 0 1 1 1v5.3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="ic-users" viewBox="0 0 16 16"><circle cx="6" cy="6.2" r="2"/><path d="M2.9 12.6c0-1.8 1.4-2.8 3.1-2.8s3.1 1 3.1 2.8"/><path d="M10.7 5.1a1.8 1.8 0 0 1 .2 3.5M11.3 12.6c0-1.3-.4-2.1-1.1-2.6"/></symbol>
  <symbol id="ic-list" viewBox="0 0 16 16"><path d="M3.3 5h9.4M3.3 8h9.4M3.3 11h6.2"/></symbol>
  <symbol id="ic-shield" viewBox="0 0 16 16"><path d="M8 2.6 12.7 4.3v3.3c0 2.6-1.8 4.6-4.7 5.5-2.9-.9-4.7-2.9-4.7-5.5V4.3z"/></symbol>
  <symbol id="ic-file" viewBox="0 0 16 16"><path d="M5.2 2.6h3.6l3 3v7.8H5.2z"/><path d="M8.6 2.6v3h3"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 16 16"><path d="M13.2 8a5.2 5.2 0 1 1-1.5-3.7M13.4 2.6v2.6h-2.6"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar" aria-label="会话">
    <div class="sb-top">
      <span class="brand"><svg class="i brand-mark"><use href="#ic-model"/></svg>omp desktop</span>
    </div>
    <div class="sb-actions">
      <button class="sb-action" id="btnNewSession">
        <svg class="i"><use href="#ic-plus"/></svg>新建会话<span class="kbd">⌘N</span>
      </button>
    </div>
    <div class="sb-list" id="sessionList"></div>
    <div class="sb-foot">
      <span class="cwd mono" id="cwdLabel" title="">—</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="where">
        <svg class="i"><use href="#ic-folder"/></svg>
        <span class="mono" id="whereCwd">…</span>
      </span>
      <h1 id="sessionTitle">新会话</h1>
      <span class="conn" id="connState">连接中…</span>
    </header>

    <div class="stream" id="stream">
      <div class="stream-inner" id="streamInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="向 omp 提问" aria-label="消息输入"></textarea>
        <div class="composer-bar">
          <div class="meter" title="上下文占用"><span class="bar"><span class="fill" id="ctxFill"></span></span><span class="mono" id="ctxText">—</span></div>
          <span class="grow"></span>
          <button type="button" class="pill" id="effortPill" title="思考档位（随模型变化）">
            <svg class="i"><use href="#ic-gauge"/></svg><span id="effortLabel">—</span><svg class="i" style="width:11px;height:11px"><use href="#ic-chevron-down"/></svg>
          </button>
          <button type="button" class="pill" id="modelPill" title="切换模型">
            <svg class="i"><use href="#ic-model"/></svg><span id="modelLabel">…</span><svg class="i" style="width:11px;height:11px"><use href="#ic-chevron-down"/></svg>
          </button>
          <button class="send" id="sendBtn" data-ready="false" data-stop="false" title="发送" aria-label="发送">
            <svg class="i"><use href="#ic-send"/></svg>
          </button>
        </div>
      </div>
      <div class="hintline"><span>Enter 发送 · Shift+Enter 换行</span></div>
    </div>

    <section class="panel" id="panel" data-mode="expanded" aria-label="状态面板">
      <div class="panel-head">
        <span class="title">状态</span>
        <span class="progress" id="panelProgress"></span>
        <span class="spacer"></span>
        <button class="icon-btn sm" id="panelMini" title="收起为胶囊" aria-label="收起为胶囊"><svg class="i"><use href="#ic-x"/></svg></button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </section>
    <button class="panel-capsule" id="panelCapsule" hidden>状态</button>
  </main>
</div>

<div class="menu" id="menu" hidden role="menu"></div>
<script src="app.js"></script>
</body>
</html>
