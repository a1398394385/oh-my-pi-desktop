<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp desktop</title>
    <link rel="stylesheet" href="vendor/diff2html.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ══ 左栏 ══ -->
    <aside id="sidebar">
      <div class="nav">
        <div class="nav-item" id="navNew">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6.2" cy="6.2" r="4.4"/><path d="M9.6 9.6 13.4 13.4M6.2 4.4v3.6M4.4 6.2h3.6"/></svg>
          新建任务 <span class="kbd">⌘ N</span>
        </div>
      </div>

      <div class="viewtabs">
        <div class="seg" id="seg">
          <button data-view="recent">最近</button>
          <button data-view="project" class="on">项目</button>
        </div>
      </div>

      <div id="tasklist"></div>

      <div class="side-foot">
        <div class="avatar">🐼</div>
        <div class="sf-tx">
          <span class="uname">omp-desktop</span>
          <span class="pro">Pro</span>
        </div>
        <span class="sp"></span>
        <span id="conn-status" title="宿主连接状态">连接中…</span>
      </div>
    </aside>
    <div id="left-resizer" class="resizer" title="拖动调整宽度"></div>

    <!-- ══ 中栏 ══ -->
    <main id="main">
      <div class="chat-head">
        <svg width="15" height="13" viewBox="0 0 15 13" fill="none" stroke="currentColor" stroke-width="1.3" style="color:var(--faint)"><path d="M1.5 3h3l1 1.5h8v6.5h-12z"/></svg>
        <span class="ttl" id="chatTitle">选择左侧会话或新建任务</span>
      </div>

      <div class="changebar hidden" id="changebar">
        <span class="cb-tt">
          <svg id="chv" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="transition:transform .15s"><path d="M2.5 3.5 5 6l2.5-2.5"/></svg>
          <span id="cbText"></span>
        </span>
      </div>
      <div class="changes-files" id="changesFiles"></div>

      <div id="stream"></div>

      <div id="composer">
        <textarea id="input" rows="1" placeholder="发消息…（Enter 发送）"></textarea>
        <div class="cbar">
          <button class="pill-btn" id="modeBtn">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.5 1.4 11 3.2v3.1c0 3-1.9 4.7-4.5 5.3-2.6-.6-4.5-2.3-4.5-5.3V3.2z"/></svg>
            <span id="modeLabel">变更前确认</span> <span style="font-size:10px">⌄</span>
          </button>
          <button class="pill-btn" id="ctxBtn" title="上下文占用">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2" width="10" height="9" rx="1.5"/><path d="M1.5 5h10M4.5 7.5h4"/></svg>
            <span id="ctxLabel">—</span>
          </button>
          <span class="sp"></span>
          <span class="ctx-ring" id="ctxRing" hidden title="">
            <svg viewBox="0 0 16 16" width="14" height="14">
              <circle class="track" cx="8" cy="8" r="6.5"/>
              <circle class="fill" id="ctxRingFill" cx="8" cy="8" r="6.5" transform="rotate(-90 8 8)"/>
            </svg>
          </span>
          <button class="pill-btn" id="modelBtn"><span id="modelLabel">模型</span> <span style="font-size:10px;color:var(--faint)">⌄</span></button>
          <button class="pill-btn" id="thinkBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7 1.5a4 4 0 0 0-4 4c0 1.5.6 2.3 1.2 3.1.4.6.8 1.2.8 2.1V12h4v-1.3c0-.9.4-1.5.8-2.1.6-.8 1.2-1.6 1.2-3.1a4 4 0 0 0-4-4Z"/><path d="M5.5 12.8h3"/></svg>
            <span id="thinkLabel">思考</span> <span style="font-size:10px;color:var(--faint)">⌄</span>
          </button>
          <button class="send" id="sendBtn" title="发送">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 10.5V2M2.8 6 6.5 2.3 10.2 6"/></svg>
          </button>
        </div>
        <!-- 权限模式（omp 三值，大行样式） -->
        <div class="menu mode" id="modeMenu">
          <div class="mi big" data-mode="always-ask">
            <span class="mi-ic">✋</span>
            <span class="mi-tx"><span class="mi-tt">变更前确认</span><span class="mi-desc">改文件和执行命令前都先问我。</span></span>
            <span class="ck"></span>
          </div>
          <div class="mi big" data-mode="write">
            <span class="mi-ic">🛡</span>
            <span class="mi-tx"><span class="mi-tt">自动编辑</span><span class="mi-desc">自动改文件，命令执行需确认。</span></span>
            <span class="ck"></span>
          </div>
          <div class="mi big" data-mode="yolo">
            <span class="mi-ic">🛡</span>
            <span class="mi-tx"><span class="mi-tt">完全访问</span><span class="mi-desc">全部自动执行，减少确认。</span></span>
            <span class="ck"></span>
          </div>
        </div>
        <!-- 模型（宿主 enabledModels 过滤后下发，按 provider 分组） -->
        <div class="menu model" id="modelMenu"></div>
        <!-- 思考级别（只列当前模型支持的档位） -->
        <div class="menu" id="thinkMenu">
          <div class="mh">推理强度（随当前模型能力变化）</div>
        </div>
        <!-- 上下文容量（breakdown + 会话统计） -->
        <div class="menu ctx" id="ctxMenu"></div>
      </div>
    </main>
    <div id="right-resizer" class="resizer" title="拖动调整宽度"></div>

    <!-- ══ 右栏 ══ -->
    <aside id="right">
      <div class="rtoolbar">
        <button class="icon-btn logo" title="当前 project">
          <svg width="17" height="17" viewBox="0 0 17 17"><rect width="17" height="17" rx="4.5" fill="#3a7bd5"/><path d="M4.8 9.2 7 11.4l5.4-5.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="wsName" style="font-size:10.5px;color:var(--dim)">—</span>
        </button>
        <span class="sp"></span>
        <button class="icon-btn" id="themeBtn" title="界面主题">◐</button>
        <button class="icon-btn on" title="展开侧边面板" id="panelToggle">
          <svg width="14" height="13" viewBox="0 0 14 13" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1.5" width="12" height="10" rx="2"/><path d="M9.5 1.5v10"/></svg>
        </button>
      </div>

      <div id="statusWrap">
        <div id="statusCard" class="hidden">
          <div class="sc-head">
            <b>进程</b><span class="frac" id="todoFrac"></span>
            <span class="sp"></span>
            <button class="icon-btn" id="scCollapse" title="收起为胶囊">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5h3.5V5M11.5 1.5 7.5 5.5M5 11.5H1.5V8M1.5 11.5l4-4"/></svg>
            </button>
          </div>
          <div id="todoList"></div>
          <div class="sc-row rvonly" id="agentsRow" title="点击查看子代理">智能体<span class="rv" id="agentsRv"></span></div>
        </div>
        <button id="capsule" class="hidden"></button>
      </div>

      <div id="sidepanel">
        <div class="sp-head">
          <div class="seg" id="rightSeg">
            <button data-tab="subagent">子代理</button>
            <button data-tab="gitdiff">Git Diff</button>
          </div>
          <span class="sp"></span>
          <button class="icon-btn" id="gitRefresh" title="刷新" style="display:none">⟳</button>
          <button class="icon-btn" id="gitViewToggle" title="切换树/平铺" style="display:none">树</button>
        </div>
        <div id="rightBody"></div>
      </div>
    </aside>

    <div id="toast" class="hidden"></div>
    <script src="vendor/diff2html.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
