<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp desktop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <button id="new-session">＋ 新建会话</button>
      <div id="session-list"></div>
      <div id="conn-status" class="ok">连接中…</div>
    </aside>
    <main id="main">
      <div id="messages"></div>
      <div id="composer">
        <textarea id="input" rows="2" placeholder="发消息…（Enter 发送）"></textarea>
        <button id="send">发送</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
