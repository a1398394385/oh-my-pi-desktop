[package]
name = "omp-desktop"
version = "0.1.0"
description = "omp 桌面壳：窗口 + Bun 宿主进程管理"
edition = "2021"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: system-audio loopback capture (WASAPI) + FFT for the message-rail
# music reactive effect. Gated at build time so other platforms keep compiling
# without pulling the Windows SDK crates in.
[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
rustfft = "6"
