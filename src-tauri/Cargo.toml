[package]
name = "omp-desktop"
version = "0.4.0"
description = "omp 桌面壳：窗口 + Bun 宿主进程管理"
edition = "2021"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `devtools` feature: it keeps the debug-only devtools on in RELEASE builds,
# which makes the packaged webview remotely inspectable (wry -> WKWebView
# setInspectable / WebView2 AreDevToolsEnabled), i.e. an external process can
# attach and drive the shipped app. Debug builds keep devtools via
# cfg(debug_assertions), so `bun run dev` stays attachable.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
# Auto-update: check/download/install the release bundle. Restarting afterwards
# uses core Tauri (AppHandle::restart), so tauri-plugin-process is not needed.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# FFT for the message-rail music reactive effect (WASAPI loopback on Windows,
# ScreenCaptureKit on macOS — both feed the shared analyzer in src/audio/).
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
parking_lot = "0.12"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-core-audio-types", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
# Native traffic lights: the shell re-places them on every UI zoom change
# (set_traffic_light_y in lib.rs) — needs NSWindow standardWindowButton + NSView frames.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSSound"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2-core-audio-types", "CMBase", "CMBlockBuffer", "CMSampleBuffer"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSBundle"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media"] }
# Desktop notifications (src/notify.rs): the modern UNUserNotificationCenter API.
# tauri-plugin-notification's macOS backend is the legacy NSUserNotification API,
# which macOS 15+ rejects for modern clients — see the module docs.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger"] }

# Windows-only: system-audio loopback capture (WASAPI). Gated at build time so
# other platforms keep compiling without pulling the Windows SDK crates in.
[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }

# Test-only: mock runtime drives the real IPC pipeline in the invoke-route test
# (lib.rs tests). Feature unification applies only to `cargo test` builds.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
