[package]
name = "omp-desktop"
version = "0.1.0"
description = "omp 桌面壳：窗口 + Bun 宿主进程管理"
edition = "2021"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
