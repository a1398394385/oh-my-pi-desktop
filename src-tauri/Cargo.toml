[package]
name = "omp-desktop"
version = "0.1.0"
edition = "2021"
description = "omp 桌面套壳（Rust + Tauri）"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
