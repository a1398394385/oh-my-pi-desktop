<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置页重新分类原型 · omp-desktop</title>
<!-- 丢弃型原型：token 值抄自 ui/css/global/tokens.css，仅用于观感比较，不参与构建。 -->
<style>
  :root {
    --base:#292B2C; --card:#161616; --inset:#2B2B2B; --select:#3F4141;
    --panel-2:#353738; --surface:rgba(255,255,255,.05); --line:#3A3C3D; --line-soft:rgba(255,255,255,.06);
    --text:#ededef; --dim:#b0b0b6; --faint:#8c8c92;
    --green:#34c759; --blue:#6fb3d8; --purple:#a86fe0; --accent:#4a9eff;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui-fs-base:13px; --ui-fs-sm:11.5px; --ui-fs-xs:10px;
    --r-sm:6px; --r-md:10px; --r-lg:12px;
    --swift:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--base); color: var(--text); font: var(--ui-fs-base)/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 214px minmax(0,1fr); height: 100%; gap: 8px; padding: 8px; }

  /* ── 左侧设置导航 ── */
  .nav { background: var(--base); border-radius: var(--r-lg); padding: 12px 8px; overflow: auto; }
  .nav-hd { font-size: var(--ui-fs-sm); color: var(--faint); padding: 2px 10px 10px; letter-spacing: .02em; }
  .nav-grp { font-size: var(--ui-fs-xs); color: var(--faint); padding: 12px 10px 4px; letter-spacing: .04em; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--r-sm); color: var(--dim); font-size: var(--ui-fs-sm); cursor: default; }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.on { background: var(--select); color: var(--text); }
  .nav-item .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .45; flex: none; }
  .nav-item.on .dot { opacity: 1; background: var(--accent); }

  /* ── 右侧页面 ── */
  .page { background: var(--card); border-radius: var(--r-lg); overflow: auto; }
  .page-in { max-width: 820px; margin: 0 auto; padding: 26px 32px 120px; }
  .set-tt { font-size: 17px; font-weight: 600; margin-bottom: 18px; }
  .set-group-tt { font-size: var(--ui-fs-sm); color: var(--faint); margin: 18px 2px 8px; }
  .set-card { background: var(--inset); border-radius: var(--r-md); overflow: hidden; }
  .srow { display: flex; align-items: center; gap: 16px; padding: 11px 14px; border-top: 1px solid var(--line-soft); }
  .srow:first-child { border-top: 0; }
  .srow-tx { flex: 1; min-width: 0; }
  .srow-tx b { display: block; font-weight: 500; font-size: var(--ui-fs-base); }
  .srow-tx span { display: block; color: var(--faint); font-size: var(--ui-fs-sm); margin-top: 2px; }
  .ctl { flex: none; }

  .sel { display: flex; align-items: center; gap: 6px; min-width: 104px; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; font-size: var(--ui-fs-sm); color: var(--text); }
  .sel i { color: var(--faint); font-style: normal; }
  .tg { width: 34px; height: 20px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); position: relative; }
  .tg i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--faint); transition: left 160ms var(--swift); }
  .tg.on { background: rgba(74,158,255,.28); border-color: rgba(74,158,255,.55); }
  .tg.on i { left: 16px; background: var(--accent); }
  .num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--panel-2); }
  .num button { border: 0; background: transparent; color: var(--dim); width: 24px; height: 24px; font: inherit; }
  .num span { padding: 0 8px; font-size: var(--ui-fs-sm); }
  .num em { font-style: normal; color: var(--faint); font-size: var(--ui-fs-xs); }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: var(--r-sm); font: inherit; font-size: var(--ui-fs-sm); padding: 4px 10px; }
  .pills { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
  .pills span { font-size: var(--ui-fs-sm); color: var(--dim); padding: 2px 9px; border-radius: 999px; }
  .pills span.on { background: var(--select); color: var(--text); }
  .tag { font-size: var(--ui-fs-xs); color: var(--green); border: 1px solid rgba(52,199,89,.35); border-radius: 999px; padding: 1px 7px; }
  .tag.dim { color: var(--faint); border-color: var(--line); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line-soft); font-size: var(--ui-fs-sm); }
  .list-row:first-child { border-top: 0; }
  .list-row .nm { flex: 1; min-width: 0; }
  .list-row .nm small { display: block; color: var(--faint); font-size: var(--ui-fs-xs); }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 22px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.15); }
  .hint { color: var(--faint); font-size: var(--ui-fs-sm); margin: 10px 2px 0; }
  .empty { color: var(--faint); font-size: var(--ui-fs-sm); padding: 40px 0; }
</style>
</head>

<div class="app">
  <aside class="nav" id="nav"></aside>

  ["代理", ["memory", "skills", "plugins", "extensions", "mcp", "hooks", "agents", "automations"]],
  ["能力", ["tools", "shell", "computer", "services", "remote"]],
  ["系统", ["keyboard", "experimental", "developer", "advanced", "stats"]],
];

let cur = "appearance";

function ctl(c) {
  if (!c) return "";
  const [k, v] = c.split(/:(.*)/s);
  if (k === "sel") return `<div class="sel"><span>${v}</span><i>⌄</i></div>`;
  if (k === "tg") return `<div class="tg${v === "1" ? " on" : ""}"><i></i></div>`;
  if (k === "num") { const [n, u] = v.split("|"); return `<div class="num"><button>−</button><span>${n} ${u ? `<em>${u}</em>` : ""}</span><button>+</button></div>`; }
  if (k === "btn") return `<button class="btn">${v}</button>`;
  if (k === "pills") { const [a, on] = v.split("|"); return `<div class="pills">${a.split("|").map((s, i) => `<span${i === +on ? ' class="on"' : ""}>${s}</span>`).join("")}</div>`; }
  if (k === "tag") { const [t, d] = v.split("|"); return `<span class="tag${d === "1" ? " dim" : ""}">${t}</span>`; }
  return "";
}

function rows(list) {
  if (!list.length) return "";
  return `<div class="set-card">${list.map((x) => `<div class="srow"><div class="srow-tx"><b>${x.t}</b>${x.d ? `<span>${x.d}</span>` : ""}</div><div class="ctl">${ctl(x.c)}</div></div>`).join("")}</div>`;
}

function renderNav() {
  document.getElementById("nav").innerHTML =
    `<div class="nav-hd">设置</div>` +
    NAV.map(([g, ids]) => `<div class="nav-grp">${g}</div>` + ids.map((id) => `<div class="nav-item${id === cur ? " on" : ""}" data-id="${id}"><span class="dot"></span>${PAGES[id].label}</div>`).join("")).join("");
}

function renderPage() {
  const p = PAGES[cur];
  let html = `<div class="set-tt">${p.label}</div>`;
  if (p.tabs) {
    // 已取消页内分段条：原 tab 的分组按序平铺到一页（数据形状保留 tab 名，仅作分组来源）。
    for (const [, groups] of Object.entries(p.tabs)) for (const [tt, list] of groups) {
      html += `<div class="set-group-tt">${tt}</div>`;
      html += tt === "资产列表" || tt === "插件列表"
        ? `<div class="set-card">
            <div class="list-row"><span class="nm">code-review<small>Profile · v1.2.3</small></span><span class="tag">启用</span><div class="tg on"><i></i></div></div>
            <div class="list-row"><span class="nm">kimi-browser-bridge<small>当前项目 · v0.9.0</small></span><span class="tag dim">禁用</span><div class="tg"><i></i></div></div>
            <div class="list-row"><span class="nm">archify<small>Profile · v2.0.1</small></span><span class="tag">启用</span><div class="tg on"><i></i></div></div>
          </div>`
        : rows(list);
    }
  } else {
    for (const [g, list] of p.groups) {
      html += `<div class="set-group-tt">${g}</div>`;
      html += g.includes("列表")
        ? `<div class="set-card">
            <div class="list-row"><span class="nm">code-review<small>Profile · v1.2.3</small></span><span class="tag">启用</span><div class="tg on"><i></i></div></div>
            <div class="list-row"><span class="nm">kimi-browser-bridge<small>当前项目 · v0.9.0</small></span><span class="tag dim">禁用</span><div class="tg"><i></i></div></div>
          </div>`
        : rows(list);
    }
  }
  document.getElementById("page").innerHTML = html;
}

function renderAll() { renderNav(); renderPage(); }

document.addEventListener("click", (e) => {
  const ni = e.target.closest(".nav-item");
  if (ni) { cur = ni.dataset.id; renderAll(); document.querySelector(".page").scrollTop = 0; return; }
});

renderAll();
