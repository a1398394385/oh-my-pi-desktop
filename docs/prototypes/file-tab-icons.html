<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件 tab · 更多菜单图标选择</title>
<style>
  :root {
    --card: #161616; --panel: #1e1f20; --panel-2: #353738; --select: #3F4141;
    --line: #3A3C3D; --text: #ededef; --dim: #b0b0b6; --faint: #8c8c92; --accent: #3a7bd5;
    --ui-fs-sm: 11.5px; --ui-fs-base: 13px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--card); color: var(--text); font: 13px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; padding: 28px 32px 110px; }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--faint); font-size: 12px; margin-bottom: 22px; }
  h2 { font-size: var(--ui-fs-base); font-weight: 500; color: var(--dim); margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 10px;
          background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font: inherit; }
  .card:hover { background: var(--panel-2); }
  .card.on { border-color: var(--accent); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--accent); }
  .card .ic { display: inline-flex; height: 24px; align-items: center; color: var(--dim); }
  .card.on .ic { color: var(--text); }
  .card code { font-size: 10.5px; color: var(--faint); }
  .card.on code { color: var(--text); }
  .rows { display: flex; flex-direction: column; gap: 4px; width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px; margin-top: 8px; }
  .mh { font-size: var(--ui-fs-sm); color: var(--faint); padding: 5px 8px 2px; }
  .mi { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 6px; font-size: var(--ui-fs-base); color: var(--text); }
  .mi .mi-ic { width: 18px; display: inline-flex; justify-content: center; color: var(--dim); }
  .mi .ck { margin-left: auto; width: 14px; display: inline-flex; justify-content: center; color: var(--faint); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
         padding: 14px 32px; background: #101011; border-top: 1px solid var(--line); }
  .bar code { font-size: 13px; color: var(--text); }
  .bar button { margin-left: auto; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer; }
  .bar button:hover { background: var(--select); }
</style>
</head>
<body>
  <h1>文件 tab · 更多菜单图标选择</h1>
  <div class="sub">点卡片选择，三个槽位各选一个；选完点右下角「复制」把结果发给我。图标直接取自 ui/icons.js 注册表（24px 渲染）。</div>

  const mock = document.getElementById("mock");
  const out = document.getElementById("out");
  function render() {
    document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", SEL[c.dataset.slot] === c.dataset.name));
    const row = (slot) => `<div class="mi"><span class="mi-ic">${ICON[SEL[slot]] || ""}</span>${LABELS[slot]}<span class="ck">${ICON.check || ""}</span></div>`;
    mock.innerHTML = '<div class="mh">Markdown</div>' + row("preview") + row("source");
    out.textContent = `preview=${SEL.preview} · source=${SEL.source} · reveal=${SEL.reveal}`;
  }
  document.addEventListener("click", (e) => {
    const c = e.target.closest(".card");
    if (!c) return;
    SEL[c.dataset.slot] = c.dataset.name;
    render();
  });
  document.getElementById("copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText(out.textContent.replaceAll(" · ", "; "));
    document.getElementById("copy").textContent = "已复制";
    setTimeout(() => (document.getElementById("copy").textContent = "复制"), 1200);
  });
  render();
</script>
