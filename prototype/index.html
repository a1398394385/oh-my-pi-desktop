<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omp Desktop · 交互示例</title>
<style>
/* ── tokens ───────────────────────────────────────────────────────────── */
:root {
  --sidebar-w: 252px;
  --panel-w: 312px;
  --fs-2xs: 10.5px;
  --fs-xs: 11.5px;
  --fs-sm: 12.5px;
  --fs-base: 13.5px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: 22px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-pill: 999px;
  --dur: 180ms;
  --ease: cubic-bezier(.2, .7, .3, 1);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --canvas: #101010;
  --sidebar: #0b0b0b;
  --panel: #161616;
  --raised: #1c1c1c;
  --elevated: #232323;
  --hover: rgba(255, 255, 255, .05);
  --active: rgba(255, 255, 255, .09);
  --line: #1e1e1e;
  --line-strong: #2c2c2c;
  --text: #e9e9e9;
  --text-dim: #a2a2a2;
  --text-faint: #767676;
  --accent: #dcdcdc;
  --on-accent: #121212;
  --accent-soft: rgba(255, 255, 255, .09);
  --ok: #4ea85a;
  --warn: #cf9b45;
  --err: #d05c52;
  --sel: rgba(255, 255, 255, .16);
  --shadow: 0 16px 40px -16px rgba(0, 0, 0, .78), 0 2px 8px -2px rgba(0, 0, 0, .5);
  --code-bg: #171717;
}
:root[data-theme="light"] {
  --canvas: #ffffff;
  --sidebar: #fafafa;
  --panel: #ffffff;
  --raised: #f4f4f5;
  --elevated: #ffffff;
  --hover: rgba(0, 0, 0, .045);
  --active: rgba(0, 0, 0, .075);
  --line: #e8e8e8;
  --line-strong: #d6d6d6;
  --text: #1a1a1a;
  --text-dim: #5f5f5f;
  --text-faint: #757575;
  --accent: #1a1a1a;
  --on-accent: #ffffff;
  --accent-soft: rgba(0, 0, 0, .06);
  --ok: #1f7a37;
  --warn: #8a6100;
  --err: #c0271c;
  --sel: rgba(0, 0, 0, .12);
  --shadow: 0 16px 40px -18px rgba(0, 0, 0, .24), 0 2px 8px -2px rgba(0, 0, 0, .08);
  --code-bg: #f5f5f5;
}

/* ── base ─────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: var(--fs-base)/1.5 var(--sans);
  color: var(--text);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
::selection { background: var(--sel); color: var(--text); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border: 3px solid transparent;
  border-radius: var(--r-pill);
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ── shell ────────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--pane-w);
  grid-template-rows: 100%;
  height: 100vh;
  transition: grid-template-columns var(--dur) var(--ease);
}
.app[data-sidebar="collapsed"] { --sidebar-w: 0px; }
.app[data-pane="closed"] { --pane-w: 0px; }

/* ── right side pane ──────────────────────────────────────────────────── */
:root { --pane-w: 348px; }
.pane {
  background: var(--sidebar);
  border-left: 1px solid var(--line);
  min-width: 0;
  overflow: hidden;
  display: flex;
}
.pane-inner {
  width: 348px;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pane-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 9px;
  min-height: 44px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  overflow-y: hidden;
}
.pane-tabs::-webkit-scrollbar { height: 0; }
.pane-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  color: var(--text-dim);
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.pane-tab:hover { background: var(--hover); color: var(--text); }
.pane-tab[aria-selected="true"] { background: var(--raised); color: var(--text); }
.pane-tab .x { display: flex; color: inherit; opacity: .55; }
.pane-tab .x:hover { opacity: 1; }
.pane-empty { padding: 46px 20px; text-align: center; }
.pane-empty h2 { font-size: var(--fs-base); font-weight: 600; margin-bottom: 5px; }
.pane-empty p { font-size: var(--fs-sm); color: var(--text-faint); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 22px; }
.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 15px 6px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--panel);
  color: var(--text-dim);
  font-size: var(--fs-xs);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.tile:hover { background: var(--raised); border-color: var(--line-strong); color: var(--text); }
.tile svg.i { width: 17px; height: 17px; }
.pane-body { flex: 1; overflow-y: auto; min-height: 0; }

.term { padding: 13px 15px; font-family: var(--mono); font-size: var(--fs-xs); line-height: 1.75; color: var(--text-dim); }
.term .cmd { color: var(--text); }
.term .ok { color: var(--ok); }
.term .dim { color: var(--text-faint); }

.review-file {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 9px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  color: var(--text-dim);
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.review-file:hover { background: var(--hover); color: var(--text); }
.review-file[aria-selected="true"] { background: var(--active); color: var(--text); }
.review-file .p { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-file .n { margin-left: auto; font-family: var(--mono); font-size: var(--fs-2xs); white-space: nowrap; }
.review-file .n b { color: var(--ok); font-weight: 500; }
.review-file .n i { color: var(--err); font-style: normal; }
.review-list { padding: 8px; }
.diff-lines { border-top: 1px solid var(--line); font-family: var(--mono); font-size: var(--fs-2xs); line-height: 1.8; }
.diff-line { padding: 1px 13px; white-space: pre; overflow-x: auto; color: var(--text-faint); }
.diff-line.add { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
.diff-line.del { background: color-mix(in srgb, var(--err) 13%, transparent); color: var(--err); }

.browser-bar { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.browser-bar .url {
  flex: 1;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--text-dim);
  background: var(--raised);
  border-radius: var(--r-sm);
  padding: 5px 9px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.browser-stage { padding: 34px 20px; text-align: center; color: var(--text-faint); font-size: var(--fs-sm); }
.browser-stage .frame {
  margin-top: 16px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-md);
  padding: 26px 16px;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--text-dim);
}

.mini-chat { padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.mini-msg { font-size: var(--fs-sm); color: var(--text-dim); max-width: 92%; }
.mini-msg.me {
  align-self: flex-end;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 7px 10px;
  color: var(--text);
}
.mini-composer { border-top: 1px solid var(--line); padding: 8px; display: flex; gap: 6px; }
.mini-composer input {
  flex: 1;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 6px 9px;
  font-size: var(--fs-xs);
  outline: none;
}
.mini-composer input:focus { border-color: var(--accent); }
.mini-composer input::placeholder { color: var(--text-faint); }


/* ── sidebar ──────────────────────────────────────────────────────────── */
.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.sb-top {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 8px 10px;
  min-height: 44px;
}
.traffic { display: flex; gap: 8px; padding: 0 9px 0 3px; }
.traffic i { display: block; width: 12px; height: 12px; border-radius: 50%; }
.traffic .r { background: #ff5f57; }
.traffic .y { background: #febc2e; }
.traffic .g { background: #28c840; }
.sb-top .brand {
  font-size: var(--fs-sm);
  font-weight: 600;
  letter-spacing: .01em;
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  padding-left: 4px;
  color: var(--text-dim);
  white-space: nowrap;
}
.brand-mark { width: 16px; height: 16px; color: var(--accent); }
.sb-actions { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 10px; }
.sb-action {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border-radius: var(--r-md);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.sb-action:hover { background: var(--hover); color: var(--text); }
.sb-action .kbd { margin-left: auto; }
.kbd {
  font: var(--fs-2xs)/1 var(--mono);
  color: var(--text-faint);
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  padding: 3px 5px;
  letter-spacing: .04em;
}

.sb-scope {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px 8px;
  color: var(--text-faint);
}
.seg { display: flex; gap: 2px; background: var(--raised); padding: 2px; border-radius: var(--r-md); }
.seg button {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: var(--fs-xs);
  color: var(--text-faint);
  padding: 4px 9px;
  border-radius: 7px;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg button:hover { color: var(--text); }
.seg button[aria-selected="true"] { background: var(--elevated); color: var(--text); }
.seg svg.i { width: 13px; height: 13px; }
.sb-scope .spacer { margin-left: auto; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 28px;
  height: 28px;
  border-radius: var(--r-sm);
  color: var(--text-faint);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn[disabled] { opacity: .35; cursor: default; }
.icon-btn[disabled]:hover { background: none; color: var(--text-faint); }
.icon-btn.sm { width: 24px; height: 24px; }
.icon-btn.sm svg.i { width: 13px; height: 13px; }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }

/* task list */
.sb-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 8px 12px; }
.sb-group { margin-bottom: 10px; }
.sb-group-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px 4px;
  font-size: var(--fs-2xs);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.sb-group-head .n { color: var(--text-faint); font-variant-numeric: tabular-nums; }
.sb-group-head .add { margin-left: auto; opacity: 0; }
.sb-group:hover .sb-group-head .add { opacity: 1; }

.project { margin: 0 0 2px; }
.project-head {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--r-md);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.project-head:hover { background: var(--hover); color: var(--text); }
.project-head svg.i { width: 14px; height: 14px; }
.project-head .count { margin-left: auto; color: var(--text-faint); font-size: var(--fs-xs); }
.project-head .chev { transition: transform var(--dur) var(--ease); color: var(--text-faint); }
.project[data-open="false"] .chev { transform: rotate(-90deg); }
.project[data-open="false"] .project-body { display: none; }
.project-body { padding-left: 8px; }

.task {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--r-md);
  color: var(--text-dim);
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.task:hover { background: var(--hover); color: var(--text); }
.task[aria-current="true"] { background: var(--active); color: var(--text); }
.task[aria-current="true"] .task-title { font-weight: 550; }
.task-title {
  font-size: var(--fs-sm);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-meta { font-size: var(--fs-2xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.task-tools {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 1px;
  padding: 2px;
  border-radius: var(--r-sm);
  background: var(--elevated);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease);
}
.task:hover .task-tools, .task:focus-within .task-tools { opacity: 1; pointer-events: auto; }
.task:hover .task-meta { opacity: 0; }
.state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); flex: 0 0 auto; }
.state-dot[data-s="running"] { background: var(--accent); animation: pulse 1.6s var(--ease) infinite; }
.state-dot[data-s="done"] { background: var(--ok); }
.state-dot[data-s="failed"] { background: var(--err); }
.state-dot[data-s="confirm"] { background: var(--warn); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.tag {
  font: var(--fs-2xs)/1 var(--sans);
  padding: 3px 6px;
  border-radius: var(--r-sm);
  background: var(--raised);
  color: var(--text-faint);
}
.task .flag { color: var(--warn); }

.sb-empty { padding: 18px 12px; color: var(--text-faint); font-size: var(--fs-sm); text-align: center; }

.sb-foot {
  border-top: 1px solid var(--line);
  padding: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.account {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 7px;
  border-radius: var(--r-md);
  flex: 1;
  min-width: 0;
  text-align: left;
  transition: background var(--dur) var(--ease);
}
.account:hover { background: var(--hover); }
.avatar {
  width: 24px; height: 24px;
  border-radius: var(--r-sm);
  background: var(--elevated);
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  font-size: var(--fs-2xs); font-weight: 600; color: var(--text-dim);
  flex: 0 0 auto;
}
.account .who { min-width: 0; }
.account .name { font-size: var(--fs-sm); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account .plan { font-size: var(--fs-2xs); color: var(--text-faint); }

/* ── main column ──────────────────────────────────────────────────────── */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  min-height: 44px;
  border-bottom: 1px solid var(--line);
}
.topbar .where {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: var(--text-faint);
  padding: 4px 8px;
  border-radius: var(--r-sm);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.topbar .where:hover { background: var(--hover); color: var(--text-dim); }
.topbar .where .branch { color: var(--text-dim); }
.topbar h1 {
  font-size: var(--fs-sm);
  font-weight: 550;
  color: var(--text);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar .tools { display: flex; align-items: center; gap: 1px; }

.stream { flex: 1; overflow-y: auto; padding: 22px 0 28px; }
.stream-inner { max-width: 780px; margin: 0 auto; padding: 0 28px; }

.turn { margin-bottom: 26px; }
.turn-user { display: flex; justify-content: flex-end; }
.turn-user .bubble {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 9px 13px;
  max-width: 100%;
  font-size: var(--fs-base);
}
.said { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; max-width: 82%; }
.said .row { display: flex; gap: 3px; opacity: 0; transition: opacity var(--dur) var(--ease); }
.said:hover .row, .said:focus-within .row { opacity: 1; }
.stamp { font-size: var(--fs-2xs); color: var(--text-faint); }

.turn-agent { position: relative; padding-left: 0; }
.turn-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: var(--fs-xs); color: var(--text-faint); }
.turn-head .who { color: var(--text-dim); font-weight: 550; }
.turn-head .tools { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity var(--dur) var(--ease); }
.turn-agent:hover .turn-head .tools, .turn-agent:focus-within .turn-head .tools { opacity: 1; }
.prose { font-size: var(--fs-base); color: var(--text); }
.prose > * + * { margin-top: 9px; }
.prose h3 { font-size: var(--fs-base); font-weight: 600; }
.prose ul { padding-left: 18px; }
.prose li { margin-top: 4px; color: var(--text-dim); }
.prose li strong, .prose p strong { color: var(--text); font-weight: 600; }
.prose code {
  font-family: var(--mono);
  font-size: .92em;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 4px;
}
.prose .callout {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--r-md);
  padding: 9px 11px;
  font-size: var(--fs-sm);
  color: var(--text-dim);
}

.toollines { display: flex; flex-direction: column; gap: 2px; margin: 10px 0 12px; }
.toolline {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-sm);
  color: var(--text-faint);
  padding: 5px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.toolline:hover { background: var(--hover); color: var(--text-dim); }
.toolline .name { color: var(--text-dim); font-family: var(--mono); font-size: var(--fs-xs); }
.toolline .arg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolline .ok { color: var(--ok); margin-left: auto; }

.changecard {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-top: 12px;
}
.changecard-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 11px;
  font-size: var(--fs-sm);
  color: var(--text-dim);
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.changecard-head:hover { background: var(--hover); }
.changecard-head .plus { color: var(--ok); font-family: var(--mono); font-size: var(--fs-xs); }
.changecard-head .minus { color: var(--err); font-family: var(--mono); font-size: var(--fs-xs); }
.changecard-head .roll { margin-left: auto; }
.changecard-body { border-top: 1px solid var(--line); }
.changecard[data-open="false"] .changecard-body { display: none; }
.diffrow {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 11px;
  font-size: var(--fs-xs);
  color: var(--text-dim);
}
.diffrow + .diffrow { border-top: 1px solid var(--line); }
.diffrow .path { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diffrow .stat { margin-left: auto; font-family: var(--mono); font-size: var(--fs-2xs); color: var(--text-faint); }
.diffrow .stat b { color: var(--ok); font-weight: 500; }
.diffrow .stat i { color: var(--err); font-style: normal; }

.permission {
  border: 1px solid var(--line-strong);
  background: var(--panel);
  border-radius: var(--r-md);
  padding: 13px 14px;
  margin-top: 14px;
}
.permission-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.permission-head .ttl { font-size: var(--fs-base); font-weight: 600; }
.permission-head .when { margin-left: auto; font-size: var(--fs-2xs); color: var(--warn); }
.permission p { font-size: var(--fs-sm); color: var(--text-dim); }
.cmdbox {
  font-family: var(--mono);
  font-size: var(--fs-sm);
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  margin: 10px 0;
  color: var(--text);
  overflow-x: auto;
  white-space: pre;
}
.permission-actions { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
.permission-actions .grow { flex: 1; }
.permission.done { border-color: var(--line); background: var(--canvas); }
.permission.done .permission-actions { display: none; }
.verdict { font-size: var(--fs-sm); color: var(--text-dim); display: flex; align-items: center; gap: 7px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  background: var(--raised);
  color: var(--text);
  border: 1px solid var(--line);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.btn:hover { background: var(--elevated); border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 550; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--text-dim); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[disabled]:hover { background: var(--raised); border-color: var(--line); }
.btn .kbd { border-color: color-mix(in srgb, var(--on-accent) 30%, transparent); color: inherit; opacity: .7; }

.thinking { display: inline-flex; align-items: center; gap: 6px; color: var(--text-faint); font-size: var(--fs-sm); }
.thinking .d { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dotPulse 1.4s cubic-bezier(.16, 1, .3, 1) infinite; }
.thinking .d:nth-child(2) { animation-delay: .15s; }
.thinking .d:nth-child(3) { animation-delay: .3s; }
@keyframes dotPulse { 0%, 100% { opacity: .35; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

.caret {
  display: inline-block;
  width: 7px; height: 15px;
  vertical-align: -2px;
  margin-left: 1px;
  background: var(--accent);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.empty-session {
  max-width: 480px;
  margin: 14vh auto 0;
  text-align: center;
  color: var(--text-faint);
}
.empty-session h2 { font-size: var(--fs-md); font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-session p { font-size: var(--fs-sm); }
.empty-session ul { list-style: none; margin-top: 18px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.empty-session li { font-size: var(--fs-sm); padding: 7px 10px; border-radius: var(--r-md); display: flex; gap: 9px; align-items: center; }
.empty-session li:hover { background: var(--hover); color: var(--text-dim); }
.empty-session li .mono { color: var(--text-dim); font-size: var(--fs-xs); }

/* ── composer ─────────────────────────────────────────────────────────── */
.composer-wrap { padding: 0 28px 16px; }
.composer {
  max-width: 780px;
  margin: 0 auto;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  border-radius: var(--r-lg);
  position: relative;
  transition: border-color var(--dur) var(--ease);
}
.composer:focus-within { border-color: var(--accent); }
.composer.dragover { border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 11px 0; }
.chips:empty { display: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--fs-xs);
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: var(--r-sm);
  padding: 3px 7px;
}
.chip svg.i { width: 12px; height: 12px; }
.chip button { display: flex; color: inherit; opacity: .7; }
.chip button:hover { opacity: 1; }
.composer textarea {
  width: 100%;
  resize: none;
  padding: 11px 13px 4px;
  font-size: var(--fs-base);
  line-height: 1.55;
  max-height: 168px;
  outline: none;
}
.composer textarea::placeholder { color: var(--text-faint); }
.composer-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 5px 7px 7px 8px;
}
.composer-bar .grow { flex: 1; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  color: var(--text-dim);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  white-space: nowrap;
}
.pill:hover { background: var(--hover); color: var(--text); }
.pill svg.i { width: 13px; height: 13px; }
.pill[data-tone="warn"] { color: var(--warn); }
.meter { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: var(--fs-xs); color: var(--text-faint); }
.meter .bar { width: 44px; height: 4px; border-radius: var(--r-pill); background: var(--raised); overflow: hidden; }
.meter .fill { height: 100%; width: 100%; transform: scaleX(.06); transform-origin: left center; background: var(--accent); border-radius: inherit; transition: transform var(--dur) var(--ease); }
.send {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--raised);
  color: var(--text-faint);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.send[data-ready="true"] { background: var(--accent); color: var(--on-accent); }
.send[data-ready="true"]:hover { filter: brightness(1.08); }
.send[data-stop="true"] { background: var(--err); color: #fff; }
.hintline {
  max-width: 780px;
  margin: 7px auto 0;
  display: flex;
  gap: 14px;
  font-size: var(--fs-2xs);
  color: var(--text-faint);
  padding: 0 3px;
}

/* ── status panel ─────────────────────────────────────────────────────── */
.panel {
  position: absolute;
  top: 54px;
  right: 14px;
  width: var(--panel-w);
  max-height: calc(100% - 132px);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  z-index: 5;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.panel[data-mode="mini"] {
  width: auto;
  max-height: none;
  border-radius: var(--r-pill);
}
.panel[data-mode="mini"] .panel-body { display: none; }
.panel[data-mode="mini"] .panel-head { padding: 6px 11px 6px 8px; border-bottom: 0; }
.panel[data-mode="mini"] .panel-head .title,
.panel[data-mode="mini"] .mode-btn { display: none; }
.panel[data-mode="hidden"] { opacity: 0; transform: translateY(-6px); pointer-events: none; }
.panel-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  cursor: default;
}
.panel-head .title { font-size: var(--fs-sm); font-weight: 600; }
.panel-head .progress { font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.panel-head .spacer { flex: 1; }
.panel-body { overflow-y: auto; padding: 4px 0 8px; }
.psec { padding: 7px 10px 9px; }
.psec + .psec { border-top: 1px solid var(--line); }
.psec-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-2xs);
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 2px 2px 7px;
}
.psec-head .n { margin-left: auto; font-variant-numeric: tabular-nums; }

.todo {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 6px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  color: var(--text-dim);
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.todo:hover { background: var(--hover); color: var(--text); }
.todo .box {
  width: 14px; height: 14px;
  margin-top: 2px;
  border: 1.5px solid var(--line-strong);
  border-radius: 4px;
  display: grid; place-items: center;
  color: transparent;
  flex: 0 0 auto;
}
.todo[data-done="true"] .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo[data-done="true"] .label { color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.todo[data-active="true"] .box { border-color: var(--accent); }
.todo.flash { animation: flash 900ms var(--ease); }
@keyframes flash { 0%, 100% { background: none; } 25% { background: var(--accent-soft); } }
.fold {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: var(--text-faint);
  padding: 4px 6px;
  border-radius: var(--r-sm);
  width: 100%;
  text-align: left;
}
.fold:hover { background: var(--hover); color: var(--text-dim); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: var(--fs-sm); }
.kv dt { color: var(--text-faint); }
.kv dd { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv dd .mono { font-size: var(--fs-xs); }
.rowitem {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-sm);
  color: var(--text-dim);
  padding: 5px 6px;
  border-radius: var(--r-sm);
  width: 100%;
  text-align: left;
}
.rowitem:hover { background: var(--hover); color: var(--text); }
.rowitem .mono { font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowitem .right { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; flex: 0 0 auto; }
.spinner {
  width: 11px; height: 11px;
  border: 1.5px solid var(--line-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── menus & overlays ─────────────────────────────────────────────────── */
.menu {
  position: fixed;
  z-index: 40;
  min-width: 208px;
  background: var(--elevated);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 5px;
}
.menu[hidden] { display: none; }
.menu-label {
  font-size: var(--fs-2xs);
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 6px 8px 4px;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  color: var(--text-dim);
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.menu-item:hover, .menu-item[data-focus="true"] { background: var(--hover); color: var(--text); }
.menu-item .right { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
.menu-item .check { color: var(--accent); visibility: hidden; }
.menu-item[aria-checked="true"] .check { visibility: visible; }
.menu-item[disabled] { opacity: .42; cursor: default; }
.menu-item[disabled]:hover { background: none; color: var(--text-dim); }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu.danger .menu-item { color: var(--err); }

.palette {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--canvas) 55%, transparent);
  backdrop-filter: blur(3px);
  display: grid;
  align-items: start;
  justify-items: center;
  padding-top: 14vh;
}
.palette[hidden] { display: none; }
.palette-box {
  width: min(560px, 92vw);
  background: var(--elevated);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.palette-box input {
  width: 100%;
  padding: 13px 15px;
  font-size: var(--fs-md);
  outline: none;
  border-bottom: 1px solid var(--line);
}
.palette-box input::placeholder { color: var(--text-faint); }
.palette-list { max-height: 46vh; overflow-y: auto; padding: 5px; }

/* ── responsive ───────────────────────────────────────────────────────── */
@media (max-width: 1280px) {
  :root { --panel-w: 288px; --pane-w: 304px; }
  .stream-inner, .composer { max-width: 700px; }
  .pane-inner { width: 304px; }
}
@media (max-width: 1080px) {
  :root { --sidebar-w: 232px; }
  .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .panel { top: 52px; right: 10px; }
  .pane {
    position: fixed;
    inset: 0 0 0 auto;
    width: 336px;
    max-width: 92vw;
    z-index: 28;
    border-left: 1px solid var(--line-strong);
    box-shadow: var(--shadow);
    transform: translateX(102%);
    transition: transform var(--dur) var(--ease);
  }
  .app[data-pane="open"] .pane { transform: none; }
  .pane-inner { width: 100%; }
}
@media (max-width: 900px) {
  :root { --sidebar-w: 0px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 268px;
    z-index: 30;
    box-shadow: var(--shadow);
    transform: translateX(-100%);
    transition: transform var(--dur) var(--ease);
  }
  .app[data-sidebar="open"] .sidebar { transform: none; }
  .app[data-sidebar="open"] .scrim { opacity: 1; pointer-events: auto; }
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease);
    z-index: 25;
  }
  .panel { width: min(340px, calc(100% - 20px)); }
  .stream-inner { padding: 0 16px; }
  .composer-wrap { padding: 0 16px 12px; }
  .hintline { padding: 0; }
}
@media (max-width: 620px) {
  .topbar .tools .icon-btn[data-act="vscode"],
  .topbar .tools .icon-btn[data-act="share"],
  .topbar .tools .icon-btn[data-act="help"] { display: none; }
  .topbar h1 { font-size: var(--fs-xs); }
  .meter .bar { display: none; }
  .hintline span:first-child { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>

      if (it.label && !it.onClick) return `<div class="menu-label">${esc(it.label)}</div>`;

    }).join("");
    menu.className = "menu" + (opts.danger ? " danger" : "");
    menu.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = menu.offsetWidth, h = menu.offsetHeight;
    let left = opts.align === "right" ? r.right - w : r.left;
    let top = opts.below === false ? r.top - h - 6 : r.bottom + 6;
    left = Math.min(Math.max(8, left), innerWidth - w - 8);
    top = Math.min(Math.max(8, top), innerHeight - h - 8);
    menu.style.left = left + "px";

    menu.onclick = (e) => {

      const it = items[+b.dataset.i];
      closeMenu();
      it.onClick?.();

  const toggleSidebar = () => { ui.sidebar = ui.sidebar === "open" ? "collapsed" : "open"; syncChrome(); };
  const setTheme = (t) => { ui.theme = t; document.documentElement.dataset.theme = t; };

  function openCommit() {
    const s = active();
    showToast(`提交更改 · ${s.changes.files} 个文件（示例中不执行真实 Git 操作）`);
  }

  let toastTimer;
  function showToast(text) {
    let el = $("#toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      Object.assign(el.style, {
        position: "fixed", left: "50%", bottom: "86px", transform: "translateX(-50%)",
        background: "var(--elevated)", border: "1px solid var(--line-strong)", color: "var(--text)",
        padding: "8px 14px", borderRadius: "10px", fontSize: "12.5px", boxShadow: "var(--shadow)",
        zIndex: "60", transition: "opacity 180ms", maxWidth: "70vw",
      });
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
  }

  /* 发送与模拟流式回复 */
  const stopStream = () => {
    ui.streaming = false;
    clearInterval(streamTimer);
    const btn = $("#sendBtn");
    btn.dataset.stop = "false";
    const s = active();
    const live = $("#liveText");
    if (live && live.textContent) {
      s.turns.push({ role: "agent", work: "8秒", html: `<p>${esc(live.textContent)}</p><p class="stamp">（输出被手动停止）</p>` });
    }
    renderStream();
  };
  let streamTimer = null;

  function send(text) {
    const s = active();
    if (!s) return;
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    s.turns.push({ role: "user", text, time });
    s.state = "running";
    s.updated = "刚刚";
    if (s.title === "新任务") s.title = text.slice(0, 18);
    ui.streaming = true;
    renderAll();

    const reply = pickReply(text);
    let i = 0;
    const live = $("#liveText");
    streamTimer = setInterval(() => {
      if (!ui.streaming) return;
      i += 2;
      const slice = reply.slice(0, i);
      const live = $("#liveText");
      if (live) live.innerHTML = esc(slice) + (i < reply.length ? `<span class="caret"></span>` : "");
      const st = $("#stream");
      st.scrollTop = st.scrollHeight;
      if (i >= reply.length) {
        clearInterval(streamTimer);
        ui.streaming = false;
        s.turns.push({ role: "agent", work: "6秒", html: `<p>${esc(reply)}</p>` });
        s.state = "ready";
        s.todos.push({ label: "处理：" + text.slice(0, 16), done: false, msg: s.turns.length });
        renderAll();
      }
    }, 28);
    const btn = $("#sendBtn");
    btn.dataset.stop = "true";
  }

  function pickReply(text) {
    if (/测试|test/i.test(text)) return "收到。我会先跑一遍单 worker 的定向测试（--no-file-parallelism --maxWorkers=1），确认红/绿状态后再决定改哪里。结果出来我会贴命令和输出摘要。";
    if (/为什么|什么|如何|怎么/.test(text)) return "我先不动代码，先看三处证据：调用链、落库记录、以及最近一次改动的时间戳。确认清楚再给结论——如果三者对不上，我会把矛盾点单独列出来等你拍板。";
    if (/^@/.test(text)) return "已把引用的上下文挂到这一轮。接下来我会只在这份材料范围内作答，跨出范围的推断会显式标注。";
    return "明白，我先在这个工作区做最小范围的改动：只碰与这个问题直接相关的文件，跑一遍定向测试确认没有回归，然后把改动清单和验证结果给你。";
  }

  /* ── 事件 ───────────────────────────────────────────────────────────── */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (el) {
      const act = el.dataset.act;
      const s = sessions.find((x) => x.id === el.dataset.id);
      if (act === "open" && s) { ui.activeId = s.id; renderAll(); return; }
      if (act === "pin" && s) { s.pinned = !s.pinned; renderSidebar(); return; }
      if (act === "archive" && s) {
        s.state = s.state === "done" ? s.state : s.state;
        s.archived = true;
        const i = sessions.indexOf(s); sessions.splice(i, 1);
        if (ui.activeId === s.id) ui.activeId = sessions[0]?.id;
        renderAll(); showToast(`已归档「${s.title}」（示例中可直接点撤销回不来，刷新页面即可还原）`);
        return;
      }
      if (act === "task-menu" && s) {
        openMenu(el, [
          { label: "重命名任务", icon: "edit", onClick: () => { const t = prompt("任务名称", s.title); if (t) { s.title = t; renderAll(); } } },
          { label: s.pinned ? "取消置顶任务" : "置顶任务", icon: "pin", onClick: () => { s.pinned = !s.pinned; renderAll(); } },
          { label: "标记为未读", icon: "check-circle", onClick: () => showToast("已标记为未读（示例）") },
          { label: "在分屏打开", icon: "panel-right", onClick: () => showToast("已请求在分屏打开（示例）") },
          { sep: true },
          { label: "查看调用轨迹", icon: "target", onClick: () => showToast("调用轨迹面板未包含在本示例中") },
          { label: "反馈问题", icon: "help", onClick: () => showToast("已打开反馈，并自动带上当前任务信息（示例）") },
          { sep: true },
          { label: "归档任务", icon: "archive", onClick: () => { sessions.splice(sessions.indexOf(s), 1); if (ui.activeId === s.id) ui.activeId = sessions[0]?.id; renderAll(); } },
          { label: "删除任务", icon: "trash", danger: true, onClick: () => showToast("删除需要二次确认，本示例未实现") },
        ], { align: "right" });
        return;
      }
      if (act === "fold-project") {
        const id = el.dataset.id;
        ui.collapsed.has(id) ? ui.collapsed.delete(id) : ui.collapsed.add(id);
        renderSidebar(); return;
      }
      if (act === "toggle-sidebar") { toggleSidebar(); return; }
      if (act === "new-session") { newSession(); return; }
      if (act === "palette") { openPalette(); return; }
      if (act === "sort-menu") {
        openMenu(el, [
          { label: "排序方式" },
          { label: "更新时间", checked: ui.sort === "updated", onClick: () => { ui.sort = "updated"; renderSidebar(); } },
          { label: "创建时间", checked: ui.sort === "created", onClick: () => { ui.sort = "created"; renderSidebar(); } },
        ], { align: "right" });
        return;
      }
      if (act === "account-menu") {
        openMenu(el, [
          { label: "本地用户 · Pro", icon: "users" },
          { sep: true },
          { label: "浅色主题", icon: "model", checked: ui.theme === "light", onClick: () => setTheme("light") },
          { label: "深色主题", icon: "model", checked: ui.theme === "dark", onClick: () => setTheme("dark") },
          { sep: true },
          { label: "下载日志", icon: "file", onClick: () => showToast("正在导出日志…（示例）") },
          { label: "设置", icon: "settings", onClick: () => showToast("设置中心不在本示例范围内") },
        ], { below: false });
        return;
      }
      if (act === "mobile") { showToast("移动端远程控制不在本示例范围内"); return; }
      if (act === "settings") { showToast("设置中心不在本示例范围内"); return; }
      if (act === "branch-menu") {
        const s = active();
        openMenu(el, [
          { label: "分支", icon: "branch" },
          { label: el.querySelector("#whereBranch").textContent, checked: true, onClick: () => {} },
          { label: "codex/rpc-ui-client", onClick: () => { showToast("已切换到分支 codex/rpc-ui-client（示例）"); } },
          { sep: true },
          { label: "创建并检出新分支…", icon: "plus", onClick: () => showToast("创建分支对话框未包含在示例中") },
        ]);
        return;
      }
      if (act === "session-menu") {
        openMenu(el, [
          { label: "重命名任务", icon: "edit", onClick: () => showToast("直接在标题上双击可重命名（示例未实现）") },
          { label: "复制任务链接", icon: "share", onClick: () => showToast("已复制链接（示例）") },
          { sep: true },
          { label: "分叉会话", icon: "branch", onClick: () => showToast("已从当前轮次分叉（示例）") },
          { label: "导出为 Markdown", icon: "file", onClick: () => showToast("导出未包含在示例中") },
        ], { align: "right" });
        return;
      }
      if (act === "vscode") { showToast("在 VS Code 中打开：" + projectOf(active().project).name); return; }
      if (act === "share") { showToast("分享会话：示例中未实现权限模型"); return; }
      if (act === "help") { showToast("帮助：⌘K 命令面板 · @ 添加上下文 · Enter 发送"); return; }
      if (act === "terminal") { openTab("terminal"); return; }
      if (act === "toggle-pane") { ui.pane = ui.pane === "open" ? "closed" : "open"; syncChrome(); return; }
      if (act === "open-tab") { openTab(el.dataset.kind); return; }
      if (act === "select-tab") { ui.activeTab = el.dataset.kind; renderPane(); return; }
      if (act === "close-tab") {
        const kind = el.dataset.kind;
        ui.tabs = ui.tabs.filter((t) => t.kind !== kind);
        if (ui.activeTab === kind) ui.activeTab = ui.tabs[0]?.kind || null;
        renderPane();
        return;
      }
      if (act === "review-pick") { ui.reviewPick = +el.dataset.i; renderPane(); return; }
      if (act === "browser-reload") { showToast("已重新加载预览（示例）"); return; }
      if (act === "mini-send") {
        const v = $("#miniInput")?.value.trim();
        if (v) { ui.miniLog.push(v); renderPane(); $("#miniInput")?.focus(); }
        return;
      }
      if (act === "panel-mini") { ui.panelMode = ui.panelMode === "mini" ? "expanded" : "mini"; syncChrome(); return; }
      if (act === "panel-mode") {
        openMenu(el, [
          { label: "状态面板展开策略" },
          { label: "自动展开", checked: false, onClick: () => { ui.panelMode = "expanded"; syncChrome(); } },
          { label: "始终展开", checked: ui.panelMode === "expanded", onClick: () => { ui.panelMode = "expanded"; syncChrome(); } },
          { label: "始终收起", checked: ui.panelMode === "mini", onClick: () => { ui.panelMode = "mini"; syncChrome(); } },
        ], { align: "right" });
        return;
      }
      if (act === "fold-done") { ui.folds.done = !ui.folds.done; renderPanel(); return; }
      if (act === "goto") {
        const id = el.dataset.msg;
        if (id) {
          const t = $("#msg-" + id);
          if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.firstElementChild?.classList.add("flash"); }
        }
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 900);
        return;
      }
      if (act === "toggle-changes") {
        const card = el.closest(".changecard");
        card.dataset.open = card.dataset.open === "true" ? "false" : "true";
        const use = el.querySelector(".roll svg use");
        if (use) use.setAttribute("href", card.dataset.open === "true" ? "#ic-chevron-up" : "#ic-chevron-down");
        return;
      }
      if (act === "permit") {
        ui.decided.add(`${ui.activeId}:${el.dataset.idx}`);
        const card = el.closest(".permission");
        const granted = el.dataset.grant;
        card.classList.add("done");
        card.innerHTML = `<div class="verdict">${ic("check-circle")}${esc(granted)}：${esc(card.querySelector(".cmdbox").textContent)}</div>`;
        const s = active();
        if (s.state === "confirm") { s.state = "running"; renderSidebar(); }
        return;
      }
      if (act === "mode-menu") {
        openMenu(el, ["完全访问", "自动编辑", "计划模式"].map((m) => ({
          label: m, checked: active().mode === m, icon: "shield",
          onClick: () => { active().mode = m; syncChrome(); },
        })), { below: false });
        return;
      }
      if (act === "model-menu") {
        openMenu(el, ["GLM-5.3", "GLM-5.3-Flash", "deepseek-flash", "MiniMax-M3"].map((m) => ({
          label: m, checked: active().model === m, icon: "model",
          onClick: () => { active().model = m; syncChrome(); },
        })).concat([{ sep: true }, { label: "管理模型…", icon: "settings", onClick: () => showToast("模型管理在设置中心，本示例不含") }]), { below: false, align: "right" });
        return;
      }
      if (act === "effort-menu") {
        openMenu(el, ["关闭", "低", "中", "高", "极高", "最高"].map((m) => ({
          label: m, checked: active().effort === m, icon: "gauge",
          onClick: () => { active().effort = m; syncChrome(); },
        })), { below: false, align: "right" });
        return;
      }
      if (act === "attach") { showToast("支持拖拽文件、粘贴图片；本示例只演示提示"); return; }
      if (act === "commit") { openCommit(); return; }
      if (act === "copy") { showToast("已复制（示例）"); return; }
      if (act === "thumb") { el.classList.toggle("on"); return; }
      if (act === "fork") { showToast("已从当前轮次分叉会话（示例）"); return; }
      if (act === "edit") { showToast("编辑该消息未包含在示例中"); return; }
      if (act === "tool-line") { showToast("工具调用详情面板未包含在本示例中"); return; }
    }
  });

  $$("#viewSeg button").forEach((b) => b.addEventListener("click", () => { ui.view = b.dataset.view; renderAll(); }));

  const input = $("#input");
  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(168, input.scrollHeight) + "px"; }
  function syncSend() { $("#sendBtn").dataset.ready = String(input.value.trim().length > 0 && !ui.streaming); }
  input.addEventListener("input", () => { autoGrow(); syncSend(); mentionHint(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  function mentionHint() {
    if (/@$/.test(input.value)) showToast("输入内容可搜索文件、技能、子智能体或历史会话（示例只演示提示）");
  }

  function submit() {
    if (ui.streaming) { stopStream(); return; }
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; autoGrow(); syncSend();
    send(text);
  }
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  $("#sendBtn").addEventListener("click", (e) => { e.preventDefault(); submit(); });

  addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod && (e.key === "Enter" || e.key === " ") && e.target instanceof HTMLElement && e.target.dataset.act && e.target.tagName !== "BUTTON") {
      e.preventDefault(); e.target.click(); return;
    }
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); palette.hidden ? openPalette() : closePalette(); return; }
    if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSidebar(); return; }
    if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); newSession(); return; }
    if (e.key === "Escape") { if (!palette.hidden) closePalette(); else if (!menu.hidden) closeMenu(); }
  });

  $("#scrim").addEventListener("click", () => { ui.sidebar = "closed"; syncChrome(); });

  /* 窄屏时默认折叠侧栏，面板改为覆盖 */
  const mq = window.matchMedia("(max-width: 900px)");
  mq.addEventListener("change", (e) => {
    ui.sidebar = e.matches ? "closed" : "open";
    syncChrome();
  });

  renderAll();
  autoGrow();
  syncSend();
})();
</script>
</body>
</html>
